  ctx.save();
  ctx.fillStyle = 'rgba(253,248,236,0.97)';
  ctx.beginPath(); ctx.roundRect(B.x - 14, B.y - 14, B.w + 28, B.h + 28, 14); ctx.fill();
  ctx.restore();

  crayonText(tr('jam'), W / 2, p.y + 34, 24, C.cream);
  if (save.jamBest > 0) crayonText(tr('jamBest', save.jamBest), W / 2, p.y + 60, 16, C.yellow);

  const list = caughtBugs();
  if (!list.length) {
    crayonText(tr('jamEmpty'), W / 2, B.y + B.h / 2, Math.min(18, B.w * 0.035), C.gray);
    crayonButton('jam-close', W / 2 - 70, B.y + B.h + 20, 140, 40, tr('close'), { color: C.brown });
    return;
  }

  // ---- 무대: 슬롯 3개 ----
  crayonText(tr('jamPick'), W / 2, B.y + 16, Math.min(17, B.w * 0.032), C.darkBrown);
  const slotW = Math.min(150, B.w * 0.22), slotH = 96;
  const sx0 = W / 2 - (slotW * JAM_SLOTS + 14 * (JAM_SLOTS - 1)) / 2;
  for (let i = 0; i < JAM_SLOTS; i++) {
    const x = sx0 + i * (slotW + 14), y = B.y + 34;
    const b = game.jamBugs[i];
    crayonButton('jam-slot', x, y, slotW, slotH, '',
      { color: b ? C.orange : C.gray, dim: !b, data: i, noHit: !b });
    if (b) {
      drawBug(b, x + slotW / 2, y + slotH * 0.38, Math.min(0.75, slotW / 190));
      fitText(bugName(b), x + slotW / 2, y + slotH * 0.82, slotW - 12, 13, C.darkBrown);
    } else {
      crayonText(tr('jamSlot'), x + slotW / 2, y + slotH * 0.45, 34, C.gray);
    }
  }

  // ---- 잡은 곤충 고르기 (한 페이지 12마리) ----
  const gy0 = B.y + 34 + slotH + 18;
  const cols = 6, rows = 2, per = cols * rows;
  const pages = Math.max(1, Math.ceil(list.length / per));
  game.jamPage = Math.max(0, Math.min(pages - 1, game.jamPage));
  const cw = B.w / cols, chh = Math.max(64, (B.y + B.h - gy0 - 4) / rows);
  const from = game.jamPage * per;
  for (let i = from; i < Math.min(from + per, list.length); i++) {
    const b = list[i], k = i - from;
    const x = B.x + (k % cols) * cw, y = gy0 + Math.floor(k / cols) * chh;
    const onStage = game.jamBugs.includes(b);
    crayonPath([[x + 4, y + 3], [x + cw - 4, y + 3], [x + cw - 4, y + chh - 5],
                [x + 4, y + chh - 5], [x + 4, y + 3]],
      { color: onStage ? C.orange : C.gray, width: onStage ? 3.5 : 2, seed: 880 + i, alpha: onStage ? 1 : 0.4 });
    ctx.save();
    if (onStage) ctx.globalAlpha = 0.35;      // 이미 무대에 올린 곤충은 흐리게
    drawBug(b, x + cw / 2, y + chh * 0.4, Math.min(0.6, cw / 150));
    ctx.restore();
    fitText(bugName(b), x + cw / 2, y + chh * 0.83, cw - 8, 11, onStage ? C.gray : C.darkBrown);
    if (!onStage) hotspots.push({ id: 'jam-add', x, y, w: cw, h: chh, data: b });
  }

  const navY = B.y + B.h + 20;
  const ready = game.jamBugs.filter(Boolean).length === JAM_SLOTS;
  crayonButton('jam-go', W / 2 - 100, navY, 200, 40, tr('jamStart'),
    { size: 17, color: ready ? C.green : C.gray, dim: !ready, noHit: !ready });
  crayonButton('jam-close', W / 2 - 100 - 96, navY, 88, 40, tr('close'), { size: 15, color: C.brown });
  if (pages > 1) {
    const first = game.jamPage === 0, last = game.jamPage === pages - 1;
    crayonButton('jam-prev', W / 2 + 108, navY, 44, 40, '◀',
      { size: 18, color: C.gray, dim: first, noHit: first });
    crayonButton('jam-next', W / 2 + 156, navY, 44, 40, '▶',
      { size: 18, color: C.gray, dim: last, noHit: last });
  }
}

// ---------- 그림 갤러리 (개발·검토용, #gallery) ----------
// 곤충 36마리 그림만 한눈에. 칸을 누르면 그 곤충의 울음이 들린다.
function drawGallery(t) {
  ctx.fillStyle = C.paper;
  ctx.fillRect(0, 0, W, H);

  const top = 74, bottom = 66;
  const cols = W < 900 ? 4 : 6;
  const rows = Math.ceil(BUGS.length / cols);
  const cw = W / cols, ch = (H - top - bottom) / rows;
  const s = Math.min(cw / 150, ch / 105);

  crayonText(tr('galTitle', BUGS.length), W / 2, 38, 24, C.darkBrown);

  BUGS.forEach((b, i) => {
    const gx = (i % cols) * cw, gy = top + Math.floor(i / cols) * ch;
    crayonPath([[gx + 4, gy + 3], [gx + cw - 4, gy + 3], [gx + cw - 4, gy + ch - 3],
                [gx + 4, gy + ch - 3], [gx + 4, gy + 3]],
      { color: b.rare ? C.yellow : C.gray, width: b.rare ? 3.5 : 2, seed: 950 + i, alpha: b.rare ? 1 : 0.35 });
    drawBug(b, gx + cw / 2, gy + ch * 0.42, s);
    crayonText(bugName(b), gx + cw / 2, gy + ch * 0.82, Math.min(14, cw * 0.1), C.darkBrown);
    crayonText(LX(b.cry), gx + cw / 2, gy + ch * 0.95, Math.min(11, cw * 0.08), C.gray);
    hotspots.push({ id: 'gal-cell', x: gx, y: gy, w: cw, h: ch, data: b });
  });

  crayonButton('gal-close', W / 2 - 70, H - bottom + 12, 140, 40, tr('close'), { color: C.brown });
}

// ---------- 게임 화면 ----------
function draw(t) {
  hotspots = [];
  applyTransform(ctx);
  ctx.clearRect(0, 0, W, H);

  // 폰 세로 — 가로로 돌려달라고만 안내한다 (세로에선 리듬 UI가 다 안 들어간다)
  if (PORTRAIT) {
    ctx.fillStyle = C.desk;
    ctx.fillRect(0, 0, W, H);
    fitText(LANG === 'ko' ? '폰을 가로로 돌려줘! 🔄' : 'Please rotate your phone! 🔄',
      W / 2, H / 2 - 20, W - 40, 30, C.cream);
    fitText(LANG === 'ko' ? '가로 화면에서 하는 게임이에요' : 'This game plays in landscape',
      W / 2, H / 2 + 24, W - 40, 17, C.yellow);
    return;
  }

  if (sceneCanvas && sceneCanvas.width && sceneCanvas.height) {
    ctx.drawImage(sceneCanvas, 0, 0, W, H);
  }
  const p = SCENE.paper;

  // ---- 잠자리채 + 곤충 ----
  // swingFreeze는 미리보기 전용 — 헤드리스에선 가상 시간이 확 흘러 연출이 끝나버린다
  const swingU = game.swingFreeze != null ? game.swingFreeze
               : (game.swingAt ? (t - game.swingAt) / SWING_MS : 1);
  const swinging = game.state === 'result' && swingU < 1;
  const ang = swinging ? swingAngle(swingU) : NET_REST;

  if (game.state !== 'menu' && game.state !== 'dex' && game.state !== 'gallery') {
    drawNet(ang);
    // 확 휘두르는 구간엔 휙 하는 선을 몇 줄
    if (swinging && swingU > 0.3 && swingU < 0.62) {
      const h = netHoopXY(ang);
      for (let i = -1; i <= 1; i++) {
        crayonPath([[h.x - 60, h.y - 34 + i * 16], [h.x - 22, h.y - 28 + i * 14]],
          { color: C.gray, width: 3, seed: 480 + i, alpha: 0.5 });
      }
    }
  }

  if (game.jam && (game.state === 'call' || game.state === 'echo' || game.state === 'result')) {
    // 합주: 세 마리가 무대에 나란히. 지금 우는(또는 쳐야 할) 곤충이 위로 통통 뛴다
    const idx = game.state === 'call' ? game.notesPlayed - 1 : (game.anchor ? game.ni - 1 : -1);
    const cur = idx >= 0 ? noteBugAt(Math.min(idx, game.noteBugs.length - 1)) : null;
    game.jamBugs.forEach((b, i) => {
      const x = SCENE.bugX + (i - 1) * Math.min(120, p.w * 0.11);
      const on = b === cur;
      const bob = on ? Math.abs(Math.sin(t / 130)) * 14 : Math.sin(t / 400 + i) * 4;
      drawBug(b, x, SCENE.bugY - bob, on ? 1.35 : 1.05);
    });
  } else if (game.bug && (game.state === 'call' || game.state === 'echo')) {
    // 덤불 위에서 살짝 둥실둥실
    drawBug(game.bug, SCENE.bugX, SCENE.bugY + Math.sin(t / 400) * 4, 1.4);
  } else if (game.bug && swinging) {
    const h = netHoopXY(ang);
    if (game.caughtBug) {
      // 잡힘: 채가 지나가는 순간 곤충이 후프 안으로 빨려 들어간다
      if (swingU < 0.62) {
        const k = Math.max(0, (swingU - 0.28) / 0.34);
        const e = k * k * (3 - 2 * k);   // 부드럽게
        drawBug(game.bug, SCENE.bugX + (h.x - SCENE.bugX) * e,
                SCENE.bugY + (h.y - SCENE.bugY) * e, 1.4 - 0.5 * e);
      }
      // 0.62 이후엔 채 안에 들어간 것 — 안 그린다
    } else {
      // 놓침: 채를 피해 위로 날아가 버린다
      const k = Math.min(1, swingU / 0.8);
      ctx.save();
      ctx.globalAlpha = 1 - k * k;
      drawBug(game.bug, SCENE.bugX + 90 * k, SCENE.bugY - 150 * k, 1.4);
      ctx.restore();
    }
  }

  if (game.state === 'gallery') { drawGallery(t); return; }
  if (game.state === 'menu') { drawMenu(t); return; }
  if (game.state === 'dex') { drawDex(t); return; }
  if (game.state === 'shop') { drawShop(t); return; }
  if (game.state === 'achv') { drawAchv(t); return; }
  if (game.state === 'jam') { drawJamStage(t); return; }
  if (game.state === 'stats') { drawStats(t); return; }

  const night = save.spot === 'night';
  const headC = night ? C.cream : C.darkBrown;

  if (game.state === 'waiting') {
    if (game.practice) {
      crayonText(tr('pracWait'), W / 2, p.y + p.h * 0.1, 22, headC);
    } else {
      crayonText(tr(night ? 'waitingN' : 'waiting'), W / 2, p.y + p.h * 0.1, 22, headC);
      const sh = Math.sin(t / 300) * 2;
      if (t > game.biteAt - 900) crayonText('!', SCENE.bugX + sh, SCENE.bugY, 34, night ? C.yellow : C.redDark);
    }
  }

  if (game.state === 'call') {
    crayonText(tr(game.jam ? 'jamListen' : 'listen'), W / 2, p.y + p.h * 0.1, game.jam ? 22 : 26,
      night ? C.skyBlue : C.navy);
    if (game.replays > 0) {
      const txt = game.practice ? tr('againP') : tr('again', game.replays, MAX_REPLAYS);
      crayonText(txt, W / 2, p.y + p.h * 0.1 + 30, 17, C.gray);
    }
    // 합주에선 지금 우는 곤충의 울음을 보여준다
    const cb = game.jam ? noteBugAt(Math.max(0, game.notesPlayed - 1)) : game.bug;
    textPlate(LX(cb.cry), SCENE.bugX, SCENE.bugY - 84, 22, noteColor(cb.color));
    drawNotesRow(t);
  }

  if (game.state === 'echo') {
    crayonText(tr(game.jam ? 'jamEcho' : 'echo'), W / 2, p.y + p.h * 0.1, game.jam ? 22 : 26,
      night ? C.pink : C.redDark);
    crayonText(tr('echoHint'), W / 2, p.y + p.h * 0.1 + 30, 17, headC);
    drawNotesRow(t);
  }

  // 결과 화면 — 채를 다 휘두른 뒤에 뜬다 (연출을 가리지 않게)
  if (game.state === 'result' && game.jam) {
    const bw = Math.min(520, W * 0.76), bh = Math.min(250, H * 0.5);
    const bx = W / 2 - bw / 2, by = H / 2 - bh / 2;
    ctx.save();
    ctx.fillStyle = 'rgba(60,45,25,0.35)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = C.cream;
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 14); ctx.fill();
    ctx.restore();
    crayonPath([[bx, by], [bx + bw, by], [bx + bw, by + bh], [bx, by + bh], [bx, by]],
      { color: game.jamWon ? C.yellow : C.gray, width: 6, seed: 520 });
    fitText(tr(game.jamWon ? 'jamWin' : 'jamFail'), W / 2, by + bh * 0.26, bw - 50, 28,
      game.jamWon ? C.redDark : C.navy);
    fitText(tr('jamNotes', game.noteTimes.length), W / 2, by + bh * 0.45, bw - 50, 17, C.darkBrown);
    if (game.jamWon) {
      if (game.wasPerfect) crayonText(tr('allPerfect'), W / 2, by + bh * 0.6, 17, C.redDark);
      if (game.jamNewBest) crayonText(tr('jamNewBest'), W / 2, by + bh * 0.74, 19, C.orange);
      else if (game.gained) crayonText(tr('gainCoins', game.gained), W / 2, by + bh * 0.74, 18, C.orange);
    } else {
      const why = { early: tr('whyEarly'), late: tr('whyLate'), timeout: tr('whyTimeout') }[game.escapeWhy] || '';
      crayonText(why, W / 2, by + bh * 0.62, 17, C.gray);
    }
    crayonText(tr('jamAgain'), W / 2, by + bh + 26, 17, C.cream);
  } else if (game.state === 'result' && !swinging) {
    if (game.caughtBug) {
      const b = game.caughtBug;
      const bw = Math.min(520, W * 0.7), bh = Math.min(300, H * 0.55);
      const bx = W / 2 - bw / 2, by = H / 2 - bh / 2;
      ctx.save();
      ctx.fillStyle = 'rgba(60,45,25,0.35)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = C.cream;
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 14); ctx.fill();
      ctx.restore();
      crayonPath([[bx, by], [bx + bw, by], [bx + bw, by + bh], [bx, by + bh], [bx, by]],
        { color: b.rare ? C.yellow : C.orange, width: 6, seed: 500 });
      drawBug(b, W / 2, by + bh * 0.34, 1.5);
      const nm = bugName(b);
      const head = game.practice ? tr('pracOk', nm) : caughtMsg(nm);
      crayonText(head, W / 2, by + bh * 0.62, 26, C.darkBrown);
      if (game.wasPerfect) crayonText(tr('allPerfect'), W / 2, by + bh * 0.73, 18, C.redDark);
      if (game.gained) {
        crayonText(game.wasPerfect ? tr('gainPerf', game.gained) : tr('gainCoins', game.gained),
          bx + bw - 60, by + 32, 18, C.orange);
      }
      if (game.isNew) crayonText(tr('isNew'), bx + 44, by + 30, 24, C.redDark);
      ctx.save();
      ctx.font = `15px 'Comic Sans MS', 'Chalkboard SE', sans-serif`;
      ctx.fillStyle = '#6b5a42';
      ctx.textAlign = 'center';
      wrapText(LX(b.gag), W / 2, by + bh * 0.84, bw - 60, 19);
      ctx.restore();
      crayonText(tr(game.practice ? 'tapAgain' : 'tapNext'), W / 2, by + bh + 26, 17, C.cream);
    } else {
      crayonText(tr(game.practice ? 'pracFail' : 'escaped'), W / 2, H * 0.42, 30,
        night ? C.cream : C.navy);
      const why = { early: tr('whyEarly'), late: tr('whyLate'), timeout: tr('whyTimeout') }[game.escapeWhy] || '';
      crayonText(why, W / 2, H * 0.42 + 36, 20, C.gray);
      crayonText(tr(game.practice ? 'tapAgain' : 'tapRetry'), W / 2, H * 0.58, 18, headC);
    }
  }

  // ---- 게임 화면 위 버튼들 ----
  // 따라 치는 중(echo)엔 전부 잠근다 — 박자를 치려고 탭했는데 메뉴로 나가버리면 안 된다
  const locked = game.state === 'echo';
  const lock = { noHit: locked, dim: locked };

  if (game.jam) {
    // 합주 중엔 무대로 돌아가는 버튼 하나만 (지역 전환·도감은 곡을 망친다)
    crayonButton('jam-back', p.x + 16, p.y + 14, 110, 36, tr('jam'), { size: 15, color: C.orange, ...lock });
  } else if (game.practice) {
    // 연습방: 곤충 고르기 (잡아본 곤충만)
    const list = practiceList();
    const cur = list[Math.min(game.practiceIdx, list.length - 1)];
    const py2 = p.y + p.h - 78;
    const one = list.length < 2;
    crayonButton('prac-prev', W / 2 - 168, py2, 44, 40, '◀',
      { size: 20, color: C.gray, dim: one || locked, noHit: one || locked });
    crayonButton('prac-pick', W / 2 - 118, py2, 236, 40, `${bugName(cur)}  ♪`,
      { size: 16, color: C.skyBlue, ...lock });
    crayonButton('prac-next', W / 2 + 124, py2, 44, 40, '▶',
      { size: 20, color: C.gray, dim: one || locked, noHit: one || locked });
    textPlate(tr('pracNote', list.length), W / 2, py2 - 26, 15, C.darkBrown);
    crayonButton('to-menu', p.x + 16, p.y + 14, 92, 36, tr('menu'), { size: 16, color: C.brown, ...lock });
  } else {
    crayonButton('to-menu', p.x + 16, p.y + 14, 92, 36, tr('menu'), { size: 16, color: C.brown, ...lock });
    crayonButton('to-dex', p.x + 116, p.y + 14, 92, 36, tr('dexShort'), { size: 16, color: C.green, ...lock });
    // 낮 풀밭 ↔ 밤의 숲 (기다림·결과에서만 바꿀 수 있다)
    const canSwitch = game.state === 'waiting' || game.state === 'result';
    crayonButton('spot-switch', p.x + p.w - 216, p.y + 14, 200, 36,
      tr(night ? 'toMeadow' : 'toNight'),
      { size: 15, color: night ? C.yellow : C.navy, dim: !canSwitch, noHit: !canSwitch });
    crayonText(tr('score', game.sessionCaught, game.sessionMissed),
      p.x + p.w - 16, p.y + 64, 16, headC, 'right');
    crayonText(tr('coins', save.coins), p.x + p.w - 16, p.y + 86, 16, C.orange, 'right');
    const jar = curJar();
    if (!jar.free) {
      crayonText(`${LANG === 'ko' ? jar.ko : jar.en} ${tr('jarLeft', jarCount(jar.id))}`,
        p.x + 16, p.y + 66, 15, headC, 'left');
    }
  }

  drawAchvBanner(t);
}

// 받침이 있으면 "을", 없으면 "를"
function eulReul(word) {
  const code = word.charCodeAt(word.length - 1);
  if (code < 0xAC00 || code > 0xD7A3) return '을(를)';
  return (code - 0xAC00) % 28 ? '을' : '를';
}

// "OO을 잡았다!" — 한국어만 조사를 붙인다
function caughtMsg(nm) {
  return LANG === 'ko' ? `${nm}${eulReul(nm)} 잡았다!` : tr('caught', nm);
}

function wrapText(text, x, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, y);
      line = w; y += lineH;
    } else line = test;
  }
  if (line) ctx.fillText(line, x, y);
}

// ============================================================
// 메인 루프 + 보일 (원이 돌 땐 배경 다시 안 그림 — 성능!)
// ============================================================
let lastBoil = 0;
function frame() {
  // ⚠️ 다음 프레임을 **먼저** 예약한다. 예전엔 맨 마지막 줄이었는데, 그러면 그리는 중에
  //    예외가 한 번만 나도 다음 프레임이 예약되지 않아 게임이 조용히 얼어붙었다.
  requestAnimationFrame(frame);
  try {
    const t = performance.now();
    logic(t);
    // 보일: 울음·따라하기 중엔 배경을 고정한다 (한 번 다시 그리면 한 프레임을 통째로 먹는다)
    const boilOK = BOIL && game.state !== 'call' && game.state !== 'echo';
    if (boilOK && t - lastBoil > 700) {
      boilSeed = (boilSeed + 1) % 3;
      renderSceneToCache();
      lastBoil = t;
    }
    draw(t);
  } catch (e) {
    // 이 프레임만 건너뛴다 — 게임은 계속 돈다
  }
}

// ============================================================
// 입력
// ============================================================

// 버튼을 눌렀으면 true (박자 탭으로 넘기지 않는다)
function onPointer(mx, my, t) {
  const b = hitButton(mx, my);
  if (!b) {
    // 빈 곳 누르기 — 한 겹씩만 닫는다 (카드 → 도감 → 그 전 화면)
    if (game.state === 'dex' && game.dexCard) { game.dexCard = null; return true; }
    if (game.state === 'dex') { closeDex(t); return true; }
    if (game.state === 'shop' || game.state === 'achv' || game.state === 'jam'
        || game.state === 'stats') { goMenu(); return true; }
    if (game.state === 'menu' && game.settingsOpen) { game.settingsOpen = false; return true; }
    return false;
  }
  switch (b.id) {
    case 'start':     game.settingsOpen = false; game.practice = false; startWaiting(t); return true;
    case 'dex':       game.settingsOpen = false; goDex(); return true;
    case 'practice':  game.settingsOpen = false; goPractice(t); return true;
    case 'settings':  game.settingsOpen = !game.settingsOpen; return true;

    case 'set-sfx':   SFX = !SFX; LS.set('sketch-bugs-sfx', SFX ? 'on' : 'off'); if (SFX) sfx.tap(); return true;
    case 'set-lang-ko': case 'set-lang-en':
      LANG = b.data; LS.set('sketch-bugs-lang', LANG);
      document.documentElement.lang = LANG; sfx.tap(); return true;
    case 'set-vol':   VOLUME = VOLUME === 1 ? 0.6 : VOLUME === 0.6 ? 0.3 : 1;
                      LS.set('sketch-bugs-vol', String(VOLUME)); sfx.tap(); return true;
    case 'set-boil':  BOIL = !BOIL; LS.set('sketch-bugs-boil', BOIL ? 'on' : 'off');
                      renderSceneToCache(); return true;

    case 'dex-cell':  if (caughtCount(b.data.id) > 0) { game.dexCard = b.data; playCry(b.data); } return true;
    case 'card-cry':  playCry(game.dexCard); return true;
    case 'gal-cell':  playCry(b.data); return true;
    case 'gal-close': goMenu(); return true;

    case 'jam':       goJam(); return true;
    case 'jam-close': goMenu(); return true;
    case 'jam-back':  goJam(); return true;
    case 'jam-prev':  game.jamPage = Math.max(0, game.jamPage - 1); return true;
    case 'jam-next':  game.jamPage++; return true;
    case 'jam-add':
      if (game.jamBugs.length < JAM_SLOTS && !game.jamBugs.includes(b.data)) {
        game.jamBugs.push(b.data);
        playCry(b.data);          // 무대에 올릴 때 울음을 들려준다
      }
      return true;
    case 'jam-slot':
      game.jamBugs.splice(b.data, 1);   // 슬롯을 누르면 무대에서 내린다
      return true;
    case 'jam-go':
      if (game.jamBugs.length === JAM_SLOTS) startJam(t);
      return true;

    case 'shop':      game.settingsOpen = false; game.state = 'shop'; return true;
    case 'achv':      game.settingsOpen = false; game.state = 'achv'; return true;
    case 'stats':      game.settingsOpen = false; game.state = 'stats'; return true;
    case 'shop-close': case 'achv-close': case 'stats-close': goMenu(); return true;

    case 'shop-net': {
      const n = b.data, i = NETS.indexOf(n);
      if (save.nets.includes(n.id)) {            // 가진 것 → 바꿔 끼기
        save.net = n.id; sfx.buy();
        renderSceneToCache();
      } else if (i > 0 && !save.nets.includes(NETS[i - 1].id)) {
        sfx.nope();                              // 앞의 것부터 사야 한다
      } else if (save.coins >= n.price) {
        save.coins -= n.price;
        save.nets.push(n.id);
        save.net = n.id;
        sfx.buy();
        checkAchievements(t);
      } else sfx.nope();
      persistSave();
      return true;
    }
    case 'shop-tab':  game.shopTab = b.data; return true;
    case 'shop-hat': {
      const h = b.data;
      if (save.hats.includes(h.id)) { save.hat = h.id; sfx.buy(); renderSceneToCache(); }
      else if (save.coins >= h.price) {
        save.coins -= h.price; save.hats.push(h.id); save.hat = h.id;
        sfx.buy(); renderSceneToCache(); checkAchievements(t);
      } else sfx.nope();
      persistSave();
      return true;
    }
    case 'shop-skin': {
      const sk = b.data;
      if (save.netSkins.includes(sk.id)) { save.netSkin = sk.id; sfx.buy(); }
      else if (save.coins >= sk.price) {
        save.coins -= sk.price; save.netSkins.push(sk.id); save.netSkin = sk.id;
        sfx.buy(); checkAchievements(t);
      } else sfx.nope();
      persistSave();
      return true;
    }
    case 'shop-jar': {
      const j = b.data;
      if (j.free) { save.jar = j.id; sfx.buy(); }
      else if (jarCount(j.id) > 0 && save.jar !== j.id) { save.jar = j.id; sfx.buy(); }
      else if (save.coins >= j.price) {          // 사면 1개 늘고 바로 끼워진다
        save.coins -= j.price;
        save.jars[j.id] = (save.jars[j.id] | 0) + 1;
        save.jar = j.id;
        sfx.buy();
      } else sfx.nope();
      persistSave();
      return true;
    }

    case 'dex-close': closeDex(t); return true;
    case 'dex-prev':  game.dexPage = Math.max(0, game.dexPage - 1); return true;
    case 'dex-next':  game.dexPage = Math.min(dexPages() - 1, game.dexPage + 1); return true;

    case 'to-menu':   goMenu(); return true;
    case 'to-dex':    goDex('game'); return true;
    case 'spot-switch': switchSpot(t); return true;
    case 'dex-tab':   game.dexTab = b.data; game.dexPage = 0; return true;

    case 'prac-prev': {
      const n = practiceList().length;
      game.practiceIdx = (game.practiceIdx - 1 + n) % n;
      startPracticeRound(t); return true;
    }
    case 'prac-next': {
      const n = practiceList().length;
      game.practiceIdx = (game.practiceIdx + 1) % n;
      startPracticeRound(t); return true;
    }
    case 'prac-pick': playCry(practiceList()[game.practiceIdx]); return true;
  }
  return false;
}

window.addEventListener('keydown', (e) => {
  const t = performance.now();
  if (e.code === 'Escape') {
    e.preventDefault();
    if (game.state === 'dex' && game.dexCard) game.dexCard = null;
    else if (game.state === 'dex') closeDex(t);
    else if (game.state === 'menu') game.settingsOpen = false;
    else goMenu();
    return;
  }
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (game.state === 'menu') { game.settingsOpen = false; game.practice = false; startWaiting(t); return; }
    onTap(t);
  }
});
cv.addEventListener('pointerdown', (e) => {
  const t = performance.now();
  // 소리는 사용자가 화면을 만진 뒤에야 켤 수 있다 (iOS는 안 그러면 세션 내내 무음)
  try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch (err) {}
  // 화면을 축소해서 그렸다면 터치 좌표도 같은 비율로 되돌려야 버튼이 맞는다
  const mx = e.clientX / CANVAS_SCALE, my = e.clientY / CANVAS_SCALE;
  if (!onPointer(mx, my, t)) onTap(t);
});

// ============================================================
// 크기 조절
// ============================================================
// 논리 세로 크기의 최소값. 실제 화면이 이보다 낮으면(폰 가로 등) 화면을 통째로
// 축소해서 이 크기인 척한다 → 좁은 화면에서 버튼이 화면 밖으로 나가는 문제가 원천 차단된다.
// (낚시에서 배운 "가상 해상도" 방식)
const MIN_LOGICAL_H = 640;
let CANVAS_SCALE = 1;      // 실제 픽셀 = 논리 좌표 × 이 값
let PORTRAIT = false;      // 폰 세로 — 가로로 돌려달라고 안내한다

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const rawW = Math.max(1, window.innerWidth);
  const rawH = Math.max(1, window.innerHeight);

  // 캔버스가 너무 크면 사파리가 조용히 백지로 렌더링한다 → DPR을 낮춰 픽셀 수를 제한
  while (DPR > 1 && rawW * rawH * DPR * DPR > 6e6) DPR -= 0.25;

  PORTRAIT = rawW < rawH && rawW < 600;
  CANVAS_SCALE = rawH < MIN_LOGICAL_H ? rawH / MIN_LOGICAL_H : 1;
  W = Math.max(1, Math.round(rawW / CANVAS_SCALE));
  H = Math.max(1, Math.round(rawH / CANVAS_SCALE));

  cv.width = Math.max(1, Math.round(rawW * DPR));
  cv.height = Math.max(1, Math.round(rawH * DPR));
  cv.style.width = rawW + 'px';
  cv.style.height = rawH + 'px';
  renderSceneToCache();
}
window.addEventListener('resize', resize);

// 그리기용 변환 — 논리 좌표를 실제 픽셀로 (축소 배율까지 반영)
function applyTransform(c) {
  const s = DPR * CANVAS_SCALE;
  c.setTransform(s, 0, 0, s, 0, 0);
}

// ============================================================
// 자동 검증 (#test) — 가짜 시계로 함수를 직접 불러 판정을 확인
// 결과는 document.title에 적힌다 (헤드리스에서 grep으로 확인)
// ============================================================
function runTests() {
  const fails = [];
  const T0 = 100000;
  // 화면·버튼 검사는 가로 화면 기준이다. 세로면 draw()가 안내 화면만 그려서 버튼이 없다.
  PORTRAIT = false;

  for (const bug of BUGS) {
    // ① 박자대로 정확히 따라 치면 잡힌다
    game.state = 'waiting'; game.sessionCaught = 0; game.sessionMissed = 0;
    spawnBug(T0, bug);
    // call 재생을 끝까지 돌린다
    const callEnd = game.callStart + game.noteTimes[game.noteTimes.length - 1] + 700;
    logic(game.callStart);          // 첫 음
    logic(callEnd);                 // 나머지 음 + echo 전환
    if (game.state !== 'echo') { fails.push(`${bug.ko}: echo 전환 실패 (${game.state})`); continue; }
    const A = callEnd + 500;        // 첫 탭 시각 (아무 때나 가능해야 함)
    for (let i = 0; i < game.noteTimes.length; i++) {
      onTap(A + game.noteTimes[i]);
    }
    if (game.state !== 'result' || !game.caughtBug) { fails.push(`${bug.ko}: 정박에 쳤는데 못 잡음`); continue; }
    if (!game.wasPerfect) fails.push(`${bug.ko}: 정박인데 퍼펙트 아님`);

    // ② 마지막 음을 크게 어긋나게 치면 도망간다
    game.state = 'waiting';
    spawnBug(T0, bug);
    logic(game.callStart);
    logic(game.callStart + game.noteTimes[game.noteTimes.length - 1] + 700);
    const A2 = game.echoStart + 300;
    for (let i = 0; i < game.noteTimes.length - 1; i++) onTap(A2 + game.noteTimes[i]);
    if (game.noteTimes.length > 1) {
      onTap(A2 + game.noteTimes[game.noteTimes.length - 1] + GOOD_MS + 150);   // 늦게!
      if (game.state !== 'result' || game.caughtBug) fails.push(`${bug.ko}: 어긋났는데 잡힘`);
    }

    // ③ 첫 탭을 안 하면 울음을 반복하다가 도망간다
    game.state = 'waiting';
    spawnBug(T0, bug);
    let t = game.callStart;
    for (let guard = 0; guard < 50 && game.state !== 'result'; guard++) {
      t += 500;
      logic(t);
    }
    if (game.state !== 'result' || game.caughtBug) fails.push(`${bug.ko}: 방치했는데 도망 안 감`);
    else if (game.escapeWhy !== 'timeout') fails.push(`${bug.ko}: 방치 이유가 timeout이 아님 (${game.escapeWhy})`);

    // ④ good 판정 (PERFECT_MS와 GOOD_MS 사이)도 잡힌다
    game.state = 'waiting';
    spawnBug(T0, bug);
    logic(game.callStart);
    logic(game.callStart + game.noteTimes[game.noteTimes.length - 1] + 700);
    const A3 = game.echoStart + 300;
    onTap(A3);
    for (let i = 1; i < game.noteTimes.length; i++) onTap(A3 + game.noteTimes[i] + PERFECT_MS + 60);
    if (game.state !== 'result' || !game.caughtBug) fails.push(`${bug.ko}: good 판정인데 못 잡음`);
    else if (game.wasPerfect) fails.push(`${bug.ko}: good인데 퍼펙트로 나옴`);
  }

  // ⑤ 버튼 좌표: 메뉴를 한 번 그려서 버튼이 실제로 잡히는지 확인
  goMenu();
  draw(0);
  for (const want of ['start', 'dex', 'practice', 'settings']) {
    const b = hotspots.find(h => h.id === want);
    if (!b) { fails.push(`메뉴 버튼 없음: ${want}`); continue; }
    if (!hitButton(b.x + b.w / 2, b.y + b.h / 2)) fails.push(`메뉴 버튼이 안 눌림: ${want}`);
  }
  // ⑥ 도감 12칸이 전부 눌리는 자리에 있는지
  goDex();
  draw(0);
  const cells = hotspots.filter(h => h.id === 'dex-cell');
  const wantCells = Math.min(DEX_PER_PAGE, BUGS.length);
  if (cells.length !== wantCells) fails.push(`도감 1페이지 칸 수가 ${cells.length}개 (${wantCells}이어야 함)`);
  // ⑦ 연습방은 잡은 곤충만 고를 수 있다 (하나도 없으면 제일 쉬운 것 하나)
  // ⚠️ 복사해서 백업한다. 참조로 두면 아래에서 save.caught를 채울 때 백업까지 오염된다
  const before = Object.assign({}, save.caught);
  save.caught = {};
  if (practiceList().length !== 1) fails.push('한 마리도 못 잡았는데 연습 목록이 1종이 아님');
  save.caught = { 'crayon-cicada': 2, 'paint-bee': 1 };
  if (practiceList().length !== 2) fails.push('잡은 곤충 2종인데 연습 목록이 2종이 아님');

  // ⑧ 모든 화면의 버튼이 화면 안에 있고 서로 겹치지 않는다
  //    (겹치면 엉뚱한 버튼이 눌린다. 눈으로만 보다가 놓치기 쉬운 종류의 버그)
  BUGS.forEach(b => { save.caught[b.id] = 1; });
  const screens = [
    ['메뉴', () => { goMenu(); }],
    ['메뉴+설정', () => { goMenu(); game.settingsOpen = true; }],
    ['도감', () => { goDex(); }],
    ['도감 카드', () => { goDex(); game.dexCard = BUGS[BUGS.length - 1]; }],
    ['연습방', () => { goPractice(0); }],
    ['기다림', () => { game.practice = false; startWaiting(0); }],
    ['그림 갤러리', () => { goMenu(); game.state = 'gallery'; }],
    ['상점(장비)', () => { goMenu(); game.shopTab = 'gear'; game.state = 'shop'; }],
    ['상점(꾸미기)', () => { goMenu(); game.shopTab = 'style'; game.state = 'shop'; }],
    ['도전과제', () => { goMenu(); game.state = 'achv'; }],
    ['내 기록', () => { goMenu(); game.state = 'stats'; }],
    ['합주 무대', () => { goMenu(); BUGS.slice(0, 5).forEach(b => { save.caught[b.id] = 1; }); goJam(); }],
    ['합주 연주 중', () => {
      goMenu(); BUGS.slice(0, 5).forEach(b => { save.caught[b.id] = 1; });
      game.jamBugs = [BUGS[0], BUGS[2], BUGS[4]]; startJam(0);
    }],
  ];
  // ⑩ 박자가 곤충마다 전부 달라야 한다 (같은 박자면 "새 곤충인데 똑같네"가 된다)
  const seenRhythm = new Map();
  for (const b of BUGS) {
    const key = b.gaps.join(',');
    if (seenRhythm.has(key)) fails.push(`박자 겹침: ${b.ko} = ${seenRhythm.get(key)} (${key})`);
    else seenRhythm.set(key, b.ko);
  }
  // id도 겹치면 저장 기록이 섞인다
  const seenId = new Set();
  for (const b of BUGS) {
    if (seenId.has(b.id)) fails.push(`id 겹침: ${b.id}`);
    seenId.add(b.id);
  }

  // ⑪ 도감 나가기 (플레이 중 찾은 버그)
  //    게임 중에 연 도감은 닫으면 게임으로, 메뉴에서 연 도감은 메뉴로 가야 한다.
  //    빈 곳을 눌러도 닫혀야 한다 (예전엔 아무 일도 안 일어났다).
  goMenu(); startWaiting(0);
  goDex('game');
  draw(0);
  onPointer(2, H - 2, 0);                       // 도감 바깥(구석) 누르기
  if (game.state !== 'waiting') fails.push(`게임 중 연 도감: 바깥을 눌렀는데 ${game.state}로 감`);
  goDex('game'); draw(0);
  const closeBtn = hotspots.find(h => h.id === 'dex-close');
  if (!closeBtn) fails.push('도감에 닫기 버튼이 없음');
  else onPointer(closeBtn.x + 2, closeBtn.y + 2, 0);
  if (game.state !== 'waiting') fails.push(`게임 중 연 도감: 닫기를 눌렀는데 ${game.state}로 감`);
  goMenu();
  goDex('menu'); draw(0);
  onPointer(2, H - 2, 0);
  if (game.state !== 'menu') fails.push(`메뉴에서 연 도감: 바깥을 눌렀는데 ${game.state}로 감`);
  // 카드가 열려 있으면 바깥 클릭은 카드만 닫는다 (도감은 그대로)
  goDex('menu'); game.dexCard = BUGS[0]; draw(0);
  onPointer(2, H - 2, 0);
  if (game.state !== 'dex' || game.dexCard) fails.push('카드 바깥을 눌렀는데 도감까지 닫힘');

  // ⑫ 도감 — 지역 탭을 다 돌며 페이지를 다 넘기면 모든 곤충이 한 번씩 나와야 한다
  const shown = new Set();
  for (const tab of ['meadow', 'night']) {
    goDex('menu'); game.dexTab = tab;
    for (let pg = 0; pg < dexPages(); pg++) {
      game.dexPage = pg; draw(0);
      hotspots.filter(h => h.id === 'dex-cell').forEach(h => shown.add(h.data.id));
    }
  }
  if (shown.size !== BUGS.length) {
    fails.push(`도감에 안 나오는 곤충이 있음 (${shown.size}/${BUGS.length})`);
  }
  // 지역 배정이 빠진 곤충이 없어야 한다
  const noSpot = BUGS.filter(b => b.spot !== 'meadow' && b.spot !== 'night');
  if (noSpot.length) fails.push(`spot이 없는 곤충: ${noSpot.map(b => b.ko).join(',')}`);

  // ⑬ 코인·상점 규칙
  const keep = JSON.parse(JSON.stringify({ c: save.coins, e: save.coinEarned, n: save.net,
                                           ns: save.nets, j: save.jar, js: save.jars,
                                           a: save.achieved, m: save.missed, pf: save.perfect }));
  // 앞 테스트가 남긴 기록(놓친 수·퍼펙트 수)까지 지워야 도전과제가 엉뚱하게 달성되지 않는다
  save.coins = 0; save.coinEarned = 0; save.net = 'stick'; save.nets = ['stick'];
  save.jar = 'none'; save.jars = {}; save.achieved = [];
  save.caught = {}; save.missed = 0; save.perfect = 0;

  // 흔한 곤충보다 귀한 곤충이 비싸고, 퍼펙트는 2배, 밤이 더 비싸다
  const common = BUGS.find(b => b.id === 'eraser-ladybug');
  const legend = BUGS.find(b => b.id === 'rainbow-butterfly');
  const nightL = BUGS.find(b => b.id === 'nightsky-moth');
  if (!(coinFor(legend) > coinFor(common))) fails.push('전설이 흔한 곤충보다 안 비쌈');
  if (coinFor(common, true) !== coinFor(common) * 2) fails.push('퍼펙트가 2배가 아님');
  if (!(coinFor(nightL) > coinFor(legend))) fails.push('밤 전설이 낮 전설보다 안 비쌈');

  // 채집망은 순서대로만 살 수 있고, 코인이 모자라면 안 사진다
  save.coins = 10000;
  onPointer(-1, -1, 0);                       // hotspots 초기화용 더미 (아무것도 안 눌림)
  goMenu(); game.state = 'shop'; draw(0);
  const netBtns = hotspots.filter(h => h.id === 'shop-net');
  // 앞의 것을 안 샀으면 아예 눌리지도 않아야 한다
  if (netBtns.some(h => h.data.id === 'silk')) fails.push('대나무 채도 없는데 비단 채가 눌림');
  if (netBtns.some(h => h.data.id === 'golden')) fails.push('앞 단계 없이 황금 채가 눌림');
  const bambooBtn = netBtns.find(h => h.data.id === 'bamboo');
  if (!bambooBtn) fails.push('상점에 대나무 채 버튼이 없음');
  else onPointer(bambooBtn.x + 4, bambooBtn.y + 4, 0);
  if (!save.nets.includes('bamboo')) fails.push('코인이 충분한데 대나무 채가 안 사짐');
  if (save.net !== 'bamboo') fails.push('산 채집망이 바로 안 끼워짐');
  if (save.coins !== 10000 - 80) fails.push(`채집망 값이 안 빠짐 (${save.coins})`);
  if (judgeMul() <= 1) fails.push('좋은 채집망인데 판정 폭이 그대로');

  // 코인이 모자라면 살 수 있는 차례여도 안 사진다
  save.coins = 0;
  draw(0);
  const silk = hotspots.filter(h => h.id === 'shop-net').find(h => h.data.id === 'silk');
  if (!silk) fails.push('대나무 채를 샀는데 비단 채가 안 열림');
  else {
    onPointer(silk.x + 4, silk.y + 4, 0);
    if (save.nets.includes('silk')) fails.push('코인이 없는데 비단 채가 사짐');
  }

  // 꿀단지는 곤충이 나타날 때 1개 줄고, 다 쓰면 빈손으로 돌아간다
  save.coins = 100; save.jars = {}; save.jar = 'none';
  draw(0);
  const honey = hotspots.filter(h => h.id === 'shop-jar').find(h => h.data.id === 'honey');
  if (!honey) fails.push('상점에 꿀단지 버튼이 없음');
  else onPointer(honey.x + 4, honey.y + 4, 0);
  if (jarCount('honey') !== 1 || save.jar !== 'honey') fails.push('꿀단지를 샀는데 안 끼워짐');
  game.practice = false; startWaiting(0);
  spawnBug(0);
  if (jarCount('honey') !== 0) fails.push('곤충이 나왔는데 꿀단지가 안 줄어듦');
  if (save.jar !== 'none') fails.push('꿀단지를 다 썼는데 빈손으로 안 돌아감');
  // 꿀단지를 끼면 귀한 곤충 확률이 실제로 올라간다
  save.jars = { honey: 5 }; save.jar = 'honey';
  const rareB = spotBugs('meadow').find(b => b.weight <= 9);
  const withJar = bugWeight(rareB);
  save.jar = 'none';
  if (!(withJar > bugWeight(rareB))) fails.push('꿀단지를 껴도 귀한 곤충 확률이 그대로');

  // 도전과제: 아무것도 안 했으면 하나도 달성 안 되고,
  //           첫 채집 하나만 하면 그 보상만 들어오고, 두 번 주지 않는다
  save.caught = {}; save.achieved = []; save.coins = 0; save.coinEarned = 0;
  save.missed = 0; save.perfect = 0; save.nets = ['stick'];
  checkAchievements(0);
  if (save.achieved.length) fails.push('아무것도 안 했는데 달성됨: ' + save.achieved.join(','));
  save.caught[common.id] = 1;
  checkAchievements(0);
  const firstA = ACHV.find(a => a.id === 'first');
  if (!achvDone(firstA)) fails.push('첫 채집이 달성 안 됨');
  if (save.achieved.length !== 1) fails.push('한 마리 잡았는데 여러 과제가 달성됨: ' + save.achieved.join(','));
  if (save.coins !== firstA.coins) fails.push(`도전과제 보상이 안 들어옴 (${save.coins})`);
  checkAchievements(0);
  if (save.coins !== firstA.coins) fails.push('도전과제 보상이 두 번 들어옴');

  save.coins = keep.c; save.coinEarned = keep.e; save.net = keep.n; save.nets = keep.ns;
  save.jar = keep.j; save.jars = keep.js; save.achieved = keep.a;
  save.missed = keep.m; save.perfect = keep.pf; save.caught = before;

  // ⑭ 음표 색이 크림색 판 위에서 읽힐 만큼 진한가
  //    (별사탕딱정벌레·화이트나방처럼 연한 곤충이 안 보이던 문제. 플레이 중 발견)
  for (const b of BUGS) {
    let hex = String(noteColor(b.color)).replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(ch => ch + ch).join('');
    const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), bl = parseInt(hex.slice(4, 6), 16);
    if (isNaN(r)) { fails.push(`${b.ko}: 색을 읽을 수 없음 (${b.color})`); continue; }
    const lum = luminance(r, g, bl);
    if (lum > NOTE_LUM + 0.01) {
      fails.push(`${b.ko}: 음표 색이 너무 연함 (밝기 ${lum.toFixed(2)})`);
    }
  }

  // ⑯ 꾸미기 (모자 · 채집망 색)
  {
    const kH = save.hats.slice(), kHat = save.hat, kS = save.netSkins.slice(),
          kSkin = save.netSkin, kC = save.coins;
    save.hats = ['none']; save.hat = 'none';
    save.netSkins = ['wood']; save.netSkin = 'wood';

    // 코인이 없으면 안 사진다
    save.coins = 0;
    goMenu(); game.shopTab = 'style'; game.state = 'shop'; draw(0);
    const straw = hotspots.filter(h => h.id === 'shop-hat').find(h => h.data.id === 'straw');
    if (!straw) fails.push('꾸미기: 밀짚모자 버튼이 없음');
    else onPointer(straw.x + 4, straw.y + 4, 0);
    if (save.hats.includes('straw')) fails.push('꾸미기: 코인이 없는데 모자가 사짐');

    // 코인이 있으면 사지고 바로 써진다
    save.coins = 5000; draw(0);
    const straw2 = hotspots.filter(h => h.id === 'shop-hat').find(h => h.data.id === 'straw');
    onPointer(straw2.x + 4, straw2.y + 4, 0);
    if (!save.hats.includes('straw')) fails.push('꾸미기: 코인이 충분한데 모자가 안 사짐');
    if (save.hat !== 'straw') fails.push('꾸미기: 산 모자가 바로 안 써짐');
    if (save.coins !== 5000 - 150) fails.push(`꾸미기: 모자 값이 안 빠짐 (${save.coins})`);

    // 채집망 색도 같은 규칙 + 실제로 그리기 색이 바뀐다
    draw(0);
    const pink = hotspots.filter(h => h.id === 'shop-skin').find(h => h.data.id === 'pink');
    onPointer(pink.x + 4, pink.y + 4, 0);
    if (save.netSkin !== 'pink') fails.push('꾸미기: 산 채집망 색이 안 적용됨');
    if (curSkin().pole === NET_SKINS[0].pole) fails.push('꾸미기: 색을 바꿨는데 그리기 색이 그대로');

    // 이미 가진 것을 다시 누르면 값이 또 빠지면 안 된다
    const before2 = save.coins;
    draw(0);
    const pink2 = hotspots.filter(h => h.id === 'shop-skin').find(h => h.data.id === 'pink');
    onPointer(pink2.x + 4, pink2.y + 4, 0);
    if (save.coins !== before2) fails.push('꾸미기: 가진 것을 눌렀는데 코인이 또 빠짐');

    // 모자 그림이 서로 달라야 한다
    // (상점 미리보기가 "지금 쓴 모자"만 그려서 네 칸이 전부 같게 나온 적이 있다)
    const shots = {};
    const tmp = document.createElement('canvas');
    tmp.width = 120; tmp.height = 100;
    const tctx = tmp.getContext('2d');
    const mainCtx = ctx;
    try {
      ctx = tctx;
      for (const h of HATS) {
        if (h.id === 'none') continue;
        tctx.clearRect(0, 0, 120, 100);
        tctx.setTransform(1, 0, 0, 1, 0, 0);
        drawHat(60, 70, 1, h.id);
        const d = tctx.getImageData(0, 0, 120, 100).data;
        let sum = 0;
        for (let i = 3; i < d.length; i += 4) if (d[i] > 20) sum += i;   // 칠해진 자리들의 합
        shots[h.id] = sum;
      }
    } finally { ctx = mainCtx; }
    const ids = Object.keys(shots);
    for (let i = 0; i < ids.length; i++) {
      if (!shots[ids[i]]) { fails.push(`모자 '${ids[i]}'가 아무것도 안 그려짐`); continue; }
      for (let j = i + 1; j < ids.length; j++) {
        if (shots[ids[i]] === shots[ids[j]]) {
          fails.push(`모자 '${ids[i]}'와 '${ids[j]}' 그림이 똑같음`);
        }
      }
    }

    save.hats = kH; save.hat = kHat; save.netSkins = kS; save.netSkin = kSkin; save.coins = kC;
    renderSceneToCache();
  }

  // ⑮ 합주 미니게임
  {
    const keepC = Object.assign({}, save.caught), keepCoin = save.coins, keepBest = save.jamBest;
    save.caught = {};
    const trio = [BUGS[0], BUGS[2], BUGS[4]];
    trio.forEach(b => { save.caught[b.id] = 1; });

    // 무대 화면: 잡은 곤충만 고를 수 있다
    goJam(); game.jamBugs = []; draw(0);
    const addBtns = hotspots.filter(h => h.id === 'jam-add');
    if (addBtns.length !== trio.length) {
      fails.push(`합주: 고를 수 있는 곤충이 ${addBtns.length}종 (${trio.length}이어야 함)`);
    }
    if (hotspots.some(h => h.id === 'jam-go')) fails.push('합주: 곤충을 안 골랐는데 시작 버튼이 눌림');

    // 세 마리 올리기 → 시작 버튼이 열린다
    trio.forEach(b => {
      draw(0);
      const btn = hotspots.filter(h => h.id === 'jam-add').find(h => h.data === b);
      if (btn) onPointer(btn.x + 4, btn.y + 4, 0);
    });
    if (game.jamBugs.length !== JAM_SLOTS) fails.push(`합주: 무대에 ${game.jamBugs.length}마리만 올라감`);
    draw(0);
    if (!hotspots.some(h => h.id === 'jam-go')) fails.push('합주: 세 마리를 올렸는데 시작 버튼이 안 열림');

    // 곡은 세 마리 음을 전부 이어붙인 길이여야 한다
    const want = trio.reduce((s, b) => s + b.gaps.length + 1, 0);
    const song = buildJamSong(trio);
    if (song.times.length !== want) fails.push(`합주 곡 길이 ${song.times.length} (${want}이어야 함)`);
    if (song.owners.length !== want) fails.push('합주: 음마다 곤충 정보가 안 맞음');
    for (let i = 1; i < song.times.length; i++) {
      if (!(song.times[i] > song.times[i - 1])) { fails.push('합주 박자가 앞뒤로 뒤집힘'); break; }
    }

    // 박자대로 전부 치면 성공하고 코인이 들어온다
    save.coins = 0; save.jamBest = 0;
    startJam(0);
    logic(game.callStart);
    logic(game.callStart + game.noteTimes[game.noteTimes.length - 1] + 700);
    if (game.state !== 'echo') fails.push(`합주: echo 전환 실패 (${game.state})`);
    const A = game.echoStart + 400;
    for (let i = 0; i < game.noteTimes.length; i++) onTap(A + game.noteTimes[i]);
    if (game.state !== 'result' || !game.jamWon) fails.push('합주: 정박에 쳤는데 실패로 나옴');
    if (save.jamBest !== want) fails.push(`합주 최고 기록이 ${save.jamBest} (${want}이어야 함)`);
    if (save.coins <= 0) fails.push('합주에 성공했는데 코인이 없음');
    if (totalCaught() !== 3) fails.push('합주가 곤충 잡은 수를 늘림 (늘리면 안 됨)');

    // 중간에 크게 어긋나면 실패한다
    startJam(0);
    logic(game.callStart);
    logic(game.callStart + game.noteTimes[game.noteTimes.length - 1] + 700);
    const A2 = game.echoStart + 300;
    onTap(A2);
    onTap(A2 + game.noteTimes[1] + GOOD_BASE * 2 + 300);
    if (game.state !== 'result' || game.jamWon) fails.push('합주: 크게 어긋났는데 성공으로 나옴');

    goMenu();
    save.caught = keepC; save.coins = keepCoin; save.jamBest = keepBest;
  }

  // ⑨ 따라 치는 중엔 화면 버튼이 하나도 안 눌려야 한다
  //    (박자를 치려고 탭했는데 메뉴로 나가버리는 사고 방지. 나가려면 Esc)
  for (const prac of [false, true]) {
    game.practice = prac;
    game.bug = BUGS[2];
    game.noteTimes = noteTimesFor(game.bug);
    startEcho(0);
    draw(0);
    if (hotspots.length) {
      fails.push(`따라하기 중(${prac ? '연습방' : '게임'})에 눌리는 버튼이 남음: ` +
                 hotspots.map(h => h.id).join(','));
    }
  }
  for (const [name, setup] of screens) {
    setup();
    draw(0);
    // 1px 여유: 격자를 W/cols로 나누면 마지막 칸의 오른쪽 끝이 부동소수점 때문에
    // W보다 아주 조금 커진다 (예: 1600.0000000000002). 그건 화면 밖이 아니다.
    for (const h of hotspots) {
      if (h.x < -1 || h.y < -1 || h.x + h.w > W + 1 || h.y + h.h > H + 1) {
        fails.push(`${name}: 버튼 '${h.id}'이 화면 밖으로 나감`);
      }
    }
    for (let i = 0; i < hotspots.length; i++) {
      for (let j = i + 1; j < hotspots.length; j++) {
        // 1px 여유: 도감 격자처럼 변끼리 딱 붙은 건 겹침이 아니다
        const a = hotspots[i], c = hotspots[j], eps = 1;
        if (a.x + eps < c.x + c.w && c.x + eps < a.x + a.w &&
            a.y + eps < c.y + c.h && c.y + eps < a.y + a.h) {
          fails.push(`${name}: 버튼 '${a.id}'과 '${c.id}'이 겹침`);
        }
      }
    }
  }
  save.caught = before;

  document.title = fails.length === 0
    ? `TESTS PASS (${BUGS.length} bugs x 4 cases + ui)`
    : 'TESTS FAIL: ' + fails.join(' | ');
  // 상태 원복
  goMenu();
  game.sessionCaught = 0; game.sessionMissed = 0;
}

// ============================================================
// 시작
// ============================================================
resize();
// 검사 중에 예외가 나도 조용히 죽지 않게 — 죽으면 그 사실을 제목에 적는다
if (TEST_MODE) {
  try { runTests(); }
  catch (e) { document.title = 'TESTS CRASHED: ' + (e && e.message ? e.message : e); }
}
// 미리보기 해시 (진짜 기록을 건드리지 않는다 — PREVIEW 플래그가 저장을 막는다)
//   #catch=지우개무당벌레 / #call=크레파스매미 / #echo=풀피리귀뚜라미
//   #dex=all (전부 잡은 상태로 도감 구경) / #dex=크레파스매미 (상세 카드까지)
const hash = location.hash;
if (hash.startsWith('#catch')) {
  const name = decodeURIComponent(hash.split('=')[1] || '');
  const b = BUGS.find(x => x.ko === name) || BUGS[0];
  game.bug = b; game.caughtBug = b; game.noteTimes = noteTimesFor(b);
  game.results = ['perfect']; game.wasPerfect = true; game.state = 'result';
} else if (hash.startsWith('#call') || hash.startsWith('#echo')) {
  const name = decodeURIComponent(hash.split('=')[1] || '');
  const b = BUGS.find(x => x.ko === name) || BUGS[4];
  game.bug = b; game.noteTimes = noteTimesFor(b);
  if (hash.startsWith('#call')) startCall(performance.now() + 500);
  else startEcho(performance.now());
} else if (hash.startsWith('#dex')) {
  const arg = decodeURIComponent(hash.split('=')[1] || '');
  save.caught = {};
  if (arg) {
    // #dex=all 또는 #dex=이름 → 전부 잡은 상태로 구경
    BUGS.forEach((b, i) => { save.caught[b.id] = i + 1; });
  } else {
    // #dex → 절반만 잡은 상태 (미확인 칸이 어떻게 보이는지 확인용)
    BUGS.forEach((b, i) => { if (i % 2 === 0) save.caught[b.id] = i + 1; });
  }
  goDex('menu');
  const b = BUGS.find(x => x.ko === arg);
  if (b) {
    // 그 곤충이 사는 지역 탭 + 그 탭 안에서의 페이지로 맞춘다
    game.dexTab = b.spot;
    game.dexCard = b;
    game.dexPage = Math.floor(dexList().indexOf(b) / DEX_PER_PAGE);
  } else if (/^\d+$/.test(arg)) {
    game.dexPage = parseInt(arg, 10) - 1;                        // #dex=2 → 2페이지
  }
} else if (hash.startsWith('#shop') || hash.startsWith('#achv') || hash.startsWith('#stats')) {
  // 가짜 기록으로 상점·도전과제 미리보기 (진짜 저장은 PREVIEW가 막는다)
  save.coins = 520; save.coinEarned = 1200;
  save.nets = ['stick', 'bamboo']; save.net = 'bamboo';
  save.jars = { honey: 3 }; save.jar = 'honey';
  BUGS.slice(0, 14).forEach(b => { save.caught[b.id] = 2; });
  save.perfect = 7; save.missed = 12;
  save.achieved = ['first', 'ten', 'perfect5'];
  save.hats = ['none', 'straw']; save.hat = 'straw';
  save.netSkins = ['wood', 'sky']; save.netSkin = 'sky';
  save.jamBest = 9;
  renderSceneToCache();
  if (hash.includes('style')) game.shopTab = 'style';
  game.state = hash.startsWith('#shop') ? 'shop' : (hash.startsWith('#stats') ? 'stats' : 'achv');
} else if (hash.startsWith('#swing')) {
  // 잠자리채 휘두르는 중간 장면 보기: #swing=0.45 (0~1 진행도), #swing=miss=0.5 는 헛스윙
  const arg = hash.split('=').slice(1);
  const miss = arg[0] === 'miss';
  const u = parseFloat(miss ? arg[1] : arg[0]);
  const b = BUGS[4];
  game.bug = b;
  game.noteTimes = noteTimesFor(b);
  game.results = ['perfect'];
  game.wasPerfect = true;
  game.state = 'result';
  game.caughtBug = miss ? null : b;
  game.escapeWhy = 'late';
  game.swingFreeze = isNaN(u) ? 0.45 : u;
} else if (hash.startsWith('#jam')) {
  // 합주 미리보기 (14마리 잡은 상태). #jam=play 면 바로 연주까지
  BUGS.slice(0, 14).forEach(b => { save.caught[b.id] = 2; });
  save.jamBest = 7;
  goJam();
  if (hash.includes('=play')) {
    game.jamBugs = [BUGS[0], BUGS[2], BUGS[4]];
    startJam(performance.now());
  }
} else if (hash.startsWith('#gallery')) {
  game.state = 'gallery';     // 곤충 그림만 모아보기 (개발·검토용)
} else if (hash.startsWith('#night')) {
  save.spot = 'night';        // 밤의 숲 미리보기
  renderSceneToCache();
  const arg = decodeURIComponent(hash.split('=')[1] || '');
  const b = spotBugs('night').find(x => x.ko === arg);
  if (b) { game.bug = b; game.noteTimes = noteTimesFor(b); startCall(performance.now() + 500); }
  else startWaiting(performance.now());
} else if (hash.startsWith('#set')) {
  game.settingsOpen = true;   // 설정이 펼쳐진 메뉴 미리보기
} else if (hash.startsWith('#prac')) {
  // 연습방 미리보기 (곤충 4종을 잡아본 상태로)
  save.caught = {};
  BUGS.slice(0, 4).forEach(b => { save.caught[b.id] = 1; });
  goPractice(performance.now());
}
frame();
</script>
</body>
</html>
