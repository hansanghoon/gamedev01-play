    if (Array.isArray(r)) r = r[0];
    r = Math.min(r || 0, Math.abs(w) / 2, Math.abs(h) / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

// ---------- 시드 랜덤 (같은 시드면 항상 같은 꼬불거림) ----------
function mulberry32(a) {
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let boilSeed = 0;   // 라인 보일: 배경을 다시 그릴 때마다 바뀜

// ---------- 경로 도우미 ----------
function resample(pts, step) {
  const out = [pts[0].slice()];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const ax = pts[i - 1][0], ay = pts[i - 1][1];
    const bx = pts[i][0], by = pts[i][1];
    const dx = bx - ax, dy = by - ay;
    const len = Math.hypot(dx, dy);
    if (len === 0) continue;
    let t = step - acc;
    while (t <= len) {
      out.push([ax + dx * (t / len), ay + dy * (t / len)]);
      t += step;
    }
    acc = len - (t - step);
  }
  out.push(pts[pts.length - 1].slice());
  return out;
}

function ellipsePts(cx, cy, rx, ry, n = 44) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2;
    pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
  }
  return pts;
}

// ---------- 크레파스 선 ----------
function crayonPath(pts, opt) {
  const {
    color, width = 5, seed = 1, alpha = 0.9,
    wobble = 3, step = 7, passes = 2,
  } = opt;
  const rand = mulberry32((seed * 7919 + boilSeed * 104729) >>> 0);
  const rs = resample(pts, step);
  if (rs.length < 2) return;

  const p1 = rand() * 6.28, p2 = rand() * 6.28;
  const jittered = rs.map((p, i) => {
    const prev = rs[Math.max(0, i - 1)], next = rs[Math.min(rs.length - 1, i + 1)];
    let nx = -(next[1] - prev[1]), ny = next[0] - prev[0];
    const nl = Math.hypot(nx, ny) || 1;
    nx /= nl; ny /= nl;
    const off = Math.sin(i * 0.33 + p1) * wobble * 0.7
              + Math.sin(i * 0.11 + p2) * wobble
              + (rand() - 0.5) * 1.6;
    return [p[0] + nx * off, p[1] + ny * off];
  });

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (opt.continuous) {
    for (let pass = 0; pass < passes; pass++) {
      const ox = (rand() - 0.5) * 3, oy = (rand() - 0.5) * 3;
      ctx.globalAlpha = alpha * (0.7 + rand() * 0.3) / passes * 1.3;
      ctx.lineWidth = width * (0.85 + rand() * 0.3);
      ctx.beginPath();
      ctx.moveTo(jittered[0][0] + ox, jittered[0][1] + oy);
      for (let i = 1; i < jittered.length; i++) {
        ctx.lineTo(jittered[i][0] + ox, jittered[i][1] + oy);
      }
      ctx.stroke();
    }
  } else {
    for (let pass = 0; pass < passes; pass++) {
      const ox = (rand() - 0.5) * 2.2, oy = (rand() - 0.5) * 2.2;
      for (let i = 1; i < jittered.length; i++) {
        ctx.globalAlpha = alpha * (0.45 + rand() * 0.55) / passes * 1.6;
        ctx.lineWidth = width * (0.7 + rand() * 0.6);
        ctx.beginPath();
        ctx.moveTo(jittered[i - 1][0] + ox, jittered[i - 1][1] + oy);
        ctx.lineTo(jittered[i][0] + ox, jittered[i][1] + oy);
        ctx.stroke();
      }
    }
  }
  ctx.restore();
}

// ---------- 크레파스 색칠 (지그재그 슥슥) ----------
function scribbleFill(rows, opt) {
  const { color, width = 6, seed = 1, alpha = 0.5, overshoot = 8 } = opt;
  const rand = mulberry32((seed * 6271 + 17) >>> 0);
  const zig = [];
  let dir = 1;
  for (const r of rows) {
    const o1 = (rand() - 0.3) * overshoot;
    const o2 = (rand() - 0.3) * overshoot;
    const a = [r.x1 - o1, r.y + (rand() - 0.5) * 3];
    const b = [r.x2 + o2, r.y + (rand() - 0.5) * 3];
    if (dir > 0) zig.push(a, b); else zig.push(b, a);
    dir *= -1;
  }
  if (zig.length < 2) return;
  crayonPath(zig, { color, width, seed: seed + 3, alpha, wobble: 2, step: 12,
                    passes: 2, continuous: true });
}

function ellipseRows(cx, cy, rx, ry, gap) {
  const rows = [];
  for (let y = cy - ry + gap * 0.6; y < cy + ry; y += gap) {
    const t = (y - cy) / ry;
    const half = rx * Math.sqrt(Math.max(0, 1 - t * t));
    if (half > 4) rows.push({ y, x1: cx - half, x2: cx + half });
  }
  return rows;
}

function rectRows(x, y, w, h, gap) {
  const rows = [];
  for (let yy = y + gap * 0.5; yy < y + h; yy += gap) rows.push({ y: yy, x1: x, x2: x + w });
  return rows;
}

// ---------- 크레파스 글씨 ----------
function crayonText(str, x, y, size, color, align = 'center') {
  ctx.save();
  ctx.font = `bold ${size}px 'Comic Sans MS', 'Chalkboard SE', sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(80,60,40,0.28)';
  ctx.lineWidth = size * 0.14;
  ctx.strokeText(str, x, y + size * 0.05);
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.restore();
}

  coins: 0, coinEarned: 0,        // 지금 가진 코인 / 지금까지 번 코인(도전과제용)

  jar: 'none', jars: {},          // 끼운 꿀단지 / 남은 개수
  achieved: [],                   // 달성한 도전과제 id
  jamBest: 0,                     // 합주 최고 기록 (성공한 곡의 음 수)
  hat: 'none', hats: ['none'],           // 쓴 모자 / 가진 모자
  netSkin: 'wood', netSkins: ['wood'],   // 채집망 색

(function loadSave() {
  try {
    const raw = LS.get(SAVE_KEY);
    if (raw) {
      const o = JSON.parse(raw);
      if (o && typeof o === 'object') {
        // ⚠️ typeof [] === 'object'라서 배열도 그냥 통과한다. 배열이 들어오면 이후에 넣는
        //    기록이 JSON으로 저장될 때 통째로 사라진다(숫자 인덱스만 직렬화되므로).
        const obj = v => (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
        save.caught = obj(o.caught);
        save.missed = o.missed | 0;
        save.perfect = o.perfect | 0;
        // 아래는 전부 나중에 추가된 필드 — 예전 기록엔 없다 (없으면 기본값)
        save.spot = o.spot === 'night' ? 'night' : 'meadow';
        save.coins = o.coins | 0;
        save.coinEarned = o.coinEarned | 0;
        save.jars = obj(o.jars);
        save.achieved = Array.isArray(o.achieved) ? o.achieved.filter(x => typeof x === 'string') : [];
        // 가진 채집망 목록이 이상하면 상점이 영영 잠긴다 (앞 단계를 안 가진 걸로 보여서)
        // → 아는 id만 남기고, 기본 채집망은 반드시 넣는다
        const NET_IDS = ['stick', 'bamboo', 'silk', 'golden'];
        save.nets = Array.isArray(o.nets) ? o.nets.filter(x => NET_IDS.includes(x)) : [];
        if (!save.nets.includes('stick')) save.nets.unshift('stick');
        save.net = NET_IDS.includes(o.net) && save.nets.includes(o.net) ? o.net : 'stick';
        save.jar = ['none', 'honey', 'glow'].includes(o.jar) ? o.jar : 'none';
        save.jamBest = o.jamBest | 0;
        const HAT_IDS = ['none', 'straw', 'explorer', 'firefly'];
        const SKIN_IDS = ['wood', 'sky', 'pink', 'rainbow'];
        save.hats = Array.isArray(o.hats) ? o.hats.filter(x => HAT_IDS.includes(x)) : [];
        if (!save.hats.includes('none')) save.hats.unshift('none');
        save.hat = save.hats.includes(o.hat) ? o.hat : 'none';
        save.netSkins = Array.isArray(o.netSkins) ? o.netSkins.filter(x => SKIN_IDS.includes(x)) : [];
        if (!save.netSkins.includes('wood')) save.netSkins.unshift('wood');
        save.netSkin = save.netSkins.includes(o.netSkin) ? o.netSkin : 'wood';
      }
    }
  } catch (e) {}
})();
function persistSave() {
  if (TEST_MODE || PREVIEW) return;   // 검증·미리보기는 진짜 기록을 건드리지 않는다
  LS.set(SAVE_KEY, JSON.stringify(save));
}
function caughtCount(id) { return save.caught[id] | 0; }

function spotBugs(spot) { return BUGS.filter(b => b.spot === (spot || save.spot)); }

// ============================================================
const LANGS = ['ko', 'en'];
const LANG_NAMES = { ko: '한국어', en: 'English' };

function detectLang() {
  const list = navigator.languages || [navigator.language || 'en'];
  for (const l of list) {
    const s = String(l).toLowerCase();
    if (s.startsWith('ko')) return 'ko';
    if (s.startsWith('en')) return 'en';
  }
  return 'en';   // 모르는 언어는 영어로 (한국어로 시작하면 아무것도 못 읽는다)
}
let LANG = LS.get('sketch-bugs-lang') || detectLang();
if (!LANGS.includes(LANG)) LANG = 'en';
document.documentElement.lang = LANG;

function LX(v) {
  if (v == null) return '';
  if (typeof v === 'string') return v;
  return v[LANG] || v.en || v.ko || '';
}
function tr(key, ...args) {
  let s = LX(T[key]);
  args.forEach((a, i) => { s = s.split('%' + (i + 1)).join(a); });
  return s;
}
function bugName(b) { return LANG === 'ko' ? b.ko : (b[LANG] || b.en || b.ko); }

// 효과음 — 파일 없이 웹오디오 합성 (곤충 울음도 전부 합성!)
// ============================================================
let SFX = LS.get('sketch-bugs-sfx') !== 'off';
let VOLUME = parseFloat(LS.get('sketch-bugs-vol') || '1');
if (![1, 0.6, 0.3].includes(VOLUME)) VOLUME = 1;
let BOIL = LS.get('sketch-bugs-boil') !== 'off';
let audioCtx = null;
function beep(freq, dur, type = 'sine', vol = 0.18, delay = 0, slide = 0) {
  if (!SFX || TEST_MODE) return;
  vol *= VOLUME;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  appear:  () => { beep(660, 0.09, 'square', 0.1); beep(880, 0.12, 'square', 0.1, 0.09); },
  tap:     () => beep(760, 0.06, 'square', 0.14),

// 코인 = 희귀도(30÷weight) × 밤 1.5배 × 전설 3배 × 퍼펙트 2배
function coinFor(b, perfect) {
  let c = Math.max(1, Math.round(30 / b.weight));
  if (b.spot === 'night') c = Math.round(c * 1.5);
  if (b.rare) c *= 3;
  if (perfect) c *= 2;
  return c;
}

// 희귀도 (weight가 작을수록 귀함)
function rarityOf(b) {
  if (b.weight <= 4) return { stars: 4, key: 'rarity4' };
  if (b.weight <= 9) return { stars: 3, key: 'rarity3' };
  if (b.weight <= 16) return { stars: 2, key: 'rarity2' };
  return { stars: 1, key: 'rarity1' };
}

// 도감·연습방에서 울음 한 번 통째로 들려주기
function playCry(bug) {
  const times = noteTimesFor(bug);
  for (const ms of times) { try { bug.sound(ms / 1000); } catch (e) {} }
}

// 출현율 = weight × 꿀단지 배수 (귀한 곤충 weight ≤ 9에만 적용)
function bugWeight(b) {
  const jar = curJar();
  return b.weight * (b.weight <= 9 ? jar.rareMul : 1);
}
// 처음 하는 사람에게 제일 쉬운 곤충을 준다.
// 그냥 두면 첫 곤충이 5~6음일 확률이 40%인데, 한 번만 어긋나도 날아가므로 첫판에 너무 가혹하다.
// (낚시도 같은 문제를 겪고 "첫판은 제일 쉬운 물고기"로 고쳤다)
function easiestBug(pool) {
  return pool.slice().sort((a, b) =>
    (a.gaps.length - b.gaps.length) || (b.weight - a.weight))[0];
}

function pickBug() {
  const pool = spotBugs();
  if (totalCaught() === 0) return easiestBug(pool);   // 한 마리도 못 잡았으면 제일 쉬운 것

  const total = pool.reduce((s, b) => s + bugWeight(b), 0);
  let r = Math.random() * total;
  for (const b of pool) { r -= bugWeight(b); if (r <= 0) return b; }
  return pool[0];
}

function noteTimesFor(bug) {
  const beat = BASE_BEAT * bug.speed;
  const times = [0];
  for (const g of bug.gaps) times.push(times[times.length - 1] + g * beat);
  return times;
}

// ============================================================
// 🎵 합주 미니게임 — 잡은 곤충 세 마리가 무대에서 차례로 울고,
//    그 전체를 하나의 곡처럼 이어서 따라친다
// ============================================================
const JAM_SLOTS = 3;
const JAM_REST = 1.2;   // 곤충이 바뀔 때 쉬는 박 (여기가 제일 헷갈리는 지점 = 재미)

function caughtBugs() { return BUGS.filter(b => caughtCount(b.id) > 0); }

// 세 마리의 박자를 이어붙여 한 곡으로. 음마다 어느 곤충 것인지도 같이 들고 있는다
// (울 때 그 곤충 소리로 울고, 음표도 그 곤충 색으로 그린다)
function buildJamSong(bugs) {
  const times = [], owners = [];
  let base = 0;
  bugs.forEach((b, i) => {
    const ts = noteTimesFor(b);
    ts.forEach(x => { times.push(base + x); owners.push(b); });
    base += ts[ts.length - 1] + JAM_REST * BASE_BEAT * b.speed;
  });
  return { times, owners };
}

function startJam(t) {
  const song = buildJamSong(game.jamBugs);
  game.jam = true;
  game.practice = false;
  game.bug = game.jamBugs[0];
  game.noteTimes = song.times;
  game.noteBugs = song.owners;
  game.replays = 0;
  sfx.appear();
  startCall(t + 700);
}

// 지금 음이 어느 곤충 것인가 (합주가 아니면 그냥 그 판의 곤충)
function noteBugAt(i) {
  if (game.noteBugs && game.noteBugs[i]) return game.noteBugs[i];
  return game.bug;
}

function startWaiting(t) {
  game.state = 'waiting';
  game.bug = null;
  game.caughtBug = null;
  game.lastJudge = null;
  game.notePops = [];
  game.biteAt = t + 1800 + Math.random() * 3000;
}

function spawnBug(t, forced) {
  // 꿀단지는 곤충이 나타날 때 1개 쓴다 (잡든 놓치든)
  if (!forced && !game.practice) {
    const j = curJar();
    if (!j.free) {
      save.jars[j.id] = Math.max(0, (save.jars[j.id] | 0) - 1);
      if (save.jars[j.id] === 0) save.jar = 'none';
      persistSave();
    }
  }
  game.bug = forced || pickBug();
  game.noteTimes = noteTimesFor(game.bug);
  game.replays = 0;
  sfx.appear();
  startCall(t + 700);
}

function startCall(t) {
  game.state = 'call';
  game.callStart = t;
  game.notesPlayed = 0;
  game.notePops = [];
}

function startEcho(t) {
  game.state = 'echo';
  game.echoStart = t;
  game.anchor = 0;
  game.ni = 0;
  game.results = [];
  game.notePops = [];
}

function finishCatch(t) {
  game.state = 'result';
  game.wasPerfect = game.results.every(r => r === 'perfect');
  game.swingAt = t;

  // 합주는 곤충을 잡는 게 아니라 곡을 끝낸 것
  if (game.jam) {
    game.caughtBug = null;
    game.jamWon = true;
    const n = game.noteTimes.length;
    game.jamNewBest = n > save.jamBest;
    if (game.jamNewBest) save.jamBest = n;
    game.gained = Math.round(game.jamBugs.reduce((s, b) => s + coinFor(b), 0) * 1.5)
                * (game.wasPerfect ? 2 : 1);
    addCoins(game.gained);
    checkAchievements(t);
    persistSave();
    sfx.caught();
    return;
  }

  game.caughtBug = game.bug;
  sfx.swing();
  game.isNew = false;
  game.gained = 0;
  if (!game.practice) {
    game.isNew = caughtCount(game.bug.id) === 0;
    game.sessionCaught++;
    save.caught[game.bug.id] = caughtCount(game.bug.id) + 1;
    if (game.wasPerfect) save.perfect++;
    game.gained = coinFor(game.bug, game.wasPerfect);
    addCoins(game.gained);
    checkAchievements();
    persistSave();
  }
  sfx.caught();
}

function escapeBug(t, why) {
  game.state = 'result';
  game.caughtBug = null;
  game.escapeWhy = why;
  game.swingAt = t;          // 헛스윙도 휘두르는 건 똑같다
  if (game.jam) {            // 합주는 곤충이 도망가는 게 아니라 곡이 삐끗한 것
    game.jamWon = false;
    sfx.escape();
    return;
  }
  sfx.swing();
  if (!game.practice) {
    game.sessionMissed++;
    save.missed++;
    persistSave();
  }
  sfx.escape();
}

// ---------- 진행 로직 (시간을 인자로 받아서 검증 때 직접 부를 수 있다) ----------
function logic(t) {
  if (game.state === 'waiting' && t >= game.biteAt) spawnBug(t);

  if (game.state === 'call' && t >= game.callStart) {
    // 울 차례가 된 음을 전부 울린다
    while (game.notesPlayed < game.noteTimes.length &&
           t >= game.callStart + game.noteTimes[game.notesPlayed]) {
      const nb = noteBugAt(game.notesPlayed);
      try { if (nb && nb.sound) nb.sound(); } catch (e) {}
      game.notePops.push(t);
      game.notesPlayed++;
    }
    const last = game.noteTimes[game.noteTimes.length - 1];
    if (game.notesPlayed >= game.noteTimes.length && t >= game.callStart + last + 700) {
      startEcho(t);
    }
  }

  if (game.state === 'echo') {
    if (!game.anchor) {
      // 첫 탭을 기다리는 중 — 너무 오래 걸리면 곤충이 다시 울어준다 (친절!)
      // 연습방에선 몇 번이고 다시 울어준다 (날아가지 않는다)
      if (t > game.echoStart + FIRST_TAP_WAIT) {
        if (game.practice || game.replays < MAX_REPLAYS) { game.replays++; startCall(t + 400); }
        else escapeBug(t, 'timeout');
      }
    } else if (game.ni < game.noteTimes.length) {
      // 다음 음을 너무 오래 안 누르면 놓침
      const expected = game.anchor + game.noteTimes[game.ni];
      // 놓침 판정도 채집망 보정을 같이 받아야 한다
      // (안 그러면 좋은 채를 껴도 "늦음" 컷이 그대로라 판정 폭이 잘린다)
      if (t > expected + GOOD_BASE * judgeMul() + 200) escapeBug(t, 'late');
    }
  }
}

// ---------- 화면 이동 ----------
function goMenu() {
  game.state = 'menu';
  game.practice = false;
  game.jam = false;
  game.noteBugs = null;
  game.bug = null;
  game.caughtBug = null;
  game.dexCard = null;
  game.settingsOpen = false;
}

function goJam() {
  game.state = 'jam';
  game.jam = false;
  game.noteBugs = null;
  game.jamPage = 0;
  game.settingsOpen = false;
  // 무대에 올렸던 곤충 중 아직 안 잡은 게 있으면(미리보기 등) 정리
  game.jamBugs = game.jamBugs.filter(b => b && caughtCount(b.id) > 0).slice(0, JAM_SLOTS);
}

// 도감을 어디서 열었는지 기억해뒀다가 닫을 때 그리로 돌려보낸다.
// (게임 중에 열었는데 닫으면 메뉴로 튕기던 버그 — 2026-08-01 플레이 중 발견)
function goDex(from) {
  game.dexFrom = from || (game.state === 'menu' ? 'menu' : 'game');
  game.state = 'dex';
  game.dexCard = null;
  game.dexPage = 0;
  game.dexTab = save.spot;   // 지금 있는 지역 탭이 기본
}

// 낮 풀밭 ↔ 밤의 숲
function switchSpot(t) {
  save.spot = save.spot === 'night' ? 'meadow' : 'night';
  persistSave();
  renderSceneToCache();      // ⚠️ 배경이 바뀌는 곳에선 반드시 캐시를 다시 만든다
  sfx.appear();
  game.practice = false;
  startWaiting(t);
}

function closeDex(t) {
  if (game.dexFrom === 'game') {
    // 낚시로 치면 "던지기 대기"로 돌아가는 것 — 기다림을 새로 시작한다
    game.practice = false;
    startWaiting(t);
  } else {
    goMenu();
  }
}

// 연습방에서 고를 수 있는 곤충: 잡아본 것만 (하나도 없으면 제일 쉬운 것 하나)
function practiceList() {
  const got = BUGS.filter(b => caughtCount(b.id) > 0);
  return got.length ? got : [BUGS[0]];
}

function goPractice(t) {
  game.state = 'waiting';
  game.practice = true;
  game.practiceIdx = Math.min(game.practiceIdx, practiceList().length - 1);
  startPracticeRound(t);
}

function startPracticeRound(t) {
  const list = practiceList();
  game.caughtBug = null;
  game.lastJudge = null;
  spawnBug(t, list[game.practiceIdx]);
}

// ---------- 탭 (스페이스 / 엔터 / 클릭 / 터치) ----------
// 박자를 치는 탭만 여기로 온다. 버튼 클릭은 onPointer가 먼저 가로챈다.
function onTap(t) {
  if (game.state === 'menu' || game.state === 'dex' || game.state === 'gallery'
      || game.state === 'shop' || game.state === 'achv' || game.state === 'jam'
      || game.state === 'stats') return;
  if (game.state === 'result') {
    // ⚠️ 마지막 음 뒤에 한 번 더 치는 건 초보가 거의 다 하는 행동이다. 쿨다운이 없으면
    //    그 여분의 탭 하나로 잠자리채 연출·곤충 그림·NEW·코인·개그가 통째로 스킵된다.
    if (t - game.swingAt < RESULT_LOCK_MS) return;
    if (game.jam) goJam();              // 합주는 무대로 돌아간다
    else if (game.practice) startPracticeRound(t);
    else startWaiting(t);
    return;
  }
  if (game.state !== 'echo') return;

  if (!game.anchor) {
    // 첫 탭 = 기준! 여기부터 박자를 잰다
    game.anchor = t;
    game.results = ['perfect'];
    game.ni = 1;
    game.notePops.push(t);
    game.lastJudge = { at: t, txt: tr('judgeStart'), color: C.navy };
    sfx.tap();
    if (game.noteTimes.length === 1) finishCatch(t);
    return;
  }
  if (game.ni >= game.noteTimes.length) return;   // 이미 다 눌렀으면 무시

  const expected = game.anchor + game.noteTimes[game.ni];
  const diff = Math.abs(t - expected);
  const PERFECT_MS = PERFECT_BASE * judgeMul();   // 좋은 채집망일수록 넉넉해진다
  const GOOD_MS = GOOD_BASE * judgeMul();
  if (diff <= PERFECT_MS) {
    game.results.push('perfect');
    game.lastJudge = { at: t, txt: tr('judgePerf'), color: C.redDark };
    sfx.perfect();
  } else if (diff <= GOOD_MS) {
    game.results.push('good');
    game.lastJudge = { at: t, txt: tr('judgeGood'), color: C.darkGreen };
    sfx.good();
  } else {
    escapeBug(t, t < expected ? 'early' : 'late');
    return;
  }
  game.notePops.push(t);
  game.ni++;
  if (game.ni >= game.noteTimes.length) finishCatch(t);
}

// ============================================================
// 배경 (풀밭 페이지) — 오프스크린에 캐시. 보일은 기다림·결과에서만
// ============================================================
let sceneCanvas = null, sceneCtx = null;
const SPIRAL_H = 46;

function drawSketchbook() {
  ctx.fillStyle = C.desk;
  ctx.fillRect(0, 0, W, H);

  const m = Math.min(W, H) * 0.015;
  const px = m, py = SPIRAL_H * 0.55, pw = W - m * 2, ph = H - py - m;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.35)';
  ctx.shadowBlur = 14;
  ctx.shadowOffsetY = 5;
  ctx.fillStyle = C.paper;
  ctx.beginPath();
  ctx.roundRect(px, py, pw, ph, 6);
  ctx.fill();
  ctx.restore();

  // 스프링
  const n = Math.floor(W / 46);
  for (let i = 0; i < n; i++) {
    const x = (i + 0.5) * (W / n);
    ctx.save();
    ctx.strokeStyle = '#b9bec6';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.ellipse(x, SPIRAL_H * 0.55, 8, SPIRAL_H * 0.42, 0.25, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  SCENE.paper = { x: px, y: py, w: pw, h: ph };
}

function drawMeadow() {
  const p = SCENE.paper;
  const horizon = p.y + p.h * 0.42;

  // 하늘
  scribbleFill(rectRows(p.x + 8, p.y + 10, p.w - 16, horizon - p.y - 6, 16),

  const sx = p.x + p.w * 0.1, sy = p.y + p.h * 0.15, sr = Math.max(30, Math.min(46, p.w * 0.05));
  scribbleFill(ellipseRows(sx, sy, sr, sr, 9), { color: C.yellow, width: 9, seed: 21, alpha: 0.75 });
  crayonPath(ellipsePts(sx, sy, sr, sr), { color: C.orange, width: 5, seed: 22 });
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + 0.3;

                [sx + Math.cos(a) * (sr + 22), sy + Math.sin(a) * (sr + 22)]],

  crayonPath(ellipsePts(cx1, cy1, 64, 22), { color: C.gray, width: 4, seed: 32, alpha: 0.6 });

  // 풀밭
  scribbleFill(rectRows(p.x + 8, horizon, p.w - 16, p.y + p.h - horizon - 8, 15),
    { color: C.green, width: 13, seed: 41, alpha: 0.42, overshoot: 12 });
  // 풀 몇 가닥
  const rand = mulberry32(777);
  for (let i = 0; i < 26; i++) {
    const gx = p.x + 24 + rand() * (p.w - 48);

  }
  // 꽃
  for (let i = 0; i < 7; i++) {
    const fx = p.x + 40 + rand() * (p.w - 80);

    crayonPath([[fx, fy + 14], [fx, fy]], { color: C.darkGreen, width: 3, seed: 140 + i });
    for (let k = 0; k < 5; k++) {
      const a = (k / 5) * Math.PI * 2;
      scribbleFill(ellipseRows(fx + Math.cos(a) * 7, fy + Math.sin(a) * 7, 5, 5, 4),
        { color: col, width: 4, seed: 150 + i * 5 + k, alpha: 0.8 });
    }
  }

  // 오른쪽 덤불 (곤충이 나타나는 곳)
  const bx = p.x + p.w * 0.76, by = horizon + p.h * 0.32;
  const brx = Math.max(70, p.w * 0.12), bry = Math.max(50, p.h * 0.13);
  scribbleFill(ellipseRows(bx, by, brx, bry, 11),
    { color: C.darkGreen, width: 11, seed: 61, alpha: 0.55 });

  SCENE.bugY = by - bry - 26;

  // 왼쪽 나무
  const tx = p.x + p.w * 0.07, tyTop = horizon - p.h * 0.1;
  crayonPath([[tx, horizon + 40], [tx, tyTop]], { color: C.brown, width: 14, seed: 71 });
  scribbleFill(ellipseRows(tx + 4, tyTop - 34, 52, 42, 11), { color: C.green, width: 10, seed: 72, alpha: 0.65 });
  crayonPath(ellipsePts(tx + 4, tyTop - 34, 52, 42), { color: C.darkGreen, width: 5, seed: 73 });

  drawKid(p.x + p.w * 0.34, horizon + p.h * 0.36);

// ---------- 아이 + 잠자리채 (밤엔 옷 색이 어두워진다) ----------
function drawKid(x, y, night) {
  // 몸통 (낮엔 노란 티셔츠, 밤엔 남색 잠옷)
  const shirt = night ? '#4a5d9e' : C.yellow;
  const shirtLine = night ? C.navy : C.orange;
  scribbleFill(ellipseRows(x, y, 20, 26, 7), { color: shirt, width: 7, seed: 81, alpha: 0.8 });
  crayonPath(ellipsePts(x, y, 20, 26), { color: shirtLine, width: 4, seed: 82 });
  // 머리
  const hy = y - 44;
  scribbleFill(ellipseRows(x, hy, 17, 17, 6), { color: C.skin, width: 6, seed: 83, alpha: 0.9 });
  crayonPath(ellipsePts(x, hy, 17, 17), { color: C.brown, width: 4, seed: 84 });
  // 머리카락
  crayonPath([[x - 15, hy - 8], [x - 6, hy - 16], [x + 5, hy - 17], [x + 15, hy - 9]],
    { color: C.darkBrown, width: 6, seed: 85 });
  // 모자 (상점에서 산 것) — 배경 캐시에 그려지므로 바꾸면 renderSceneToCache()를 불러야 한다
  drawHat(x, hy);
  // 눈 + 입 (오른쪽 덤불을 봄)
  ctx.save();
  ctx.fillStyle = C.black;
  ctx.beginPath(); ctx.arc(x + 4, hy - 2, 2.2, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 12, hy - 2, 2.2, 0, 7); ctx.fill();
  ctx.restore();
  crayonPath([[x + 4, hy + 8], [x + 9, hy + 10], [x + 13, hy + 7]], { color: C.redDark, width: 2.5, seed: 86 });
  // 다리
  crayonPath([[x - 8, y + 24], [x - 9, y + 44]], { color: C.navy, width: 7, seed: 87 });
  crayonPath([[x + 8, y + 24], [x + 9, y + 44]], { color: C.navy, width: 7, seed: 88 });
  // 팔 (잠자리채는 배경이 아니라 매 프레임 그린다 — 휘둘러야 하니까)
  const hx = x + 34, hyy = y - 20;
  crayonPath([[x + 14, y - 6], [hx, hyy]], { color: C.skin, width: 6, seed: 89 });

  SCENE.handY = hyy;
}

// ---------- 모자 (머리 중심 hx,hy 기준) ----------
// id를 주면 그 모자를, 안 주면 지금 쓰고 있는 모자를 그린다.
// ⚠️ 상점 미리보기는 반드시 id를 넘길 것 — 안 넘기면 네 칸이 전부 같은 모자로 그려진다.
function drawHat(x, hy, s, id) {
  s = s || 1;
  id = id || curHat().id;
  if (id === 'none') return;
  if (id === 'straw') {
    // 넓은 챙 + 낮은 봉우리
    crayonPath([[x - 30 * s, hy - 12 * s], [x + 30 * s, hy - 12 * s]],
      { color: '#e0c070', width: 7 * s, seed: 610 });
    scribbleFill(ellipseRows(x, hy - 20 * s, 15 * s, 10 * s, 5 * s),
      { color: '#e8cd85', width: 6 * s, seed: 611, alpha: 0.9 });
    crayonPath(ellipsePts(x, hy - 20 * s, 15 * s, 10 * s),
      { color: C.brown, width: 3.5 * s, seed: 612 });
    crayonPath([[x - 15 * s, hy - 17 * s], [x + 15 * s, hy - 17 * s]],
      { color: C.redDark, width: 4 * s, seed: 613, alpha: 0.8 });
  } else if (id === 'explorer') {
    // 사파리 헬멧 — 앞으로 챙이 길다
    scribbleFill(ellipseRows(x, hy - 18 * s, 19 * s, 13 * s, 5 * s),
      { color: '#a9b48a', width: 6 * s, seed: 620, alpha: 0.92 });
    crayonPath(ellipsePts(x, hy - 18 * s, 19 * s, 13 * s), { color: C.darkGreen, width: 4 * s, seed: 621 });
    crayonPath([[x - 22 * s, hy - 10 * s], [x + 30 * s, hy - 12 * s]],
      { color: '#8d9970', width: 7 * s, seed: 622 });
    crayonPath([[x - 19 * s, hy - 20 * s], [x + 19 * s, hy - 20 * s]],
      { color: C.darkBrown, width: 4 * s, seed: 623, alpha: 0.8 });
  } else if (id === 'firefly') {
    // 반딧불이 왕관 — 뾰족한 금관 + 끝마다 빛나는 점
    const pts = [];
    for (let i = 0; i <= 8; i++) {
      const px = x - 20 * s + (40 * s) * (i / 8);
      pts.push([px, hy - 14 * s - (i % 2 ? 16 * s : 0)]);
    }
    crayonPath(pts, { color: C.yellow, width: 5 * s, seed: 630 });
    crayonPath([[x - 20 * s, hy - 12 * s], [x + 20 * s, hy - 12 * s]],
      { color: C.orange, width: 5 * s, seed: 631 });
    for (let i = 1; i <= 7; i += 2) {
      const px = x - 20 * s + (40 * s) * (i / 8);
      scribbleFill(ellipseRows(px, hy - 32 * s, 4 * s, 4 * s, 3),
        { color: '#d9ff7a', width: 3 * s, seed: 632 + i, alpha: 0.95 });
    }
  }
}

// ---------- 잠자리채 (손을 축으로 회전) ----------
// 배경 캐시에 넣으면 휘두를 수가 없어서 움직이는 층에서 그린다.
const NET_REST = Math.atan2(-40, 34);   // 평소 각도 (오른쪽 위로 비스듬히)
const SWING_MS = 620;                   // 휘두르는 데 걸리는 시간

// 0~1 진행도를 각도로. 뒤로 젖혔다가(0~0.3) 확 휘두르고(0.3~0.6) 돌아온다(0.6~1)
function swingAngle(u) {
  if (u <= 0 || u >= 1) return NET_REST;
  const back = NET_REST - 0.55;            // 젖힌 각도 (더 위로)
  const fore = NET_REST + 1.15;            // 휘두른 각도 (오른쪽 아래로 쭉)
  if (u < 0.3) return NET_REST + (back - NET_REST) * (u / 0.3);
  if (u < 0.6) {
    const k = (u - 0.3) / 0.3;
    return back + (fore - back) * (1 - (1 - k) * (1 - k));   // 빠르게 나갔다가 감속
  }
  const k = (u - 0.6) / 0.4;
  return fore + (NET_REST - fore) * k;
}

// 채 테두리(후프)의 중심 — 곤충이 여기로 빨려 들어간다
function netHoopXY(ang) {
  const hx = SCENE.handX, hy = SCENE.handY;
  if (hx == null) return { x: 0, y: 0 };
  const len = 52 + 26;   // 손잡이 + 후프 중심까지
  return { x: hx + Math.cos(ang) * len, y: hy + Math.sin(ang) * len };
}

function drawNet(ang) {
  const hx = SCENE.handX, hy = SCENE.handY;
  if (hx == null) return;
  const skin = curSkin();
  const ca = Math.cos(ang), sa = Math.sin(ang);
  // 손잡이
  const px = hx + ca * 52, py = hy + sa * 52;
  crayonPath([[hx, hy], [px, py]], { color: skin.pole, width: 5, seed: 90 });
  // 후프 (진행 방향을 긴 축으로 눕힌 타원)
  const cx = hx + ca * 78, cy = hy + sa * 78;
  const pts = [];
  for (let i = 0; i <= 34; i++) {
    const a = (i / 34) * Math.PI * 2;
    const ex = Math.cos(a) * 22, ey = Math.sin(a) * 18;
    pts.push([cx + ex * ca - ey * sa, cy + ex * sa + ey * ca]);
  }
  if (skin.rainbow) {
    // 무지개는 테두리를 네 조각으로 나눠 색을 바꿔 칠한다
    const cols = [C.red, C.yellow, C.green, C.skyBlue];
    for (let k = 0; k < 4; k++) {
      const seg = pts.slice(Math.floor(k * 34 / 4), Math.floor((k + 1) * 34 / 4) + 2);
      if (seg.length > 1) crayonPath(seg, { color: cols[k], width: 4.5, seed: 91 + k });
    }
  } else {
    crayonPath(pts, { color: skin.hoop, width: 4, seed: 91 });
  }
  // 그물망 (후프 안쪽 격자)
  for (let i = -1; i <= 1; i++) {
    const o = i * 11;
    const a1 = [cx + (-18) * ca - o * sa, cy + (-18) * sa + o * ca];
    const a2 = [cx + 18 * ca - o * sa, cy + 18 * sa + o * ca];
    crayonPath([a1, a2], { color: skin.hoop, width: 1.6, seed: 92 + i, alpha: 0.5 });
    const b1 = [cx + o * ca - (-14) * sa, cy + o * sa + (-14) * ca];
    const b2 = [cx + o * ca - 14 * sa, cy + o * sa + 14 * ca];
    crayonPath([b1, b2], { color: skin.hoop, width: 1.6, seed: 96 + i, alpha: 0.5 });
  }
}

// ---------- 🌙 밤의 숲 ----------
function drawNightForest() {
  const p = SCENE.paper;
  const horizon = p.y + p.h * 0.46;

  // 밤하늘 (진한 남색)
  scribbleFill(rectRows(p.x + 8, p.y + 10, p.w - 16, horizon - p.y - 6, 13),
    { color: '#243358', width: 15, seed: 211, alpha: 0.86, overshoot: 10 });

  // 달
  // 왼쪽 위 메뉴 버튼과 안 겹치게 살짝 안쪽으로
  const mx = p.x + p.w * 0.24, my = p.y + p.h * 0.13, mr = Math.max(28, Math.min(42, p.w * 0.045));
  scribbleFill(ellipseRows(mx, my, mr, mr, 8), { color: '#fff3c4', width: 9, seed: 221, alpha: 0.95 });
  crayonPath(ellipsePts(mx, my, mr, mr), { color: C.yellow, width: 4, seed: 222 });

  // 별
  const rand = mulberry32(31337);
  for (let i = 0; i < 34; i++) {
    const sx = p.x + 20 + rand() * (p.w - 40);
    const sy = p.y + 16 + rand() * (horizon - p.y - 40);
    const r = 2 + rand() * 3;
    crayonPath([[sx - r, sy], [sx + r, sy]], { color: '#fffbe6', width: 2.2, seed: 230 + i, alpha: 0.9 });
    crayonPath([[sx, sy - r], [sx, sy + r]], { color: '#fffbe6', width: 2.2, seed: 270 + i, alpha: 0.9 });
  }

  // 땅 (어두운 풀) — 크림색 종이 위라 진하게 칠해야 밤처럼 보인다
  scribbleFill(rectRows(p.x + 8, horizon, p.w - 16, p.y + p.h - horizon - 8, 13),
    { color: '#1e3526', width: 15, seed: 241, alpha: 0.9, overshoot: 12 });
  for (let i = 0; i < 22; i++) {
    const gx = p.x + 24 + rand() * (p.w - 48);
    const gy = horizon + 18 + rand() * (p.h * 0.42 - 28);
    crayonPath([[gx, gy], [gx - 4 + rand() * 8, gy - 13 - rand() * 9]],
      { color: '#16261c', width: 3.5, seed: 300 + i, alpha: 0.75 });
  }

  // 나무 실루엣 (뒤로 여러 그루) — 줄기는 짧고 잎은 크게 (야자수처럼 보이지 않도록)
  for (let i = 0; i < 5; i++) {
    const tx = p.x + p.w * (0.06 + i * 0.18) + rand() * 24;
    const th = p.h * (0.09 + rand() * 0.06);
    crayonPath([[tx, horizon + 20], [tx, horizon - th]], { color: '#1b2b22', width: 15, seed: 330 + i });
    const lr = 54 + rand() * 18;
    scribbleFill(ellipseRows(tx, horizon - th - lr * 0.55, lr, lr * 0.75, 12),
      { color: '#1f3327', width: 13, seed: 340 + i, alpha: 0.85 });
    crayonPath(ellipsePts(tx, horizon - th - lr * 0.55, lr, lr * 0.75),
      { color: '#16261c', width: 4, seed: 350 + i, alpha: 0.8 });
  }

  // 반딧불이 몇 마리 (배경 장식 — 잡는 곤충과는 별개)
  for (let i = 0; i < 9; i++) {
    const fx = p.x + 60 + rand() * (p.w - 120);
    const fy = horizon - 40 + rand() * (p.h * 0.4);
    scribbleFill(ellipseRows(fx, fy, 4, 4, 3), { color: '#d9ff7a', width: 4, seed: 360 + i, alpha: 0.95 });
  }

  // 곤충이 앉는 덤불
  const bx = p.x + p.w * 0.76, by = horizon + p.h * 0.26;
  const brx = Math.max(70, p.w * 0.12), bry = Math.max(46, p.h * 0.12);
  scribbleFill(ellipseRows(bx, by, brx, bry, 11), { color: '#1f3327', width: 11, seed: 380, alpha: 0.75 });
  crayonPath(ellipsePts(bx, by, brx, bry), { color: '#2f5140', width: 5, seed: 381 });
  SCENE.bugX = bx;
  SCENE.bugY = by - bry - 26;

  drawKid(p.x + p.w * 0.34, horizon + p.h * 0.3, true);
}

function renderSceneToCache() {
  if (!sceneCanvas) {
    sceneCanvas = document.createElement('canvas');
    sceneCtx = sceneCanvas.getContext('2d');
  }
  sceneCanvas.width = cv.width;
  sceneCanvas.height = cv.height;
  if (!sceneCtx) return;                       // 컨텍스트를 못 얻으면 조용히 포기
  const mainCtx = ctx;
  try {
    ctx = sceneCtx;                            // 크레파스 함수들이 캐시에 그리도록 잠깐 교체
    applyTransform(ctx);
    drawSketchbook();
    if (save.spot === 'night') drawNightForest(); else drawMeadow();
  } finally {
    ctx = mainCtx;   // ⚠️ 중간에 예외가 나도 반드시 되돌린다.
                     //    안 그러면 이후 모든 그림이 안 보이는 캔버스로 가서 검은 화면이 된다.
  }
}

// ============================================================
// 곤충 그림 조립기 — 부품(몸·날개·무늬·다리·더듬이)을 조합해서 그린다
// ------------------------------------------------------------
// 처음 12마리는 한 마리씩 손으로 그렸지만, 곤충이 늘어나면서 그 방식은
// 감당이 안 됐다. 새 곤충은 `art` 파라미터만 적으면 여기서 그려진다.
//   art: { body, w, h, c1, c2, wing, pat, legs, ant, horn, tail, ... }
// ============================================================
function drawBugArt(b, x, y, s) {
  const a = b.art;
  const sd = (b.id.length * 197 + b.weight * 31) | 0;
  const w = (a.w || 24) * s, h = (a.h || 15) * s;
  const c1 = a.c1 || b.color, c2 = a.c2 || C.darkBrown;
  const headX = x - w * 1.02;

  // ---- 다리 (몸보다 뒤에) ----
  if (a.legs) {
    const per = Math.max(2, Math.ceil(a.legs / 2));
    for (let i = 0; i < per; i++) {
      const px = x + (-0.6 + (i / Math.max(per - 1, 1)) * 1.2) * w;
      for (const sgn of [-1, 1]) {
        crayonPath([[px, y], [px - w * 0.14, y + sgn * h * 1.5], [px - w * 0.3, y + sgn * h * 2.1]],
          { color: c2, width: 2.4, seed: sd + 40 + i * 2 + (sgn > 0 ? 1 : 0) });
      }
    }
  }
  // 뛰는 뒷다리 (메뚜기·귀뚜라미·방아깨비)
  if (a.jump) {
    for (const sgn of [-1, 1]) {
      crayonPath([[x + w * 0.3, y + sgn * h * 0.3], [x + w * 0.75, y - sgn * h * 1.4],
                  [x + w * 1.15, y + sgn * h * 1.6]],
        { color: c2, width: 4, seed: sd + 60 + sgn });
    }
  }
  // 접은 앞다리 (사마귀)
  if (a.arms) {
    for (const sgn of [-1, 1]) {
      crayonPath([[headX + w * 0.3, y + sgn * h * 0.2], [headX - w * 0.2, y + sgn * h * 1.3],
                  [headX - w * 0.75, y + sgn * h * 0.3]],
        { color: c2, width: 4, seed: sd + 64 + sgn });
    }
  }

  // ---- 날개 (몸 뒤에) ----
  if (a.wing === 'clear') {
    crayonPath(ellipsePts(x - w * 0.1, y - h * 1.05, w * 0.85, h * 0.55),
      { color: C.gray, width: 3, seed: sd + 1, alpha: 0.5 });
    crayonPath(ellipsePts(x + w * 0.4, y - h * 1.2, w * 0.75, h * 0.5),
      { color: C.gray, width: 3, seed: sd + 2, alpha: 0.5 });
  } else if (a.wing === 'moth') {
    for (const sgn of [-1, 1]) {
      scribbleFill(ellipseRows(x + sgn * w * 0.25, y + h * 0.15, w * 1.0, h * 1.35, 7),
        { color: a.c3 || c1, width: 7, seed: sd + 5 + sgn, alpha: 0.62 });
      crayonPath(ellipsePts(x + sgn * w * 0.25, y + h * 0.15, w * 1.0, h * 1.35),
        { color: c2, width: 3, seed: sd + 8 + sgn, alpha: 0.7 });
    }
  } else if (a.wing === 'big4') {
    // 나비: 윗날개는 크고 넓게, 아랫날개는 작게 — 몸통이 가운데로 보이게 한다
    const ww = (a.wingW || 26) * s, wh = (a.wingH || 20) * s;
    const cols = [a.c3 || c1, a.c4 || a.c3 || c1, a.c5 || a.c3 || c1, a.c6 || a.c4 || c1];
    const wings = [
      [-0.78, -0.52, 0.80, 0.72], [0.78, -0.52, 0.80, 0.72],   // 윗날개
      [-0.62, 0.62, 0.62, 0.52], [0.62, 0.62, 0.62, 0.52],     // 아랫날개
    ];
    wings.forEach(([dx, dy, rx, ry], i) => {
      const wx = x + dx * ww, wy = y + dy * wh;
      scribbleFill(ellipseRows(wx, wy, ww * rx, wh * ry, 6),
        { color: cols[i], width: 6, seed: sd + 10 + i, alpha: 0.82 });
      crayonPath(ellipsePts(wx, wy, ww * rx, wh * ry),
        { color: c2, width: 3, seed: sd + 15 + i, alpha: 0.7 });
    });
  }

  // ---- 몸통 ----
  if (a.body === 'seg') {
    [[-0.8, 0.42], [0, 0.5], [0.85, 0.6]].forEach(([dx, r], i) => {
      scribbleFill(ellipseRows(x + dx * w, y, w * r, h * (r + 0.2), 5),
        { color: c1, width: 5, seed: sd + 20 + i, alpha: 0.85 });
      crayonPath(ellipsePts(x + dx * w, y, w * r, h * (r + 0.2)),
        { color: c2, width: 3.5, seed: sd + 24 + i });
    });
  } else if (a.body === 'worm') {
    const pts = [];
    for (let i = 0; i <= 18; i++) {
      const u = i / 18;
      pts.push([x - w + 2 * w * u, y + Math.sin(u * Math.PI * 2) * h * 0.55]);
    }
    crayonPath(pts, { color: c1, width: h * 1.7, seed: sd, alpha: 0.85, continuous: true });
    crayonPath(pts, { color: c2, width: 2.6, seed: sd + 1, alpha: 0.7 });
    if (a.fuzz) {
      for (let i = 1; i < 18; i += 2) {
        const [px, py] = pts[i];
        crayonPath([[px, py - h * 0.8], [px + (i % 4 - 1.5) * 3, py - h * 2.1]],
          { color: c2, width: 2, seed: sd + 70 + i, alpha: 0.8 });
      }
    }
  } else if (a.body === 'arch') {
    const pts = [];
    for (let i = 0; i <= 16; i++) {
      const u = i / 16;
      pts.push([x - w + 2 * w * u, y + h * 0.7 - Math.sin(u * Math.PI) * h * 1.7]);
    }
    crayonPath(pts, { color: c1, width: h * 1.5, seed: sd, alpha: 0.85, continuous: true });
    crayonPath(pts, { color: c2, width: 2.6, seed: sd + 1, alpha: 0.7 });
  } else {
    // oval / round / long / shield — 채우기는 같고 테두리만 다르다
    scribbleFill(ellipseRows(x, y, w, h, 6), { color: c1, width: 6, seed: sd, alpha: 0.85 });
    if (a.body === 'shield') {
      crayonPath([[x - w * 0.9, y - h * 0.8], [x + w * 0.35, y - h], [x + w, y * 1],
                  [x + w * 0.35, y + h], [x - w * 0.9, y + h * 0.8], [x - w * 0.9, y - h * 0.8]],
        { color: c2, width: 4, seed: sd + 1 });
    } else {
      crayonPath(ellipsePts(x, y, w, h), { color: c2, width: 4, seed: sd + 1 });
    }
  }

  // ---- 무늬 ----
  const vline = (u, wid, col, k, alpha) => {
    const half = h * Math.sqrt(Math.max(0, 1 - u * u));
    crayonPath([[x + u * w, y - half], [x + u * w, y + half]],
      { color: col, width: wid, seed: sd + 30 + k, alpha: alpha == null ? 0.85 : alpha });
  };
  if (a.pat === 'stripes') [-0.45, 0, 0.45].forEach((u, i) => vline(u, 5, c2, i));
  else if (a.pat === 'split') vline(0, 3.5, c2, 9);
  else if (a.pat === 'ring') [-0.6, -0.3, 0, 0.3, 0.6].forEach((u, i) => vline(u, 2.5, c2, i, 0.65));
  else if (a.pat === 'dots') {
    [[-0.45, -0.4], [0.4, -0.45], [-0.35, 0.45], [0.5, 0.4]].forEach(([dx, dy], i) => {
      scribbleFill(ellipseRows(x + dx * w, y + dy * h, w * 0.12, w * 0.12, 3),
        { color: c2, width: 3, seed: sd + 34 + i, alpha: 0.9 });
    });
  } else if (a.pat === 'button') {
    // 단추 구멍 네 개
    [[-0.28, -0.3], [0.28, -0.3], [-0.28, 0.3], [0.28, 0.3]].forEach(([dx, dy], i) => {
      scribbleFill(ellipseRows(x + dx * w, y + dy * h, w * 0.1, w * 0.1, 3),
        { color: c2, width: 3, seed: sd + 34 + i, alpha: 0.95 });
    });
    crayonPath(ellipsePts(x, y, w * 0.72, h * 0.72), { color: c2, width: 2.5, seed: sd + 39, alpha: 0.6 });
  }

  // ---- 머리 · 눈 ----
  const hr = Math.max(w * 0.24, h * 0.5);
  scribbleFill(ellipseRows(headX, y, hr, hr, 4), { color: a.headC || c2, width: 4, seed: sd + 50, alpha: 0.85 });
  ctx.save();
  ctx.fillStyle = a.headC === C.black || c2 === C.black ? '#fff' : C.black;
  const er = a.bigEye ? hr * 0.55 : Math.max(2, hr * 0.3);
  ctx.beginPath(); ctx.arc(headX - hr * 0.1, y - hr * 0.35, er, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(headX - hr * 0.1, y + hr * 0.35, er, 0, 7); ctx.fill();
  ctx.restore();

  // ---- 더듬이 ----
  if (a.ant) {
    const len = a.longAnt ? 2.4 : 1.2;
    for (let i = 0; i < a.ant; i++) {
      const sgn = a.ant === 1 ? -1 : (i ? 1 : -1);
      crayonPath([[headX - hr * 0.4, y + sgn * hr * 0.3],
                  [headX - w * 0.6 * len, y + sgn * h * 0.95 * len]],
        { color: c2, width: 2.4, seed: sd + 54 + i });
    }
  }
  // ---- 뿔 ----
  if (a.horn) {
    crayonPath([[headX, y], [headX - w * 0.7, y - h * 1.2], [headX - w * 0.45, y - h * 1.5]],
      { color: a.hornC || c2, width: 5, seed: sd + 58 });
  }
  // ---- 꼬리 ----
  if (a.tail === 'sting') {
    crayonPath([[x + w, y], [x + w * 1.5, y + h * 0.45]], { color: c2, width: 3.5, seed: sd + 62 });
  }
}

// ============================================================
// 곤충 그리기 (덤불 위에 앉은 모습, s = 크기 배율)
// ============================================================
function drawBug(bug, x, y, s) {
  if (bug.art) return drawBugArt(bug, x, y, s);   // 조립기로 그리는 곤충
  const sd = bug.id.length * 131;   // 손으로 그린 12마리 — 곤충마다 다른 시드
  if (bug.id === 'eraser-ladybug') {
    // 분홍 지우개 몸통 반구 + 까만 점
    scribbleFill(ellipseRows(x, y, 26 * s, 20 * s, 6), { color: C.pink, width: 6, seed: sd, alpha: 0.85 });
    crayonPath(ellipsePts(x, y, 26 * s, 20 * s), { color: C.redDark, width: 4, seed: sd + 1 });
    crayonPath([[x, y - 20 * s], [x, y + 20 * s]], { color: C.redDark, width: 3, seed: sd + 2 });
    [[-12, -6], [10, -8], [-8, 8], [12, 7]].forEach(([dx, dy], i) => {
      scribbleFill(ellipseRows(x + dx * s, y + dy * s, 4 * s, 4 * s, 3),
        { color: C.black, width: 3, seed: sd + 3 + i, alpha: 0.9 });
    });
    // 머리
    scribbleFill(ellipseRows(x - 28 * s, y, 8 * s, 8 * s, 4), { color: C.black, width: 4, seed: sd + 9, alpha: 0.85 });
  } else if (bug.id === 'whistle-cricket') {
    // 초록 몸통 + 긴 더듬이 + 큰 뒷다리
    scribbleFill(ellipseRows(x, y, 26 * s, 13 * s, 6), { color: C.green, width: 6, seed: sd, alpha: 0.85 });
    crayonPath(ellipsePts(x, y, 26 * s, 13 * s), { color: C.darkGreen, width: 4, seed: sd + 1 });
    crayonPath([[x - 22 * s, y - 8 * s], [x - 40 * s, y - 26 * s]], { color: C.darkGreen, width: 2.5, seed: sd + 2 });
    crayonPath([[x - 18 * s, y - 10 * s], [x - 30 * s, y - 30 * s]], { color: C.darkGreen, width: 2.5, seed: sd + 3 });
    crayonPath([[x + 6 * s, y + 8 * s], [x + 18 * s, y - 12 * s], [x + 26 * s, y + 10 * s]],
      { color: C.darkGreen, width: 4, seed: sd + 4 });
    ctx.save(); ctx.fillStyle = C.black;
    ctx.beginPath(); ctx.arc(x - 20 * s, y - 3 * s, 2.4 * s, 0, 7); ctx.fill(); ctx.restore();
  } else if (bug.id === 'crayon-cicada') {
    // 몸통이 크레파스! (주황 몸 + 뾰족한 끝) + 투명 날개
    crayonPath(ellipsePts(x - 6 * s, y - 10 * s, 24 * s, 12 * s), { color: C.gray, width: 3, seed: sd + 5, alpha: 0.5 });
    crayonPath(ellipsePts(x + 10 * s, y - 12 * s, 24 * s, 12 * s), { color: C.gray, width: 3, seed: sd + 6, alpha: 0.5 });
    scribbleFill(rectRows(x - 24 * s, y - 8 * s, 40 * s, 16 * s, 5), { color: C.orange, width: 6, seed: sd, alpha: 0.85 });
    crayonPath([[x - 24 * s, y - 8 * s], [x + 16 * s, y - 8 * s], [x + 28 * s, y], [x + 16 * s, y + 8 * s],
                [x - 24 * s, y + 8 * s], [x - 24 * s, y - 8 * s]], { color: C.redDark, width: 4, seed: sd + 1 });
    crayonPath([[x + 16 * s, y - 8 * s], [x + 16 * s, y + 8 * s]], { color: C.redDark, width: 3, seed: sd + 2 });
    ctx.save(); ctx.fillStyle = C.black;
    ctx.beginPath(); ctx.arc(x - 20 * s, y - 4 * s, 2.6 * s, 0, 7); ctx.fill(); ctx.restore();
  } else if (bug.id === 'pencil-dragonfly') {
    // 몸통이 색연필 (긴 막대 + 뾰족 꼬리) + 날개 4장
    [[-10, -14], [8, -16], [-12, 12], [10, 14]].forEach(([dx, dy], i) => {
      crayonPath(ellipsePts(x + dx * s, y + dy * s * 0.6 - 6 * s, 16 * s, 7 * s),
        { color: C.skyBlue, width: 3, seed: sd + 5 + i, alpha: 0.6 });
    });
    scribbleFill(rectRows(x - 26 * s, y - 4 * s, 44 * s, 8 * s, 4), { color: C.red, width: 5, seed: sd, alpha: 0.85 });
    crayonPath([[x - 26 * s, y - 4 * s], [x + 18 * s, y - 4 * s], [x + 30 * s, y], [x + 18 * s, y + 4 * s],
                [x - 26 * s, y + 4 * s], [x - 26 * s, y - 4 * s]], { color: C.redDark, width: 3.5, seed: sd + 1 });
    // 큰 눈
    ctx.save(); ctx.fillStyle = C.navy;
    ctx.beginPath(); ctx.arc(x - 28 * s, y - 5 * s, 4.5 * s, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x - 28 * s, y + 5 * s, 4.5 * s, 0, 7); ctx.fill(); ctx.restore();
  } else if (bug.id === 'clip-ant') {
    // 클립 세 마디 몸통 + 다리 6개 + 더듬이
    [[-22, 0, 9], [-4, 0, 8], [16, 0, 12]].forEach(([dx, dy, r], i) => {
      scribbleFill(ellipseRows(x + dx * s, y + dy * s, r * s, r * 0.85 * s, 4),
        { color: C.black, width: 4, seed: sd + i, alpha: 0.8 });
      crayonPath(ellipsePts(x + dx * s, y + dy * s, r * s, r * 0.85 * s),
        { color: C.gray, width: 3, seed: sd + 10 + i });
    });
    for (let i = -1; i <= 1; i++) {
      crayonPath([[x + i * 12 * s, y + 5 * s], [x + i * 14 * s - 8 * s, y + 20 * s]],
        { color: C.black, width: 2.4, seed: sd + 20 + i });
      crayonPath([[x + i * 12 * s, y - 5 * s], [x + i * 14 * s - 8 * s, y - 20 * s]],
        { color: C.black, width: 2.4, seed: sd + 25 + i });
    }
    crayonPath([[x - 28 * s, y - 5 * s], [x - 40 * s, y - 18 * s]], { color: C.black, width: 2.4, seed: sd + 30 });
    crayonPath([[x - 28 * s, y - 2 * s], [x - 42 * s, y - 8 * s]], { color: C.black, width: 2.4, seed: sd + 31 });
    ctx.save(); ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x - 26 * s, y - 2 * s, 2 * s, 0, 7); ctx.fill(); ctx.restore();
  } else if (bug.id === 'sticker-butterfly') {
    // 반짝이 스티커 날개 4장 (별·하트 무늬)
    const wings = [[-22, -18, C.purple], [22, -18, C.pink], [-20, 16, C.skyBlue], [20, 16, C.yellow]];
    wings.forEach(([dx, dy, col], i) => {
      scribbleFill(ellipseRows(x + dx * s, y + dy * s, 18 * s, 14 * s, 6),
        { color: col, width: 6, seed: sd + i, alpha: 0.8 });
      crayonPath(ellipsePts(x + dx * s, y + dy * s, 18 * s, 14 * s),
        { color: C.darkBrown, width: 3, seed: sd + 5 + i, alpha: 0.75 });
      // 스티커 별 무늬
      crayonPath([[x + dx * s - 4 * s, y + dy * s], [x + dx * s + 4 * s, y + dy * s]],
        { color: '#fff', width: 3, seed: sd + 12 + i, alpha: 0.9 });
      crayonPath([[x + dx * s, y + dy * s - 4 * s], [x + dx * s, y + dy * s + 4 * s]],
        { color: '#fff', width: 3, seed: sd + 16 + i, alpha: 0.9 });
    });
    // 몸통 + 더듬이
    scribbleFill(ellipseRows(x, y, 5 * s, 22 * s, 5), { color: C.darkBrown, width: 5, seed: sd + 20, alpha: 0.9 });
    crayonPath([[x - 2 * s, y - 20 * s], [x - 10 * s, y - 32 * s]], { color: C.darkBrown, width: 2.4, seed: sd + 21 });
    crayonPath([[x + 2 * s, y - 20 * s], [x + 10 * s, y - 32 * s]], { color: C.darkBrown, width: 2.4, seed: sd + 22 });
  } else if (bug.id === 'paint-bee') {
    // 노랑 물감 몸 + 검정 줄무늬 + 투명 날개 + 침
    crayonPath(ellipsePts(x - 4 * s, y - 16 * s, 18 * s, 9 * s), { color: C.gray, width: 3, seed: sd + 6, alpha: 0.5 });
    crayonPath(ellipsePts(x + 10 * s, y - 17 * s, 16 * s, 8 * s), { color: C.gray, width: 3, seed: sd + 7, alpha: 0.5 });
    scribbleFill(ellipseRows(x, y, 26 * s, 16 * s, 6), { color: C.yellow, width: 6, seed: sd, alpha: 0.9 });
    crayonPath(ellipsePts(x, y, 26 * s, 16 * s), { color: C.darkBrown, width: 4, seed: sd + 1 });
    [-6, 6, 18].forEach((dx, i) => {
      const half = 16 * Math.sqrt(Math.max(0, 1 - (dx / 26) * (dx / 26)));
      crayonPath([[x + dx * s, y - half * s], [x + dx * s, y + half * s]],
        { color: C.black, width: 6, seed: sd + 2 + i, alpha: 0.85 });
    });
    crayonPath([[x + 26 * s, y], [x + 38 * s, y + 4 * s]], { color: C.black, width: 3, seed: sd + 8 });
    ctx.save(); ctx.fillStyle = C.black;
    ctx.beginPath(); ctx.arc(x - 20 * s, y - 3 * s, 2.6 * s, 0, 7); ctx.fill(); ctx.restore();
  } else if (bug.id === 'tape-stag') {
    // 갈색 몸 + 테이프 롤처럼 동그란 집게
    scribbleFill(ellipseRows(x + 4 * s, y, 24 * s, 14 * s, 6), { color: C.darkBrown, width: 6, seed: sd, alpha: 0.8 });
    crayonPath(ellipsePts(x + 4 * s, y, 24 * s, 14 * s), { color: C.black, width: 4, seed: sd + 1 });
    crayonPath([[x + 4 * s, y - 14 * s], [x + 4 * s, y + 14 * s]], { color: C.black, width: 3, seed: sd + 2 });
    // 집게 두 개 (테이프 롤 = 도넛 모양)
    [-1, 1].forEach((sgn, i) => {
      const gx = x - 30 * s, gy = y + sgn * 11 * s;
      crayonPath(ellipsePts(gx, gy, 12 * s, 9 * s), { color: C.orange, width: 4, seed: sd + 3 + i });
      crayonPath(ellipsePts(gx, gy, 5 * s, 4 * s), { color: C.orange, width: 3, seed: sd + 5 + i, alpha: 0.7 });
      crayonPath([[x - 20 * s, y + sgn * 6 * s], [gx + 8 * s, gy]], { color: C.black, width: 3.5, seed: sd + 7 + i });
    });
    for (let i = -1; i <= 1; i++) {
      crayonPath([[x + 4 * s + i * 12 * s, y + 12 * s], [x + i * 14 * s, y + 24 * s]],
        { color: C.black, width: 2.6, seed: sd + 12 + i });
    }
  } else if (bug.id === 'ruler-inchworm') {
    // 노란 자 몸통이 ∩ 모양으로 구부러짐 + 눈금
    const body = [];
    for (let i = 0; i <= 20; i++) {
      const u = i / 20;
      body.push([x - 30 * s + 60 * s * u, y + 12 * s - Math.sin(u * Math.PI) * 28 * s]);
    }
    crayonPath(body, { color: C.yellow, width: 15 * s, seed: sd, alpha: 0.85, continuous: true });
    crayonPath(body, { color: C.brown, width: 3, seed: sd + 1 });
    // 눈금
    for (let i = 2; i <= 18; i += 2) {
      const [bxp, byp] = body[i];
      crayonPath([[bxp, byp - 6 * s], [bxp, byp - 1 * s]], { color: C.darkBrown, width: 2, seed: sd + 2 + i });
    }
    ctx.save(); ctx.fillStyle = C.black;
    ctx.beginPath(); ctx.arc(x + 28 * s, y + 8 * s, 2.6 * s, 0, 7); ctx.fill(); ctx.restore();
  } else if (bug.id === 'tack-spider') {
    // 둥근 몸 + 다리 8개, 다리 끝이 압정(빨간 핀머리)
    for (let i = 0; i < 8; i++) {
      const side = i < 4 ? -1 : 1;
      const k = i % 4;
      const a = side * (0.5 + k * 0.42);
      const lx = x + Math.cos(a) * 40 * s * (side < 0 ? -1 : 1);
      const ly = y + Math.sin(a) * 30 * s;
      crayonPath([[x, y], [x + (lx - x) * 0.6, y + (ly - y) * 0.5 - 10 * s], [lx, ly]],
        { color: C.black, width: 2.8, seed: sd + i });
      scribbleFill(ellipseRows(lx, ly, 4 * s, 4 * s, 3), { color: C.red, width: 3, seed: sd + 20 + i, alpha: 0.9 });
    }
    scribbleFill(ellipseRows(x, y, 20 * s, 17 * s, 6), { color: C.darkBrown, width: 6, seed: sd + 30, alpha: 0.85 });
    crayonPath(ellipsePts(x, y, 20 * s, 17 * s), { color: C.black, width: 4, seed: sd + 31 });
    // 무당 무늬
    scribbleFill(ellipseRows(x - 6 * s, y - 4 * s, 5 * s, 4 * s, 3), { color: C.yellow, width: 3, seed: sd + 32, alpha: 0.9 });
    scribbleFill(ellipseRows(x + 7 * s, y + 3 * s, 5 * s, 4 * s, 3), { color: C.yellow, width: 3, seed: sd + 33, alpha: 0.9 });
    ctx.save(); ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x - 3 * s, y - 10 * s, 2.2 * s, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 5 * s, y - 10 * s, 2.2 * s, 0, 7); ctx.fill(); ctx.restore();
  } else if (bug.id === 'marker-beetle') {
    // 형광 몸통 + 형광펜 촉 모양 큰 뿔
    scribbleFill(ellipseRows(x + 6 * s, y, 28 * s, 19 * s, 6), { color: bug.color, width: 7, seed: sd, alpha: 0.85 });
    crayonPath(ellipsePts(x + 6 * s, y, 28 * s, 19 * s), { color: C.darkGreen, width: 4.5, seed: sd + 1 });
    crayonPath([[x + 6 * s, y - 19 * s], [x + 6 * s, y + 19 * s]], { color: C.darkGreen, width: 3.5, seed: sd + 2 });
    // 뿔 (납작한 형광펜 촉)
    crayonPath([[x - 20 * s, y - 4 * s], [x - 40 * s, y - 16 * s], [x - 52 * s, y - 10 * s],
                [x - 46 * s, y + 2 * s], [x - 24 * s, y + 4 * s]],
      { color: C.yellow, width: 8, seed: sd + 3, alpha: 0.9, continuous: true });
    crayonPath([[x - 20 * s, y - 4 * s], [x - 40 * s, y - 16 * s], [x - 52 * s, y - 10 * s],
                [x - 46 * s, y + 2 * s], [x - 24 * s, y + 4 * s]],
      { color: C.orange, width: 3, seed: sd + 4 });
    for (let i = -1; i <= 1; i++) {
      crayonPath([[x + 6 * s + i * 14 * s, y + 16 * s], [x + 2 * s + i * 17 * s, y + 30 * s]],
        { color: C.darkGreen, width: 3, seed: sd + 8 + i });
    }
  } else if (bug.id === 'star-firefly') {
    // 까만 몸 + 꼬리에 빛나는 야광별!
    scribbleFill(ellipseRows(x - 6 * s, y, 16 * s, 10 * s, 5), { color: C.black, width: 5, seed: sd, alpha: 0.85 });
    crayonPath(ellipsePts(x - 6 * s, y, 16 * s, 10 * s), { color: C.black, width: 3.5, seed: sd + 1 });
    crayonPath(ellipsePts(x - 8 * s, y - 12 * s, 14 * s, 7 * s), { color: C.gray, width: 3, seed: sd + 2, alpha: 0.6 });
    // 야광별 꼬리 (별 모양)
    const star = [];
    for (let i = 0; i <= 10; i++) {
      const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
      const r = (i % 2 === 0 ? 13 : 6) * s;
      star.push([x + 18 * s + Math.cos(a) * r, y + Math.sin(a) * r]);
    }
    scribbleFill(ellipseRows(x + 18 * s, y, 10 * s, 10 * s, 4), { color: C.yellow, width: 5, seed: sd + 3, alpha: 0.95 });
    crayonPath(star, { color: C.orange, width: 3, seed: sd + 4 });
    ctx.save(); ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x - 22 * s, y - 3 * s, 2.4 * s, 0, 7); ctx.fill(); ctx.restore();
  }
}

// 음표 자리 (그릴 때마다 다시 계산 — 창 크기가 바뀌어도 안전)
function noteXY(i, n) {
  const p = SCENE.paper;
  const spacing = Math.min(84, (p.w * 0.5) / Math.max(n - 1, 1));
  const x0 = p.x + p.w / 2 - spacing * (n - 1) / 2;
  return { x: x0 + spacing * i, y: p.y + p.h * 0.24 };
}

function drawNoteIcon(x, y, size, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  // 콩나물 음표: 머리 + 기둥 + 깃발
  scribbleFill(ellipseRows(x, y, size * 0.42, size * 0.32, 4), { color, width: 4, seed: 900 + (x | 0), alpha: 0.95 });
  crayonPath([[x + size * 0.36, y - size * 0.05], [x + size * 0.36, y - size * 1.15]],
    { color, width: 3.5, seed: 901 + (x | 0) });
  crayonPath([[x + size * 0.36, y - size * 1.15], [x + size * 0.85, y - size * 0.85]],
    { color, width: 3.5, seed: 902 + (x | 0) });
  ctx.restore();
}

function drawNotesRow(t) {
  const n = game.noteTimes.length;
  const isCall = game.state === 'call';
  const played = isCall ? game.notesPlayed : (game.anchor ? game.ni : 0);

  for (let i = 0; i < n; i++) {
    const { x, y } = noteXY(i, n);
    // 음표 자리 뒤에 크림색 판을 깐다 — 밤의 숲에선 남색 음표가 밤하늘에 그대로 묻힌다
    // (낚시에서 "원이 물빛에 묻힘"을 고쳤던 것과 같은 방법)
    ctx.save();
    ctx.fillStyle = 'rgba(253,248,236,0.88)';
    ctx.beginPath(); ctx.arc(x, y, 26, 0, 7); ctx.fill();
    ctx.restore();
    // 자리 (빈 동그라미) — 합주에선 음마다 그 곤충 색이라 누구 차례인지 눈으로 보인다
    const bc = noteColor(noteBugAt(i).color);
    crayonPath(ellipsePts(x, y, 24, 24, 24),
      { color: i < played ? bc : C.gray, width: 3.5, seed: 300 + i, alpha: i < played ? 0.95 : 0.45 });
    if (i < played) {
      // 울렸거나 눌렀던 음 → 음표 채움 (막 뜬 음표는 통통 튀어오름)
      const popT = game.notePops[i] || 0;
      const age = t - popT;
      const bounce = age < 260 ? Math.sin((age / 260) * Math.PI) * 10 : 0;
      drawNoteIcon(x - 4, y + 6 - bounce, 22, isCall ? bc : C.navy, 1);
    }
  }

  // 판정 글자
  if (game.lastJudge && t - game.lastJudge.at < 700 && !isCall) {
    const j = game.lastJudge;
    const age = (t - j.at) / 700;
    ctx.save();
    ctx.globalAlpha = 1 - age * age;
    const { x, y } = noteXY(Math.max(0, Math.min(played - 1, n - 1)), n);
    crayonText(j.txt, x, y - 48 - age * 16, 26, j.color);
    ctx.restore();
  }
}

// ---------- 버튼 ----------
// 그린 것 = 누를 수 있는 것. 매 프레임 다시 모으므로 좌표가 어긋날 일이 없다.
let hotspots = [];
function crayonButton(id, x, y, w, h, label, opt = {}) {
  const col = opt.color || C.orange;
  ctx.save();
  ctx.fillStyle = opt.fill || C.cream;
  ctx.globalAlpha = opt.dim ? 0.5 : 1;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill();
  ctx.restore();
  crayonPath([[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]],
    { color: col, width: opt.big ? 6 : 4, seed: opt.seed || (id.length * 37 + (x | 0)), alpha: opt.dim ? 0.5 : 1 });
  // 글자는 버튼 폭에 맞춰 줄인다 (좁은 화면에서 'Field Guide 0/48' 같은 긴 라벨이 삐져나갔다)
  fitText(label, x + w / 2, y + h / 2, w - 14, opt.size || (opt.big ? 28 : 19),
    opt.dim ? C.gray : (opt.textColor || C.darkBrown));
  // noHit: 그리기는 하되 누를 수는 없다 (따라 칠 때 실수로 눌리는 걸 막는다)
  if (!opt.noHit) hotspots.push({ id, x, y, w, h, data: opt.data });
  return { id, x, y, w, h };
}

function hitButton(mx, my) {
  for (let i = hotspots.length - 1; i >= 0; i--) {
    const b = hotspots[i];
    if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) return b;
  }
  return null;
}

// 폭 안에 들어가도록 글자 크기를 줄여서 그린다 (좁은 화면에서 글자가 삐져나가는 걸 막는다)
function fitText(str, x, y, maxW, size, color, align) {
  ctx.save();
  ctx.font = `bold ${size}px 'Comic Sans MS', 'Chalkboard SE', sans-serif`;
  const w = ctx.measureText(str).width;
  ctx.restore();
  if (w > maxW) size = Math.max(9, size * maxW / w);
  crayonText(str, x, y, size, color, align);
  return size;
}

// 풍경 위에 글자를 얹을 때 — 그냥 쓰면 그림에 묻힌다 (낚시에서 배운 것)
function textPlate(txt, x, y, size, color) {
  ctx.save();
  ctx.font = `bold ${size}px 'Comic Sans MS', 'Chalkboard SE', sans-serif`;
  const w = ctx.measureText(txt).width + 24;
  ctx.fillStyle = 'rgba(253,248,236,0.82)';
  ctx.beginPath();
  ctx.roundRect(x - w / 2, y - size * 0.85, w, size * 1.7, 8);
  ctx.fill();
  ctx.restore();
  crayonText(txt, x, y, size, color);
}

// ---------- 연한 색을 글자·음표에 쓸 수 있게 어둡게 ----------
// 음표는 크림색 판 위에 그린다. 별사탕딱정벌레(연분홍)·화이트나방(흰색)처럼 원래 색이
// 밝은 곤충은 그대로 쓰면 판에 묻혀서 안 보인다. 밝기를 재서 기준보다 밝으면 낮춘다.
// RGB에 같은 비율을 곱하므로 색깔(분홍은 분홍)은 그대로 있고 진해지기만 한다.
const NOTE_LUM = 0.55;    // 목표 밝기 (0=검정, 1=흰색)
const noteColorCache = {};
function luminance(r, g, b) { return (0.299 * r + 0.587 * g + 0.114 * b) / 255; }
function noteColor(c) {
  if (noteColorCache[c]) return noteColorCache[c];
  let hex = String(c).replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(ch => ch + ch).join('');
  const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
  if (isNaN(r) || isNaN(g) || isNaN(b)) return c;
  const lum = luminance(r, g, b);
  let out = c;
  if (lum > NOTE_LUM) {
    const k = NOTE_LUM / lum;
    const to2 = v => Math.round(Math.max(0, Math.min(255, v * k))).toString(16).padStart(2, '0');
    out = `#${to2(r)}${to2(g)}${to2(b)}`;
  }
  noteColorCache[c] = out;
  return out;
}

function drawStars(n, x, y, size, filled) {
  for (let i = 0; i < 4; i++) {
    crayonText(i < n ? '★' : '☆', x + i * size * 0.95, y, size, i < n ? (filled || C.orange) : C.gray);
  }
}

// ---------- 시작 메뉴 ----------
function drawMenu(t) {
  ctx.save();
  ctx.fillStyle = 'rgba(60,45,25,0.5)';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  fitText(tr('title'), W / 2, H * 0.15, W - 60, Math.min(54, W * 0.062), C.cream);
  fitText(tr('subtitle'), W / 2, H * 0.15 + 38, W - 80, 16, C.yellow);
  fitText(tr('tagline'), W / 2, H * 0.15 + 62, W - 80, 15, C.cream);

  // 버튼들을 한 덩어리로 잡는다 — 설정을 펼치면 덩어리가 통째로 위로 올라간다.
  // (예전엔 설정 패널만 위로 끌어올려서 메뉴 버튼과 겹쳤다)
  const bw = Math.min(300, W * 0.42), bh = 58;
  const sw = Math.min(150, W * 0.22), sh = 42, gap = 10;
  const noteH = STORAGE_OK ? 0 : 26;
  const setH = game.settingsOpen ? SETTINGS_H + 14 : 0;
  const blockH = bh + 18 + (sh + 10) * 3 + 18 + noteH + setH;
  const top = Math.min(H * 0.32, H - blockH - 16);

  crayonButton('start', W / 2 - bw / 2, top, bw, bh, tr('start'), { big: true, size: 26, color: C.orange });

  // 작은 버튼 세 줄 (한 줄에 몰면 좁은 화면에서 글자가 뭉갠다)
  const totalW = sw * 3 + gap * 2;
  const sx = W / 2 - totalW / 2, sy = top + bh + 18;
  crayonButton('dex', sx, sy, sw, sh, tr('dex', dexDone(), BUGS.length), { size: 15, color: C.green });
  crayonButton('practice', sx + sw + gap, sy, sw, sh, tr('practice'), { size: 15, color: C.skyBlue });
  crayonButton('jam', sx + (sw + gap) * 2, sy, sw, sh, tr('jam'), { size: 15, color: C.orange });

  const sy2 = sy + sh + 10;
  crayonButton('shop', sx, sy2, sw, sh, tr('shop'), { size: 15, color: C.yellow });
  crayonButton('achv', sx + sw + gap, sy2, sw, sh, tr('achv'), { size: 15, color: C.red });
  crayonButton('stats', sx + (sw + gap) * 2, sy2, sw, sh, tr('stats'), { size: 15, color: C.navy });

  const sy3 = sy2 + sh + 10;
  crayonButton('settings', W / 2 - sw / 2, sy3, sw, sh, tr('settings'), { size: 15, color: C.purple });

  crayonText(tr('coins', save.coins), W / 2, sy3 + sh + 16, 15, C.yellow);

  if (!STORAGE_OK) crayonText(tr('noStorage'), W / 2, sy3 + sh + 36, 14, C.yellow);

  if (game.settingsOpen) drawSettings(sx, sy3 + sh + noteH + 26, totalW);
}

const SETTINGS_ROW_H = 40;
const SETTINGS_H = SETTINGS_ROW_H * 4 + 16;   // 언어(한 줄) + 효과음 + 음량 + 꿈틀거림

function drawSettings(x, y, w) {
  const rowH = SETTINGS_ROW_H, h = SETTINGS_H;
  ctx.save();
  ctx.fillStyle = 'rgba(253,248,236,0.95)';
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill();
  ctx.restore();
  crayonPath([[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]],
    { color: C.purple, width: 4, seed: 611 });
  const bx = x + 10, bw = w - 20;
  let row = 0;
  const nextY = () => y + 8 + rowH * row++;
  // 언어는 각 언어를 그 언어로 써 둔다 — 어느 나라 사람이든 자기 것을 알아본다.
  // 한 줄에 나란히 (한 언어에 한 줄씩 쓰면 낮은 창에서 설정이 화면을 넘는다)
  const langY = nextY(), lw = (bw - 8 * (LANGS.length - 1)) / LANGS.length;
  LANGS.forEach((code, i) => {
    crayonButton('set-lang-' + code, bx + i * (lw + 8), langY, lw, rowH - 6,
      (code === LANG ? '✔ ' : '') + LANG_NAMES[code],
      { size: 15, color: code === LANG ? C.orange : C.gray, data: code });
  });
  crayonButton('set-sfx', bx, nextY(), bw, rowH - 6, tr('sfx', tr(SFX ? 'on' : 'off')), { size: 17, color: C.gray });
  crayonButton('set-vol', bx, nextY(), bw, rowH - 6, tr('vol', Math.round(VOLUME * 100)), { size: 17, color: C.gray });
  crayonButton('set-boil', bx, nextY(), bw, rowH - 6, tr('boil', tr(BOIL ? 'on' : 'off')), { size: 17, color: C.gray });
}

// ---------- 도감 ----------
function dexLayout() {
  const p = SCENE.paper;
  const cols = 4, rows = 3;
  const panelW = Math.min(p.w * 0.92, 880);
  // 위엔 제목, 아래엔 닫기 버튼 자리를 먼저 떼어두고 남는 만큼만 패널로 쓴다
  const top = p.y + 104;         // 스프링 · 제목 · 지역 탭 자리를 비워둔다
  const bottom = p.y + p.h - 66;
  const panelH = Math.max(180, Math.min(bottom - top, 540));
  return {
    cols, rows, panelW, panelH,
    px: W / 2 - panelW / 2,
    py: top,
    cw: panelW / cols,
    ch: panelH / rows,
  };
}

const DEX_PER_PAGE = 12;
function dexList() { return spotBugs(game.dexTab); }             // 지금 탭의 곤충들
function dexPages() { return Math.max(1, Math.ceil(dexList().length / DEX_PER_PAGE)); }

function drawDex(t) {
  const p = SCENE.paper;
  ctx.save();
  ctx.fillStyle = 'rgba(60,45,25,0.45)';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  const L = dexLayout();
  ctx.save();
  ctx.fillStyle = 'rgba(253,248,236,0.97)';
  ctx.beginPath(); ctx.roundRect(L.px - 14, L.py - 14, L.panelW + 28, L.panelH + 28, 14); ctx.fill();
  ctx.restore();

  const list = dexList();
  const pages = dexPages();
  game.dexPage = Math.max(0, Math.min(pages - 1, game.dexPage));
  const done = list.filter(b => caughtCount(b.id) > 0).length;
  const title = pages > 1
    ? tr('dexTitleP', done, list.length, game.dexPage + 1, pages)
    : tr('dexTitle', done, list.length);
  crayonText(title, W / 2, p.y + 34, 23, C.cream);

  // 지역 탭 (낮 풀밭 / 밤의 숲)
  const tabW = Math.min(170, L.panelW * 0.28), tabH = 32;
  const tabs = ['meadow', 'night'];
  const tabX0 = W / 2 - (tabW * tabs.length + 10) / 2;
  tabs.forEach((sp, i) => {
    const on = game.dexTab === sp;
    crayonButton('dex-tab', tabX0 + i * (tabW + 10), p.y + 56, tabW, tabH,
      tr(sp === 'night' ? 'spotNight' : 'spotMeadow'),
      { size: 15, color: on ? (sp === 'night' ? C.navy : C.green) : C.gray, dim: !on, data: sp });
  });

  const from = game.dexPage * DEX_PER_PAGE;
  const to = Math.min(from + DEX_PER_PAGE, list.length);
  for (let i = from; i < to; i++) {
    const b = list[i];
    const k = i - from;
    const cx = L.px + (k % L.cols) * L.cw;
    const cy = L.py + Math.floor(k / L.cols) * L.ch;
    const got = caughtCount(b.id) > 0;
    const pad = 6;
    crayonPath([[cx + pad, cy + pad], [cx + L.cw - pad, cy + pad],
                [cx + L.cw - pad, cy + L.ch - pad], [cx + pad, cy + L.ch - pad], [cx + pad, cy + pad]],
      { color: got ? (b.rare ? C.yellow : C.orange) : C.gray, width: got ? 4 : 3, seed: 700 + i, alpha: got ? 1 : 0.5 });

    if (got) {
      const scale = Math.min(L.cw, L.ch) / 130;
      drawBug(b, cx + L.cw / 2, cy + L.ch * 0.4, Math.max(0.5, Math.min(0.95, scale)));
      crayonText(bugName(b), cx + L.cw / 2, cy + L.ch * 0.74, Math.min(15, L.cw * 0.115), C.darkBrown);
      crayonText(`×${caughtCount(b.id)}`, cx + L.cw / 2, cy + L.ch * 0.88, 14, C.gray);
      drawStars(rarityOf(b).stars, cx + pad + 10, cy + pad + 14, 12, b.rare ? C.yellow : C.orange);
    } else {
      crayonText('?', cx + L.cw / 2, cy + L.ch * 0.42, 44, C.gray);
      crayonText(tr('unknown'), cx + L.cw / 2, cy + L.ch * 0.74, 15, C.gray);
    }
    hotspots.push({ id: 'dex-cell', x: cx, y: cy, w: L.cw, h: L.ch, data: b });
  }

  const navY = L.py + L.panelH + 20;
  crayonButton('dex-close', W / 2 - 70, navY, 140, 40, tr('close'), { color: C.brown });
  if (pages > 1) {
    const first = game.dexPage === 0, last = game.dexPage === pages - 1;
    crayonButton('dex-prev', W / 2 - 152, navY, 68, 40, '◀',
      { size: 20, color: C.gray, dim: first, noHit: first });
    crayonButton('dex-next', W / 2 + 84, navY, 68, 40, '▶',
      { size: 20, color: C.gray, dim: last, noHit: last });
  }

  if (game.dexCard) drawDexCard(game.dexCard, t);
}

function drawDexCard(b, t) {
  // 카드가 떠 있는 동안엔 뒤쪽(도감 칸·닫기) 버튼을 전부 끈다.
  // 안 그러면 카드 위를 눌렀는데 뒤 칸이 반응해서 다른 곤충 카드로 바뀐다.
  hotspots = [];
  // 위에서 아래로 고정 간격으로 쌓는다 (비율로 잡았더니 글자와 버튼이 겹쳤다)
  const cw = Math.min(480, W * 0.86), ch = Math.min(428, H * 0.88);
  const cx = W / 2 - cw / 2, cy = H / 2 - ch / 2;
  ctx.save();
  ctx.fillStyle = 'rgba(60,45,25,0.5)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = C.cream;
  ctx.beginPath(); ctx.roundRect(cx, cy, cw, ch, 16); ctx.fill();
  ctx.restore();
  crayonPath([[cx, cy], [cx + cw, cy], [cx + cw, cy + ch], [cx, cy + ch], [cx, cy]],
    { color: b.rare ? C.yellow : C.orange, width: 6, seed: 800 });

  let y = cy + 62;
  drawBug(b, W / 2, y, 1.3);
  y += 62;
  crayonText(bugName(b), W / 2, y, 26, C.darkBrown);
  const r = rarityOf(b);
  y += 32;
  drawStars(r.stars, W / 2 - 34, y, 17, b.rare ? C.yellow : C.orange);
  y += 28;
  crayonText(`${tr(r.key)} · ${tr('caughtN', caughtCount(b.id))}`, W / 2, y, 15, C.gray);

  // 이 곤충의 박자 — 음표 줄로 보여준다 (복습용)
  y += 42;
  const times = noteTimesFor(b);
  const span = times[times.length - 1] || 1;
  const rowW = cw * 0.6, rowX = W / 2 - rowW / 2;
  crayonPath([[rowX - 16, y], [rowX + rowW + 16, y]], { color: C.gray, width: 2.5, seed: 810, alpha: 0.5 });
  for (let i = 0; i < times.length; i++) {
    drawNoteIcon(rowX + (times[i] / span) * rowW - 4, y, 18, noteColor(b.color), 1);
  }
  y += 34;
  crayonText(LX(b.cry), W / 2, y, 16, C.darkBrown);

  y += 20;
  crayonButton('card-cry', W / 2 - 70, y, 140, 38, tr('hearCry'), { size: 16, color: C.green });

  y += 62;
  ctx.save();
  ctx.font = `14px 'Comic Sans MS', 'Chalkboard SE', sans-serif`;
  ctx.fillStyle = '#6b5a42';
  ctx.textAlign = 'center';
  wrapText(LX(b.gag), W / 2, y, cw - 50, 18);
  ctx.restore();
}

// topExtra: 제목 아래에 탭 같은 걸 놓을 자리를 더 비워둘 때
function panelBox(hRatio, topExtra) {
  const p = SCENE.paper;
  const w = Math.min(p.w * 0.9, 820);
  const top = p.y + 74 + (topExtra || 0), bottom = p.y + p.h - 66;

function drawShop(t) {
  const p = SCENE.paper;
  ctx.save();

  // 탭 (장비 / 꾸미기) — 항목이 늘어서 한 화면에 다 못 넣는다

  });

  // ---- 채집망 4종 (순서대로만 살 수 있다) ----
  let y = B.y + 12;

  y += 22;

  NETS.forEach((n, i) => {
    const x = B.x + i * (cw + 12);
    const have = save.nets.includes(n.id);
    const on = save.net === n.id;
    const prevHave = i === 0 || save.nets.includes(NETS[i - 1].id);
    const canBuy = !have && prevHave && save.coins >= n.price;
    crayonButton('shop-net', x, y, cw, chh, '',
      { color: on ? C.orange : (have ? C.green : C.gray), dim: !have && !canBuy,
        noHit: !have && !prevHave, data: n });
    drawNetIcon(x + cw / 2, y + 30, Math.min(1, cw / 130), n);
    crayonText(LANG === 'ko' ? n.ko : n.en, x + cw / 2, y + 66, Math.min(14, cw * 0.13), C.darkBrown);
    const label = on ? tr('equipped') : have ? tr('wearIt') : (prevHave ? tr('buy', n.price) : tr('locked'));
    crayonText(label, x + cw / 2, y + 88, 13, on ? C.redDark : (have ? C.darkGreen : (canBuy ? C.orange : C.gray)));
  });

  // ---- 꿀단지 3종 ----
  y += chh + 26;
  crayonText(tr('shopJars'), B.x + 12, y, 15, C.darkBrown, 'left');
  y += 22;
  const jw = (B.w - 12 * 2) / 3, jh = 104;
  JARS.forEach((j, i) => {
    const x = B.x + i * (jw + 12);
    const on = curJar().id === j.id;
    const n = jarCount(j.id);
    crayonButton('shop-jar', x, y, jw, jh, '',
      { color: on ? C.orange : C.gray, data: j });
    drawJarIcon(x + jw / 2, y + 30, Math.min(1, jw / 150), j);
    crayonText(LANG === 'ko' ? j.ko : j.en, x + jw / 2, y + 64, Math.min(14, jw * 0.11), C.darkBrown);
    const have = j.free ? '∞' : tr('jarLeft', n);
    crayonText(j.free ? have : `${have}   ${tr('buy', j.price)}`, x + jw / 2, y + 86, 13,
      on ? C.redDark : C.gray);
  });

  crayonButton('shop-close', W / 2 - 70, B.y + B.h + 20, 140, 40, tr('close'), { color: C.brown });

function drawShopStyle(B) {
  let y = B.y + 12;

    const canBuy = !have && save.coins >= h.price;
    crayonButton('shop-hat', x, y, cw, chh, '',
      { color: on ? C.orange : (have ? C.green : C.gray), dim: !have && !canBuy, data: h });

    crayonText(on ? tr('equipped') : have ? tr('wearIt') : tr('buy', h.price),

  });

  y += chh + 26;
  crayonText(tr('shopSkins'), B.x + 12, y, 15, C.darkBrown, 'left');
  y += 22;
  const sh2 = 96;
  NET_SKINS.forEach((sk, i) => {
    const x = B.x + i * (cw + 12);
    const have = save.netSkins.includes(sk.id);
    const on = save.netSkin === sk.id;
    const canBuy = !have && save.coins >= sk.price;
    crayonButton('shop-skin', x, y, cw, sh2, '',
      { color: on ? C.orange : (have ? C.green : C.gray), dim: !have && !canBuy, data: sk });
    // 색 미리보기: 작은 채집망
    const px = x + cw / 2, py = y + 30;
    crayonPath([[px - 16, py + 16], [px + 4, py - 6]], { color: sk.pole, width: 5, seed: 740 + i });
    if (sk.rainbow) {
      [C.red, C.yellow, C.green, C.skyBlue].forEach((c, k) => {
        const a0 = k * Math.PI / 2, a1 = a0 + Math.PI / 2;
        const seg = [];
        for (let q = 0; q <= 6; q++) {
          const a = a0 + (a1 - a0) * (q / 6);
          seg.push([px + 12 + Math.cos(a) * 14, py - 12 + Math.sin(a) * 11]);
        }
        crayonPath(seg, { color: c, width: 3.5, seed: 750 + i * 4 + k });
      });
    } else {
      crayonPath(ellipsePts(px + 12, py - 12, 14, 11), { color: sk.hoop, width: 3.5, seed: 745 + i });
    }
    fitText(LANG === 'ko' ? sk.ko : sk.en, px, y + 60, cw - 10, 14, C.darkBrown);
    crayonText(on ? tr('equipped') : have ? tr('wearIt') : tr('buy', sk.price),
      px, y + 80, 13, on ? C.redDark : (have ? C.darkGreen : (canBuy ? C.orange : C.gray)));
  });

  crayonButton('shop-close', W / 2 - 70, B.y + B.h + 20, 140, 40, tr('close'), { color: C.brown });
}

function drawNetIcon(x, y, s, n) {
  const col = { stick: C.brown, bamboo: '#c8a860', silk: '#e8dcc8', golden: C.yellow }[n.id] || C.brown;
  crayonPath([[x - 16 * s, y + 18 * s], [x + 6 * s, y - 6 * s]], { color: col, width: 5 * s, seed: 700 });
  crayonPath(ellipsePts(x + 14 * s, y - 14 * s, 15 * s, 12 * s), { color: C.gray, width: 3.5 * s, seed: 701 });
  for (let i = -1; i <= 1; i++) {
    crayonPath([[x + 14 * s + i * 7 * s, y - 25 * s], [x + 14 * s + i * 7 * s, y - 3 * s]],
      { color: C.gray, width: 1.4 * s, seed: 702 + i, alpha: 0.5 });
  }
}

function drawJarIcon(x, y, s, j) {
  if (j.free) { crayonText('—', x, y, 26 * s, C.gray); return; }
  const col = j.id === 'glow' ? '#b6ff6e' : C.orange;
  scribbleFill(ellipseRows(x, y, 14 * s, 16 * s, 5), { color: col, width: 5 * s, seed: 710, alpha: 0.85 });
  crayonPath(ellipsePts(x, y, 14 * s, 16 * s), { color: C.brown, width: 3.5 * s, seed: 711 });
  crayonPath([[x - 10 * s, y - 16 * s], [x + 10 * s, y - 16 * s]], { color: C.darkBrown, width: 5 * s, seed: 712 });
}

      done ? C.darkBrown : C.gray, 'left');

    crayonText(done ? tr('achvGot') : `${Math.min(cur, goal)} / ${goal}`,

function drawStats(t) {
  const p = SCENE.paper;
  ctx.save();
  ctx.fillStyle = 'rgba(60,45,25,0.45)';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  const B = panelBox(400);
  ctx.save();
  ctx.fillStyle = 'rgba(253,248,236,0.97)';
  ctx.beginPath(); ctx.roundRect(B.x - 14, B.y - 14, B.w + 28, B.h + 28, 14); ctx.fill();
  ctx.restore();

  crayonText(tr('stats'), W / 2, p.y + 36, 24, C.cream);

  const caught = totalCaught();
  const tries = caught + save.missed;
  const rate = tries ? Math.round(caught / tries * 100) : 0;
  const rows = [
    [tr('stCaught'), `${caught}`],
    [tr('stMissed'), `${save.missed}`],
    [tr('stRate'), `${rate}%`],
    [tr('stPerfect'), `${save.perfect}`],
    [tr('stDex'), `${dexDone()} / ${BUGS.length}`],
    [tr('stAchv'), `${save.achieved.length} / ${ACHV.length}`],
    [tr('stCoins'), `${save.coins}`],
    [tr('stEarned'), `${save.coinEarned}`],
    [tr('stJam'), save.jamBest ? tr('jamNotes', save.jamBest) : '—'],
  ];

  // 왼쪽: 숫자들 / 오른쪽: 제일 많이 잡은 곤충 TOP 5 (가운데 크레파스 세로선으로 구분)
  const midX = B.x + B.w * 0.46;
  crayonPath([[midX, B.y + 8], [midX, B.y + B.h - 8]], { color: C.gray, width: 3, seed: 770, alpha: 0.45 });

  const rowH = Math.min(30, (B.h - 20) / rows.length);
  rows.forEach(([k, v], i) => {
    const y = B.y + 18 + i * rowH;
    fitText(k, B.x + 14, y, B.w * 0.28, Math.min(15, rowH * 0.55), C.darkBrown, 'left');
    ctx.save(); ctx.textAlign = 'right'; ctx.restore();
    crayonText(v, midX - 16, y, Math.min(16, rowH * 0.6), C.navy, 'right');
  });

  // TOP 5
  crayonText(tr('stTop'), midX + (B.x + B.w - midX) / 2, B.y + 18, 15, C.darkBrown);
  const top = BUGS.filter(b => caughtCount(b.id) > 0)
                  .sort((a, b) => caughtCount(b.id) - caughtCount(a.id))
                  .slice(0, 5);
  if (!top.length) {
    fitText(tr('stNone'), midX + (B.x + B.w - midX) / 2, B.y + B.h / 2, B.w * 0.5, 15, C.gray);
  } else {
    const th = Math.min(56, (B.h - 50) / 5);
    top.forEach((b, i) => {
      const y = B.y + 44 + i * th;
      const cx = midX + 40;
      drawBug(b, cx, y + th * 0.45, Math.min(0.5, th / 110));
      fitText(`${i + 1}. ${bugName(b)}`, cx + 34, y + th * 0.45, B.w * 0.34, Math.min(14, th * 0.34),
        C.darkBrown, 'left');
      crayonText(`×${caughtCount(b.id)}`, B.x + B.w - 12, y + th * 0.45, Math.min(14, th * 0.34),
        C.orange, 'right');
    });
  }

  crayonButton('stats-close', W / 2 - 70, B.y + B.h + 20, 140, 40, tr('close'), { color: C.brown });
}
