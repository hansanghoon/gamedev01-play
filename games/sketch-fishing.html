<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">

<title>스케치북 낚시 · Sketching Fish</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #7a6a55;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; touch-action: manipulation; }
  /* 시작 메뉴 (책상 위 작은 스케치북이 뒤에 보임) */
  #menu {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center;

  #menu h1 {

  }

  /* 도감·상점·도전과제는 작은 가로 한 줄로 */
  #menu .row { display: flex; gap: 10px; }
  #menu .row button { font-size: 16px; padding: 9px 22px; border-radius: 16px; }
  /* 설정(언어·효과음·꿈틀)은 ⚙ 버튼을 눌러야 펼쳐짐 */
  #menu .row.settings { display: none; flex-wrap: wrap; justify-content: center; max-width: 620px; }
  #menu .row.settings.open { display: flex; }
  #menu .row.settings button { font-size: 13px; padding: 7px 14px; color: #9c8a6a; }
  #menu #btn-settings {
    font-size: 14px; padding: 7px 20px; border-radius: 14px;
    background: #f4ead2; border-width: 2.5px; box-shadow: 0 3px 0 #5c4326;

  #menu button {

  #menu button:hover { transform: translateY(-2px) rotate(-1deg); }
  #menu button:active { transform: translateY(2px); box-shadow: 0 1px 0 #5c4326; }
  #menu #btn-start { font-size: 26px; padding: 14px 64px; background: #ffd23f; }
  /* 폰 세로: 가로로 돌려달라는 안내 */
  #rotate {

    font-weight: 800; font-size: 24px; line-height: 1.6;
  }
</style>

<body>
<canvas id="c"></canvas>
<div id="rotate"><div>📱↻<br><span id="rotate-msg">폰을 가로로 돌려줘!</span></div></div>
<div id="menu">
  <div style="text-align:center">
    <h1 id="m-title">스케치북 낚시</h1>
    <p class="sub" id="m-sub">Sketching Fish</p>
  </div>
  <div class="btns">

    <div class="row">

    <div class="row settings" id="settings-row">
      <button id="btn-lang">언어 · Language: 한국어</button>
      <button id="btn-sfx">효과음: 켬</button>
      <button id="btn-bgm">음악: 켬</button>
      <button id="btn-vol">음량: 100%</button>
      <button id="btn-boil">꿈틀거림: 켬</button>
      <button id="btn-backup">백업 저장</button>
      <button id="btn-load">백업 불러오기</button>
      <button id="btn-reset">처음부터 (초기화)</button>
      <input type="file" id="file-load" accept=".json" style="display:none">
    </div>
  </div>
</div>
<script>
// ============================================================
// 스케치북 낚시 (가제) — 그림체 테스트 버전
// 컨셉: 스프링 스케치북 위에 어린아이가 크레파스로 그린 호수
// 핵심 기법:
//  - crayonPath(): 선을 꼬불꼬불하게 + 크레파스처럼 거칠게 그림
//  - scribbleFill(): 색칠을 지그재그로 슥슥, 선 밖으로 살짝 삐져나오게
//  - 라인 보일(line boil): 0.2초마다 살짝 다르게 다시 그려서
//    손그림이 살아 움직이는 느낌
// ============================================================

const canvas = document.getElementById('c');
const screenCtx = canvas.getContext('2d');
// 배경(스케치북+풍경)은 무거워서 미리 딴 캔버스에 그려두고(캐시),
// 매 프레임엔 그 그림을 복사한 뒤 움직이는 것만 새로 그린다
const sceneCanvas = document.createElement('canvas');
const sctx = sceneCanvas.getContext('2d');
let ctx = screenCtx;  // 그리기 함수들이 쓰는 붓 — 캐시를 만들 땐 sctx로 바꿔 낀다
let W = 0, H = 0, DPR = 1;

// 장면의 중요 위치들 (그릴 때 채워짐 — 낚싯대 끝, 찌 위치, 호수 범위)
const SCENE = {};

// ---------- 시드 랜덤 (같은 시드면 항상 같은 꼬불거림) ----------
function mulberry32(a) {
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 라인 보일용: 그릴 때마다 바뀌는 시드 오프셋 (0,1,2 반복)
let boilSeed = 0;

// ---------- 크레파스 팔레트 ----------
const C = {
  paper:     '#fdf8ec',
  desk:      '#7a6a55',
  skyBlue:   '#7cc4e8',
  deepBlue:  '#3f7fc2',
  navy:      '#2c5d94',
  green:     '#6fb04c',
  darkGreen: '#42813a',
  yellow:    '#ffd23f',
  orange:    '#ff9633',
  brown:     '#a9713a',
  darkBrown: '#7c4f26',
  gray:      '#9aa0a8',
  cloud:     '#aeb8c4',
  red:       '#ff5f4c',
  redDark:   '#d24638',
  pink:      '#ff8fb1',
  skin:      '#ffcf9e',
};

// ---------- 경로 도우미 ----------

// 점 목록을 일정한 간격(step px)으로 다시 샘플링
function resample(pts, step) {
  const out = [pts[0].slice()];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    let [px, py] = out[out.length - 1] ? pts[i - 1] : pts[i - 1];
    let ax = pts[i - 1][0], ay = pts[i - 1][1];
    const bx = pts[i][0], by = pts[i][1];
    let dx = bx - ax, dy = by - ay;
    let len = Math.hypot(dx, dy);
    if (len === 0) continue;
    let t = step - acc;
    while (t <= len) {
      out.push([ax + dx * (t / len), ay + dy * (t / len)]);
      t += step;
    }
    acc = len - (t - step);
  }
  out.push(pts[pts.length - 1].slice());
  return out;
}

// 원(또는 타원) 점 목록 만들기
function ellipsePts(cx, cy, rx, ry, n = 44) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2;
    pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
  }
  return pts;
}

// ---------- 크레파스 선 그리기 ----------
// 꼬불꼬불(저주파 웨이브) + 손떨림(고주파 지터) + 거친 질감(투명도·굵기 변화)
function crayonPath(pts, opt) {
  const {
    color, width = 5, seed = 1, alpha = 0.9,
    wobble = 3, step = 7, passes = 2,
  } = opt;
  const rand = mulberry32((seed * 7919 + boilSeed * 104729) >>> 0);
  const rs = resample(pts, step);
  if (rs.length < 2) return;

  // 점마다 진행 방향의 수직 방향으로 꼬불꼬불 오프셋
  const p1 = rand() * 6.28, p2 = rand() * 6.28;
  const jittered = rs.map((p, i) => {
    const prev = rs[Math.max(0, i - 1)], next = rs[Math.min(rs.length - 1, i + 1)];
    let nx = -(next[1] - prev[1]), ny = next[0] - prev[0];
    const nl = Math.hypot(nx, ny) || 1;
    nx /= nl; ny /= nl;
    const off = Math.sin(i * 0.33 + p1) * wobble * 0.7
              + Math.sin(i * 0.11 + p2) * wobble
              + (rand() - 0.5) * 1.6;
    return [p[0] + nx * off, p[1] + ny * off];
  });

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (opt.continuous) {
    // 색칠용: 끊김 없이 한 번에 슥슥 (크레파스로 문지른 느낌)
    for (let pass = 0; pass < passes; pass++) {
      const ox = (rand() - 0.5) * 3, oy = (rand() - 0.5) * 3;
      ctx.globalAlpha = alpha * (0.7 + rand() * 0.3) / passes * 1.3;
      ctx.lineWidth = width * (0.85 + rand() * 0.3);
      ctx.beginPath();
      ctx.moveTo(jittered[0][0] + ox, jittered[0][1] + oy);
      for (let i = 1; i < jittered.length; i++) {
        ctx.lineTo(jittered[i][0] + ox, jittered[i][1] + oy);
      }
      ctx.stroke();
    }
  } else {
    for (let pass = 0; pass < passes; pass++) {
      const ox = (rand() - 0.5) * 2.2, oy = (rand() - 0.5) * 2.2;
      for (let i = 1; i < jittered.length; i++) {
        ctx.globalAlpha = alpha * (0.45 + rand() * 0.55) / passes * 1.6;
        ctx.lineWidth = width * (0.7 + rand() * 0.6);
        ctx.beginPath();
        ctx.moveTo(jittered[i - 1][0] + ox, jittered[i - 1][1] + oy);
        ctx.lineTo(jittered[i][0] + ox, jittered[i][1] + oy);
        ctx.stroke();
      }
    }
  }
  ctx.restore();
}

// ---------- 크레파스 색칠 (지그재그로 슥슥) ----------
// rows: [{y, x1, x2}] 목록 — 선 밖으로 overshoot만큼 삐져나가기도 함
function scribbleFill(rows, opt) {
  const { color, width = 6, seed = 1, alpha = 0.5, overshoot = 8 } = opt;
  const rand = mulberry32((seed * 6271 + 17) >>> 0);
  const zig = [];
  let dir = 1;
  for (const r of rows) {
    const o1 = (rand() - 0.3) * overshoot;
    const o2 = (rand() - 0.3) * overshoot;
    const a = [r.x1 - o1, r.y + (rand() - 0.5) * 3];
    const b = [r.x2 + o2, r.y + (rand() - 0.5) * 3];
    if (dir > 0) zig.push(a, b); else zig.push(b, a);
    dir *= -1;
  }
  if (zig.length < 2) return;
  crayonPath(zig, { color, width, seed: seed + 3, alpha, wobble: 2, step: 12,
                    passes: 2, continuous: true });
}

// 타원 모양 영역의 색칠 rows 만들기
function ellipseRows(cx, cy, rx, ry, gap) {
  const rows = [];
  for (let y = cy - ry + gap * 0.6; y < cy + ry; y += gap) {
    const t = (y - cy) / ry;
    const half = rx * Math.sqrt(Math.max(0, 1 - t * t));
    if (half > 4) rows.push({ y, x1: cx - half, x2: cx + half });
  }
  return rows;
}

// ============================================================
// 장면 그리기
// ============================================================

// ---------- 스케치북 (책상 + 종이 + 스프링) ----------
const SPIRAL_H = 46;  // 스프링이 차지하는 위쪽 영역

function drawSketchbook() {
  // 책상
  ctx.fillStyle = C.desk;
  ctx.fillRect(0, 0, W, H);

  // 종이 (위쪽은 스프링에 걸려 있음)
  const m = Math.min(W, H) * 0.015;  // 책상이 살짝 보이는 여백
  const px = m, py = SPIRAL_H * 0.55, pw = W - m * 2, ph = H - py - m;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.35)';
  ctx.shadowBlur = 14;
  ctx.shadowOffsetY = 5;
  ctx.fillStyle = C.paper;
  ctx.beginPath();
  ctx.roundRect(px, py, pw, ph, 6);
  ctx.fill();
  ctx.restore();

  // 종이 질감 (고운 점들 — 보일 없이 고정)
  const rand = mulberry32(20260724);
  ctx.save();
  for (let i = 0; i < 900; i++) {
    const x = px + rand() * pw, y = py + rand() * ph;
    ctx.globalAlpha = 0.025 + rand() * 0.03;
    ctx.fillStyle = rand() > 0.5 ? '#b9a98c' : '#ffffff';
    ctx.fillRect(x, y, 1.6, 1.6);
  }
  ctx.restore();

  return { px, py, pw, ph };
}

function drawSpiral() {
  // 스프링 제본: 구멍 + 은색 고리
  const gap = 44;
  const n = Math.floor(W / gap);
  const startX = (W - (n - 1) * gap) / 2;
  for (let i = 0; i < n; i++) {
    const x = startX + i * gap;
    // 종이에 뚫린 구멍
    ctx.fillStyle = 'rgba(60,50,38,0.85)';
    ctx.beginPath();
    ctx.ellipse(x, SPIRAL_H * 0.72, 5.5, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    // 은색 고리 (구멍을 통과해 위로)
    ctx.strokeStyle = '#c7ccd4';
    ctx.lineWidth = 4.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.ellipse(x, SPIRAL_H * 0.48, 7.5, SPIRAL_H * 0.42, 0.18, Math.PI * 0.15, Math.PI * 1.6);
    ctx.stroke();
    // 고리 음영
    ctx.strokeStyle = '#8d939c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(x + 1, SPIRAL_H * 0.48, 7.5, SPIRAL_H * 0.42, 0.18, Math.PI * 0.55, Math.PI * 1.45);
    ctx.stroke();
  }
}

// ---------- 호수 풍경 (전부 크레파스) ----------
function drawScene(p) {
  const { px, py, pw, ph } = p;
  // 장면 좌표: 종이 안쪽에 여백을 두고 그림
  const sx = px + pw * 0.06, sy = py + ph * 0.10;
  const sw = pw * 0.88, sh = ph * 0.84;
  const X = t => sx + sw * t;
  const Y = t => sy + sh * t;

  // --- 해 (왼쪽 위) ---
  const sunX = X(0.1), sunY = Y(0.13), sunR = Math.min(sw, sh) * 0.075;
  scribbleFill(ellipseRows(sunX, sunY, sunR * 0.85, sunR * 0.85, 7),
    { color: C.yellow, seed: 11, alpha: 0.65, width: 7 });
  crayonPath(ellipsePts(sunX, sunY, sunR, sunR),
    { color: C.orange, width: 5, seed: 12, wobble: 3 });
  // 햇살 (삐죽삐죽)
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2 + 0.3;
    const r1 = sunR * 1.25, r2 = sunR * (1.6 + (i % 3) * 0.14);
    crayonPath([
      [sunX + Math.cos(a) * r1, sunY + Math.sin(a) * r1],
      [sunX + Math.cos(a) * r2, sunY + Math.sin(a) * r2],
    ], { color: C.orange, width: 4.5, seed: 20 + i, wobble: 1.5 });
  }

  // --- 구름 두 개 (작게, 하늘 위쪽에) ---
  drawCloud(X(0.46), Y(0.07), sw * 0.05, 31);
  drawCloud(X(0.74), Y(0.14), sw * 0.04, 41);

  // --- 뒤쪽 언덕 (수평선 위 봉긋한 동산 두 개) ---
  const horizon = Y(0.42);
  drawHill(X(0.17), horizon, sw * 0.19, sh * 0.11, 51);
  drawHill(X(0.66), horizon, sw * 0.22, sh * 0.15, 55);

  // --- 호수 크기 먼저 정해두기 (땅 색칠할 때 피해 가야 하니까) ---
  const lakeCx = X(0.55), lakeCy = Y(0.72);
  const lakeRx = sw * 0.38, lakeRy = sh * 0.23;
  SCENE.lake = { cx: lakeCx, cy: lakeCy, rx: lakeRx, ry: lakeRy };
  SCENE.top = sy;

  // --- 땅 (수평선부터 아래로 연둣빛, 호수 자리는 비워둠) ---
  const horizonLine = [];
  for (let i = 0; i <= 20; i++) horizonLine.push([X(i / 20), horizon]);
  crayonPath(horizonLine, { color: C.darkGreen, width: 4.5, seed: 58, wobble: 2.5 });

  const skipRx = lakeRx * 1.08, skipRy = lakeRy * 1.14;
  const above = [], left = [], right = [], below = [];
  for (let y = horizon + 9; y < Y(1.0); y += 13) {
    const t = (y - lakeCy) / skipRy;
    if (Math.abs(t) >= 1) {
      (y < lakeCy ? above : below).push({ y, x1: X(0.01), x2: X(0.99) });
    } else {
      const half = skipRx * Math.sqrt(1 - t * t);
      if (lakeCx - half - X(0.01) > 14) left.push({ y, x1: X(0.01), x2: lakeCx - half });
      if (X(0.99) - (lakeCx + half) > 14) right.push({ y, x1: lakeCx + half, x2: X(0.99) });
    }
  }
  const groundOpt = { color: C.green, alpha: 0.33, width: 7, overshoot: 4 };
  scribbleFill(above, { ...groundOpt, seed: 61 });
  scribbleFill(left,  { ...groundOpt, seed: 62 });
  scribbleFill(right, { ...groundOpt, seed: 63 });
  scribbleFill(below, { ...groundOpt, seed: 64 });

  // --- 나무들 (언덕 사이·옆 빈자리, 수평선 위에 서 있게) ---
  drawTree(X(0.43), horizon + 3, sh * 0.11, 71);
  drawTree(X(0.93), horizon + 4, sh * 0.09, 81);
  scribbleFill(ellipseRows(lakeCx, lakeCy, lakeRx * 0.96, lakeRy * 0.94, 11),
    { color: C.skyBlue, seed: 91, alpha: 0.5, width: 8, overshoot: 10 });
  crayonPath(ellipsePts(lakeCx, lakeCy, lakeRx, lakeRy, 60),
    { color: C.deepBlue, width: 5.5, seed: 92, wobble: 4 });

  // 물결 (호수 안 잔잔한 곡선들)
  const rippleSpots = [
    [0.35, 0.62], [0.62, 0.58], [0.5, 0.75], [0.3, 0.8], [0.72, 0.78],
  ];
  rippleSpots.forEach(([tx, ty], i) => {
    const rx = X(tx), ry = Y(ty), len = sw * 0.07;
    const wave = [];
    for (let k = 0; k <= 10; k++) {
      wave.push([rx - len / 2 + (len * k) / 10, ry + Math.sin(k * 1.1) * 3]);
    }
    crayonPath(wave, { color: C.navy, width: 4, seed: 100 + i, wobble: 1.5, alpha: 0.7 });
  });

  // --- 앞쪽 풀밭 (호수 아래) ---
  const grassY = Y(0.97);
  for (let i = 0; i < 14; i++) {
    const gx = X(0.03 + (i / 13) * 0.94);
    const gy = grassY - Math.abs(Math.sin(i * 2.7)) * 6;
    const gh = sh * (0.035 + (i % 3) * 0.012);
    crayonPath([[gx - 4, gy], [gx - 1, gy - gh]],
      { color: C.darkGreen, width: 4, seed: 130 + i, wobble: 1 });
    crayonPath([[gx + 4, gy], [gx + 2, gy - gh * 0.8]],
      { color: C.green, width: 4, seed: 150 + i, wobble: 1 });
  }
  // 꽃 두어 송이
  drawFlower(X(0.09), grassY - 10, 8, C.red, 171);
  drawFlower(X(0.87), grassY - 8, 7, C.pink, 181);

  // --- 낚시하는 아이 (호숫가 왼쪽 풀밭, 찌는 호수 위에) ---
  drawFisher(X(0.07), Y(0.83), sh * 0.2, Y(0.78));
}

// ---------- 바다 풍경 (스케치북 다음 페이지!) — 전부 크레파스 ----------
function drawSceneSea(p) {
  const { px, py, pw, ph } = p;
  const sx = px + pw * 0.06, sy = py + ph * 0.10;
  const sw = pw * 0.88, sh = ph * 0.84;
  const X = t => sx + sw * t;
  const Y = t => sy + sh * t;

  // --- 해 (호수 페이지와 반대편, 오른쪽 위) ---
  const sunX = X(0.9), sunY = Y(0.13), sunR = Math.min(sw, sh) * 0.075;
  scribbleFill(ellipseRows(sunX, sunY, sunR * 0.85, sunR * 0.85, 7),
    { color: C.yellow, seed: 2011, alpha: 0.65, width: 7 });
  crayonPath(ellipsePts(sunX, sunY, sunR, sunR),
    { color: C.orange, width: 5, seed: 2012, wobble: 3 });
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2 + 0.3;
    const r1 = sunR * 1.25, r2 = sunR * (1.6 + (i % 3) * 0.14);
    crayonPath([
      [sunX + Math.cos(a) * r1, sunY + Math.sin(a) * r1],
      [sunX + Math.cos(a) * r2, sunY + Math.sin(a) * r2],
    ], { color: C.orange, width: 4.5, seed: 2020 + i, wobble: 1.5 });
  }

  // --- 구름 + 갈매기 ---
  drawCloud(X(0.18), Y(0.08), sw * 0.05, 2031);
  drawCloud(X(0.52), Y(0.15), sw * 0.04, 2041);
  [[0.3, 0.2], [0.4, 0.13], [0.62, 0.22]].forEach(([tx, ty], i) => {
    const gx = X(tx), gy = Y(ty), g = sw * 0.018;
    crayonPath([[gx - g, gy], [gx - g * 0.5, gy - g * 0.7], [gx, gy], [gx + g * 0.5, gy - g * 0.7], [gx + g, gy]],
      { color: C.navy, width: 2.5, seed: 2051 + i, wobble: 1 });
  });

  // --- 바다 (수평선부터 모래사장까지 넓게) ---
  const horizon = Y(0.3), sandTop = Y(0.8);
  const seaRows = [];
  for (let y = horizon + 8; y < sandTop - 3; y += 12) seaRows.push({ y, x1: X(0.01), x2: X(0.99) });
  scribbleFill(seaRows, { color: C.skyBlue, seed: 2061, alpha: 0.5, width: 8, overshoot: 6 });
  const deepRows = [];  // 수평선 근처는 더 진하게 (먼바다 느낌)
  for (let y = horizon + 8; y < horizon + sh * 0.14; y += 10) deepRows.push({ y, x1: X(0.01), x2: X(0.99) });
  scribbleFill(deepRows, { color: C.deepBlue, seed: 2062, alpha: 0.35, width: 7, overshoot: 4 });
  const horizonLine = [];
  for (let i = 0; i <= 20; i++) horizonLine.push([X(i / 20), horizon]);
  crayonPath(horizonLine, { color: C.navy, width: 4.5, seed: 2063, wobble: 2 });

  // 물결
  [[0.2, 0.45], [0.5, 0.5], [0.78, 0.44], [0.35, 0.63], [0.68, 0.68], [0.14, 0.58]].forEach(([tx, ty], i) => {
    const rx = X(tx), ry = Y(ty), len = sw * 0.07;
    const wave = [];
    for (let k = 0; k <= 10; k++) wave.push([rx - len / 2 + (len * k) / 10, ry + Math.sin(k * 1.1) * 3]);
    crayonPath(wave, { color: C.navy, width: 4, seed: 2070 + i, wobble: 1.5, alpha: 0.7 });
  });

  // --- 돛단배 (하얀 돛 + 빨간 깃발) ---
  const bx = X(0.74), by = horizon + sh * 0.06;
  crayonPath([[bx - 28, by], [bx + 28, by], [bx + 17, by + 14], [bx - 17, by + 14], [bx - 28, by]],
    { color: C.brown, width: 4, seed: 2081, wobble: 1.2 });
  crayonPath([[bx, by - 2], [bx, by - 46]], { color: C.darkBrown, width: 3.5, seed: 2082, wobble: 1 });
  crayonPath([[bx + 3, by - 44], [bx + 32, by - 8], [bx + 3, by - 8], [bx + 3, by - 44]],
    { color: C.gray, width: 3.5, seed: 2083, wobble: 1.2 });
  crayonPath([[bx, by - 46], [bx - 13, by - 40], [bx, by - 34]],
    { color: C.red, width: 3, seed: 2084, wobble: 0.8 });

  // --- 모래사장 ---
  const sandRows = [];
  for (let y = sandTop + 6; y < Y(1.0); y += 11) sandRows.push({ y, x1: X(0.01), x2: X(0.99) });
  scribbleFill(sandRows, { color: C.yellow, seed: 2091, alpha: 0.3, width: 7, overshoot: 5 });
  const sandLine = [];
  for (let i = 0; i <= 20; i++) sandLine.push([X(i / 20), sandTop + Math.sin(i * 1.3) * 4]);
  crayonPath(sandLine, { color: C.orange, width: 4, seed: 2092, wobble: 3 });

  // 조개 + 불가사리 + 게 (모래사장 친구들)
  crayonPath(ellipsePts(X(0.42), Y(0.9), 7, 5, 12), { color: C.pink, width: 3, seed: 2094, wobble: 0.8 });
  for (let i = 0; i < 5; i++) {   // 불가사리 (다리 5개)
    const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
    crayonPath([[X(0.58), Y(0.92)], [X(0.58) + Math.cos(a) * 10, Y(0.92) + Math.sin(a) * 10]],
      { color: C.orange, width: 3.5, seed: 2095 + i, wobble: 0.5 });
  }
  const cbx = X(0.82), cby = Y(0.9);   // 게
  crayonPath(ellipsePts(cbx, cby, 11, 8, 14), { color: C.red, width: 3.5, seed: 2101, wobble: 1 });
  for (let i = 0; i < 3; i++) {
    crayonPath([[cbx - 10, cby + 2 + i * 3], [cbx - 18, cby + 6 + i * 4]], { color: C.red, width: 2.2, seed: 2102 + i, wobble: 0.5 });
    crayonPath([[cbx + 10, cby + 2 + i * 3], [cbx + 18, cby + 6 + i * 4]], { color: C.red, width: 2.2, seed: 2105 + i, wobble: 0.5 });
  }
  crayonPath([[cbx - 5, cby - 7], [cbx - 7, cby - 13]], { color: C.red, width: 2.2, seed: 2108, wobble: 0.5 });
  crayonPath([[cbx + 5, cby - 7], [cbx + 7, cby - 13]], { color: C.red, width: 2.2, seed: 2109, wobble: 0.5 });

  // --- 낚시하는 아이 (모래사장 왼쪽, 찌는 바다 위에) ---
  drawFisher(X(0.07), Y(0.9), sh * 0.2, Y(0.68));

  // 타이밍 원이 나올 바다 범위 (호수 대신 이 영역을 쓴다)
  SCENE.lake = { cx: X(0.55), cy: Y(0.55), rx: sw * 0.4, ry: sh * 0.17 };
  SCENE.top = sy;
}

// ---------- 늪지 풍경 (세 번째 페이지! 안개 낀 초록 늪) ----------
function drawSceneSwamp(p) {
  const { px, py, pw, ph } = p;
  const sx = px + pw * 0.06, sy = py + ph * 0.10;
  const sw = pw * 0.88, sh = ph * 0.84;
  const X = t => sx + sw * t;
  const Y = t => sy + sh * t;

  // 뒤편 고목나무 두 그루 (잎 없는 가지)
  [[0.12, 61], [0.85, 71]].forEach(([tx, seed]) => {
    const bx2 = X(tx), by2 = Y(0.42);
    crayonPath([[bx2, by2], [bx2, by2 - sh * 0.3]], { color: C.darkBrown, width: 6, seed, wobble: 2 });
    crayonPath([[bx2, by2 - sh * 0.18], [bx2 - sw * 0.05, by2 - sh * 0.3]], { color: C.darkBrown, width: 3.5, seed: seed + 1, wobble: 2 });
    crayonPath([[bx2, by2 - sh * 0.24], [bx2 + sw * 0.05, by2 - sh * 0.34]], { color: C.darkBrown, width: 3.5, seed: seed + 2, wobble: 2 });
  });
  // 안개 (회색 가로 슥슥)
  [[0.3, 0.18], [0.6, 0.25], [0.2, 0.32], [0.7, 0.12]].forEach(([tx, ty], i) => {
    const fx2 = X(tx), fy2 = Y(ty);
    crayonPath([[fx2 - sw * 0.14, fy2], [fx2 + sw * 0.14, fy2]],
      { color: C.gray, width: 9, seed: 2201 + i, wobble: 1.5, alpha: 0.25, passes: 1, continuous: true });
  });

  // 늪 (진한 초록 물, 화면 대부분)
  const swampTop = Y(0.42);
  const rows = [];
  for (let y = swampTop + 8; y < Y(0.97); y += 11) rows.push({ y, x1: X(0.01), x2: X(0.99) });
  scribbleFill(rows, { color: C.darkGreen, seed: 2211, alpha: 0.4, width: 8, overshoot: 5 });
  const rows2 = [];
  for (let y = swampTop + 8; y < Y(0.97); y += 17) rows2.push({ y, x1: X(0.05), x2: X(0.95) });
  scribbleFill(rows2, { color: C.green, seed: 2212, alpha: 0.3, width: 6, overshoot: 4 });
  const topLine = [];
  for (let i = 0; i <= 20; i++) topLine.push([X(i / 20), swampTop]);
  crayonPath(topLine, { color: C.darkGreen, width: 4.5, seed: 2213, wobble: 2.5 });

  // 수련잎 (동글 잎 + 브이자 홈)
  [[0.35, 0.55, 26], [0.62, 0.5, 22], [0.75, 0.68, 30], [0.25, 0.75, 24]].forEach(([tx, ty, r], i) => {
    const lx = X(tx), ly = Y(ty);
    crayonPath(ellipsePts(lx, ly, r, r * 0.45, 18), { color: C.green, width: 3.5, seed: 2221 + i, wobble: 1.5 });
    crayonPath([[lx, ly], [lx + r * 0.8, ly - r * 0.25]], { color: C.green, width: 2.5, seed: 2226 + i, wobble: 0.8 });
  });
  // 보글보글 거품
  [[0.5, 0.62], [0.55, 0.58], [0.45, 0.8], [0.68, 0.85]].forEach(([tx, ty], i) => {
    crayonPath(ellipsePts(X(tx), Y(ty), 4 + (i % 2) * 2, 4 + (i % 2) * 2, 8),
      { color: C.skyBlue, width: 2, seed: 2231 + i, wobble: 0.5, alpha: 0.7 });
  });
  // 부들 (갈대 + 소시지 끝)
  [[0.9, 91], [0.94, 95], [0.06, 99]].forEach(([tx, seed]) => {
    const rx2 = X(tx);
    crayonPath([[rx2, Y(0.97)], [rx2, Y(0.6)]], { color: C.darkGreen, width: 3, seed, wobble: 1.5 });
    scribbleFill(ellipseRows(rx2, Y(0.57), 4.5, 10, 4), { color: C.darkBrown, seed: seed + 1, alpha: 0.9, width: 4 });
  });
  // 반딧불 (노란 점 + 반짝)
  [[0.4, 0.3], [0.55, 0.22], [0.8, 0.35]].forEach(([tx, ty], i) => {
    const gx = X(tx), gy = Y(ty);
    crayonPath(ellipsePts(gx, gy, 2.5, 2.5, 6), { color: C.yellow, width: 3, seed: 2241 + i, wobble: 0.3, alpha: 1 });
  });

  // 낚시하는 아이 (왼쪽 통나무 위)
  crayonPath([[X(0.02), Y(0.92)], [X(0.3), Y(0.92)]], { color: C.brown, width: 12, seed: 2251, wobble: 1.5, alpha: 0.9, passes: 2 });
  crayonPath([[X(0.02), Y(0.92)], [X(0.3), Y(0.92)]], { color: C.darkBrown, width: 3, seed: 2252, wobble: 1.5 });
  drawFisher(X(0.07), Y(0.88), sh * 0.2, Y(0.66));

  // 타이밍 원이 나올 늪 범위
  SCENE.lake = { cx: X(0.55), cy: Y(0.66), rx: sw * 0.38, ry: sh * 0.2 };
  SCENE.top = sy;
}

// 앉아서 낚시하는 아이: fx,fy = 엉덩이 위치, s = 크기, bobY = 찌가 뜨는 물 높이
function drawFisher(fx, fy, s, bobY) {
  // 다리 (땅에 앉아 앞으로 쭉 뻗음) + 신발
  crayonPath([[fx + 0.05 * s, fy - 0.22 * s], [fx + 0.35 * s, fy - 0.08 * s], [fx + 0.6 * s, fy - 0.05 * s]],
    { color: C.deepBlue, width: 7, seed: 201, wobble: 1.5 });
  crayonPath([[fx + 0.08 * s, fy - 0.18 * s], [fx + 0.38 * s, fy - 0.03 * s], [fx + 0.64 * s, fy]],
    { color: C.navy, width: 7, seed: 202, wobble: 1.5 });
  crayonPath(ellipsePts(fx + 0.65 * s, fy - 0.05 * s, 0.07 * s, 0.05 * s, 12),
    { color: C.darkBrown, width: 5, seed: 203, wobble: 0.5, alpha: 1 });
  crayonPath(ellipsePts(fx + 0.69 * s, fy, 0.07 * s, 0.05 * s, 12),
    { color: C.darkBrown, width: 5, seed: 204, wobble: 0.5, alpha: 1 });
  // 몸통 (빨간 티셔츠)
  scribbleFill(ellipseRows(fx, fy - 0.36 * s, 0.17 * s, 0.22 * s, 6),
    { color: C.red, seed: 205, alpha: 0.6, width: 5 });
  crayonPath(ellipsePts(fx, fy - 0.36 * s, 0.19 * s, 0.24 * s, 24),
    { color: C.redDark, width: 4.5, seed: 206, wobble: 1.5 });
  // 팔 (낚싯대 쪽으로)
  crayonPath([[fx + 0.06 * s, fy - 0.45 * s], [fx + 0.3 * s, fy - 0.33 * s]],
    { color: C.skin, width: 5.5, seed: 208, wobble: 1 });
  // 머리
  const hx = fx + 0.06 * s, hy = fy - 0.75 * s, hr = 0.17 * s;
  scribbleFill(ellipseRows(hx, hy, hr * 0.8, hr * 0.8, 5),
    { color: C.skin, seed: 210, alpha: 0.45, width: 5 });
  crayonPath(ellipsePts(hx, hy, hr, hr, 24),
    { color: C.brown, width: 4, seed: 211, wobble: 1.5 });
  // 모자 — 상점 꾸미기에서 산 걸 진짜로 쓴다!
  const capBaseY = hy - 0.5 * hr;
  const hat = save.hat || 'cap';
  if (hat === 'straw') {
    // 밀짚모자: 넓은 챙 + 봉긋한 지붕
    scribbleFill(ellipseRows(hx, capBaseY - hr * 0.3, hr * 0.9, hr * 0.5, 4),
      { color: C.yellow, seed: 212, alpha: 0.7, width: 4 });
    crayonPath(ellipsePts(hx, capBaseY + hr * 0.05, hr * 1.7, hr * 0.4, 20),
      { color: C.brown, width: 4, seed: 213, wobble: 1.2 });
    crayonPath(ellipsePts(hx, capBaseY - hr * 0.35, hr * 0.95, hr * 0.6, 16),
      { color: C.brown, width: 3.5, seed: 218, wobble: 1 });
  } else if (hat === 'wizard') {
    // 마법사 고깔 + 반짝이는 별
    crayonPath([[hx - hr * 1.0, capBaseY + hr * 0.1], [hx + hr * 0.1, capBaseY - hr * 1.9], [hx + hr * 1.1, capBaseY + hr * 0.1], [hx - hr * 1.0, capBaseY + hr * 0.1]],
      { color: C.deepBlue, width: 4, seed: 213, wobble: 1.2 });
    scribbleFill(ellipseRows(hx, capBaseY - hr * 0.5, hr * 0.55, hr * 0.5, 4),
      { color: C.skyBlue, seed: 212, alpha: 0.4, width: 4 });
    [[hx - hr * 0.25, capBaseY - hr * 0.4], [hx + hr * 0.35, capBaseY - hr * 0.15]].forEach(([gx, gy], k) => {
      crayonPath([[gx - 3, gy], [gx + 3, gy]], { color: C.yellow, width: 2, seed: 215 + k, wobble: 0.3, alpha: 1 });
      crayonPath([[gx, gy - 3], [gx, gy + 3]], { color: C.yellow, width: 2, seed: 219 + k, wobble: 0.3, alpha: 1 });
    });
  } else if (hat === 'crown') {
    // 황금 왕관 — 낚시왕!
    scribbleFill(ellipseRows(hx, capBaseY - hr * 0.25, hr * 0.8, hr * 0.35, 4),
      { color: C.yellow, seed: 212, alpha: 0.85, width: 4 });
    crayonPath([[hx - hr * 0.95, capBaseY], [hx - hr * 0.95, capBaseY - hr * 0.7], [hx - hr * 0.45, capBaseY - hr * 0.25], [hx, capBaseY - hr * 1.05], [hx + hr * 0.45, capBaseY - hr * 0.25], [hx + hr * 0.95, capBaseY - hr * 0.7], [hx + hr * 0.95, capBaseY], [hx - hr * 0.95, capBaseY]],
      { color: C.orange, width: 3.5, seed: 213, wobble: 0.8 });
    crayonPath(ellipsePts(hx, capBaseY - hr * 0.2, 3, 3, 8),
      { color: C.red, width: 3, seed: 219, wobble: 0.3, alpha: 1 });
  } else {
  // 주황 야구모자 (속을 채운 반원 + 챙)
  const capRows = [];
  for (let y = capBaseY - hr * 0.6; y < capBaseY - 1; y += 4) {
    const t = (capBaseY - y) / (hr * 0.65);
    const half = hr * 1.05 * Math.sqrt(Math.max(0, 1 - t * t));
    if (half > 3) capRows.push({ y, x1: hx - half, x2: hx + half });
  }
  scribbleFill(capRows, { color: C.orange, seed: 212, alpha: 0.6, width: 4, overshoot: 2 });
  const cap = [];
  for (let i = 0; i <= 14; i++) {
    const a = Math.PI - (i / 14) * Math.PI;
    cap.push([hx + Math.cos(a) * hr * 1.08, capBaseY - Math.sin(a) * hr * 0.65]);
  }
  cap.push([hx - hr * 1.08, capBaseY]);  // 아래쪽을 닫아서 잘린 느낌 없애기
  crayonPath(cap, { color: C.orange, width: 5, seed: 213, wobble: 1.2 });
  crayonPath([[hx + hr * 0.9, capBaseY + hr * 0.03], [hx + hr * 1.7, capBaseY + hr * 0.15]],
    { color: C.orange, width: 5, seed: 214, wobble: 1 });
  }
  // 눈 + 웃는 입 (호수 쪽을 봄)
  crayonPath([[hx + hr * 0.45, hy - hr * 0.1], [hx + hr * 0.55, hy - hr * 0.1]],
    { color: C.darkBrown, width: 3.5, seed: 216, wobble: 0.4 });
  crayonPath([[hx + hr * 0.25, hy + hr * 0.35], [hx + hr * 0.45, hy + hr * 0.45], [hx + hr * 0.65, hy + hr * 0.3]],
    { color: C.darkBrown, width: 3, seed: 217, wobble: 0.4 });
  // 낚싯대 (손에서 호수 위로 길게, 살짝 휘어짐) — 상점에서 산 낚싯대 색으로!
  const tipX = fx + 1.45 * s, tipY = fy - 0.95 * s;
  crayonPath([[fx + 0.3 * s, fy - 0.33 * s], [fx + 0.9 * s, fy - 0.72 * s], [tipX, tipY]],
    { color: curRod().color, width: 4.5, seed: 220, wobble: 2 });
  // 낚싯줄과 찌는 움직여야 하니까 배경에 안 그리고 위치만 기억해둔다
  SCENE.rodTip = { x: tipX, y: tipY };
  SCENE.bobberHome = { x: tipX + 0.06 * s, y: bobY };
}

function drawHill(cx, baseY, rx, h, seed) {
  // 봉긋한 반원 동산: 색칠 먼저, 그 위에 외곽선
  const rows = [];
  for (let y = baseY - h + 6; y < baseY - 2; y += 9) {
    const t = (baseY - y) / h;
    const half = rx * Math.sqrt(Math.max(0, 1 - t * t));
    if (half > 8) rows.push({ y, x1: cx - half, x2: cx + half });
  }
  scribbleFill(rows, { color: C.green, seed: seed + 1, alpha: 0.45, width: 7, overshoot: 6 });
  const outline = [];
  for (let i = 0; i <= 22; i++) {
    const a = Math.PI - (i / 22) * Math.PI;
    outline.push([cx + Math.cos(a) * rx, baseY - Math.sin(a) * h]);
  }
  crayonPath(outline, { color: C.darkGreen, width: 5, seed, wobble: 3 });
}

function drawCloud(cx, cy, r, seed) {
  const pts = [];
  const n = 26;
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2;
    const bump = 1 + Math.sin(a * 3 + seed) * 0.18 + Math.sin(a * 5) * 0.1;
    pts.push([cx + Math.cos(a) * r * 1.5 * bump, cy + Math.sin(a) * r * 0.75 * bump]);
  }
  scribbleFill(ellipseRows(cx, cy + r * 0.1, r * 1.2, r * 0.45, 8),
    { color: C.cloud, seed: seed + 1, alpha: 0.22, width: 6 });
  crayonPath(pts, { color: C.cloud, width: 4, seed, wobble: 2 });
}

function drawTree(bx, by, size, seed) {
  // 기둥
  crayonPath([[bx, by], [bx, by - size * 0.85]],
    { color: C.brown, width: 6, seed, wobble: 1.5 });
  // 수풀 (동글동글)
  const cy = by - size * 1.15;
  scribbleFill(ellipseRows(bx, cy, size * 0.55, size * 0.5, 7),
    { color: C.green, seed: seed + 1, alpha: 0.55, width: 6 });
  crayonPath(ellipsePts(bx, cy, size * 0.62, size * 0.55, 30),
    { color: C.darkGreen, width: 4.5, seed: seed + 2, wobble: 3 });
}

function drawFlower(cx, cy, r, color, seed) {
  crayonPath([[cx, cy + r * 1.8], [cx, cy + r * 0.6]],
    { color: C.darkGreen, width: 3.5, seed, wobble: 1 });
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
    crayonPath(ellipsePts(cx + Math.cos(a) * r * 0.7, cy + Math.sin(a) * r * 0.7,
      r * 0.45, r * 0.45, 12),
      { color, width: 3, seed: seed + 1 + i, wobble: 1, alpha: 0.85 });
  }
  crayonPath(ellipsePts(cx, cy, r * 0.3, r * 0.3, 10),
    { color: C.yellow, width: 3, seed: seed + 9, wobble: 0.8 });
}

function achvProgress(a) {
  if (a.prog) {
    const parts = a.prog();
    return { parts, done: parts.every(p => p.have >= p.need) };
  }
  const parts = a.parts.map(p => {
    const fish = p.fishId ? FISH.find(f => f.id === p.fishId) : null;
    return {
      label: fish ? LX(fish.name) : '???',
      have: fish ? Math.min(save.caught[p.fishId] || 0, p.need) : 0,
      need: p.need,
    };
  });
  const done = a.parts.every(p => p.fishId && (save.caught[p.fishId] || 0) >= p.need);
  return { parts, done };
}

  for (const a of ACHV) {

      save.achieved[a.id] = true;
      save.coins = (save.coins || 0) + a.coins;
      save.coinEarned = (save.coinEarned || 0) + a.coins;
      persistSave();
      game.achvQueue.push(a);
    }
  }
}

let audioCtx = null;
function beep(freq, dur, type = 'sine', vol = 0.18, delay = 0, slide = 0) {
  if (!SFX || AUTO_DEMO) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
    g.gain.setValueAtTime(vol * VOLUME, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
const sfx = {

let BGM = localStorage.getItem('sketch-fishing-bgm') !== 'off';
let bgmTimer = null;
function bgmNote(freq, t0, dur, vol, type) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol * VOLUME, t0 + 0.06);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start(t0);
  o.stop(t0 + dur + 0.05);
}
// 지역별 BGM (아드님이 AI로 만든 곡들 — 배포 OK!) — 크레파스 멜로디는 파일 없을 때 예비용
const SPOT_BGM = {
  lake: new Audio('audio/driftwood-and-still-water.mp3'),   // "Driftwood and Still Water"
  sea: new Audio('audio/sunlight-on-the-foam.mp3'),         // "Sunlight on the Foam"
  swamp: new Audio('audio/where-the-water-rests.mp3'),      // "Where the Water Rests"
};
Object.values(SPOT_BGM).forEach(a => {
  a.loop = true;
  a.volume = 0.55 * VOLUME;
  a.addEventListener('error', () => { a.broken = true; });   // 파일이 없으면 멜로디로 대신
});

function spotTrack() {
  const a = SPOT_BGM[save.spot];
  return a && !a.broken ? a : null;
}

let bgmHoldUntil = 0, bgmDelayTimer = null;
function syncSpotBgm() {
  if (!bgmTimer) return;                    // 음악이 아직 시작 안 됐으면 통과
  if (performance.now() < bgmHoldUntil) return;   // 페이지 넘김 직후엔 잠깐 조용히
  const cur = BGM ? spotTrack() : null;
  Object.values(SPOT_BGM).forEach(a => {
    if (a !== cur && !a.paused) a.pause();
  });
  if (cur && cur.paused) cur.play().catch(() => {});
}

let bgmBar = 0;
function bgmLoop() {
  if (!BGM) return;
  const B = 0.55;   // 한 박자 (초)
  if (spotTrack()) {
    // 이 지역은 MP3가 연주 — 멜로디는 쉬면서 페이지가 바뀌는지만 살핀다
    syncSpotBgm();
    bgmTimer = setTimeout(bgmLoop, 600);
    return;
  }
  // 도레미솔라 5음계 멜로디를 한 마디(4박자)씩 연주 (미솔라솔 미레도레 미솔도라 솔미레도)
  const t0 = audioCtx.currentTime + 0.08;
  const mel = [330, 392, 440, 392, 330, 294, 262, 294, 330, 392, 523, 440, 392, 330, 294, 262];
  for (let k = 0; k < 4; k++) bgmNote(mel[(bgmBar * 4 + k) % 16], t0 + k * B, B * 0.95, 0.035, 'triangle');
  bgmNote([131, 110, 87, 98][bgmBar % 4], t0, B * 3.9, 0.05, 'sine');
  bgmBar++;
  bgmTimer = setTimeout(bgmLoop, 4 * B * 1000 - 100);
}
function startBgm() {
  if (!BGM || AUTO_DEMO || bgmTimer) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    bgmLoop();
    syncSpotBgm();
  } catch (e) {}
}
function stopBgm() {
  clearTimeout(bgmTimer);
  bgmTimer = null;
  Object.values(SPOT_BGM).forEach(a => a.pause());
}

}
