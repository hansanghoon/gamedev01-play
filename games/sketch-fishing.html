    desc: { ko: '처음부터 쓰고 있던 모자', en: 'Your first cap', ja: '最初からの帽子', zh: '一开始戴的帽子' } },
  { id: 'straw', price: 300,
    name: { ko: '밀짚모자', en: 'Straw Hat', ja: '麦わら帽子', zh: '草帽' },
    desc: { ko: '여름 낚시엔 역시 이거!', en: 'Perfect for summer fishing!', ja: '夏の釣りはこれ！', zh: '夏天钓鱼就靠它！' } },
  { id: 'wizard', price: 800,
    name: { ko: '마법사 고깔', en: 'Wizard Hat', ja: '魔法使いのぼうし', zh: '魔法师尖帽' },
    desc: { ko: '별이 반짝이는 고깔모자', en: 'A cone of sparkling stars', ja: '星がきらめくとんがり帽', zh: '闪着星星的尖顶帽' } },
  { id: 'crown', price: 2000,
    name: { ko: '황금 왕관', en: 'Golden Crown', ja: '黄金の王かん', zh: '黄金王冠' },
    desc: { ko: '낚시왕의 증표! (제일 비쌈)', en: 'Proof of the Fishing King!', ja: '釣り王のあかし！', zh: '钓鱼之王的证明！' } },
];

function baitMul(f) {
  if (save.bait === 'glitter') return f.weight <= 6 ? 4 : 1;
  if (save.bait === 'goldpaint') return (f.id === 'sketchbook-whale' || f.id === 'doodle-imugi') ? 12 : (f.weight <= 6 ? 2 : 1);
  return 1;
}

const fishWeight = f => f.weight * spotMul(f) * baitMul(f);

// 시크릿(전설) 천장 — 이 횟수까지 입질에 전설이 안 나오면, 범위 안에서 반드시 나온다!
//  호수: 70번까지 안 나오면 71~99번째 사이 보장
//  늪지: 99번까지 안 나오면 100~119번째 사이 보장
//  바다: 119번까지 안 나오면 120~139번째 사이 보장
const PITY = {
  lake: { fish: 'doodle-dragon', start: 71, end: 99 },
  swamp: { fish: 'doodle-imugi', start: 100, end: 119 },
  sea: { fish: 'sketchbook-whale', start: 120, end: 139 },
};

function pickFish() {
  let r = Math.random() * FISH.reduce((a, f) => a + fishWeight(f), 0);
  for (const f of FISH) { r -= fishWeight(f); if (r < 0) return f; }
  return FISH[0];
}

// ============================================================
// 코인 + 낚시 상점 — 물고기는 귀할수록(weight 작을수록) 비싸다
// ============================================================
// 코인 지급 기준 (2026-07-25 확정):
//  ① 희귀도: 잘 안 잡히는 물고기일수록 비싸다 (30 ÷ weight)
//  ② 패턴 난이도 배수: 어려운 손맛일수록 더 준다!
//     보통 1배 · 미끌이/돌진 1.5배 · 깐깐이/지그재그/청개구리 2배 · 유령 2.5배 · 전설 3배
//  ③ 퍼펙트 보너스: "딱 맞았어!!"만으로 잡으면 최종 2배 (endRound에서)
const TRAIT_MUL = { slippery: 1.5, dash: 1.5, picky: 2, zigzag: 2, bounce: 2, ghost: 2.5, legend: 3, imugi: 3 };
const fishPrice = f => Math.max(1, Math.round((30 / f.weight) * (TRAIT_MUL[f.trait] || 1)));

// 낚싯대: 순서대로만 살 수 있고, 사면 바로 갈아 낀다 (화면 속 낚싯대 색도 바뀜!)
// slow: 타이밍 원이 줄어드는 시간 배율 (클수록 여유) / wait: 입질 대기시간 배율 (작을수록 빨리 옴)
const RODS = [
  { name: { ko: '나뭇가지 낚싯대', en: 'Twig Rod', ja: '木の枝ロッド', zh: '树枝鱼竿' }, price: 0, slow: 1, wait: 1, color: C.darkBrown,
    desc: { ko: '처음부터 함께한 든든한 나뭇가지', en: 'Your trusty first twig', ja: '最初からの相棒', zh: '一开始就陪着你的树枝' } },
  { name: { ko: '연필 낚싯대', en: 'Pencil Rod', ja: 'えんぴつロッド', zh: '铅笔鱼竿' }, price: 60, slow: 1.1, wait: 0.85, color: C.orange,
    desc: { ko: '원이 10% 천천히 · 입질 15% 빨리', en: 'Ring 10% slower · bites 15% sooner', ja: '輪10%ゆっくり · アタリ15%早く', zh: '圆圈慢10% · 咬钩快15%' } },
  { name: { ko: '붓 낚싯대', en: 'Brush Rod', ja: 'ふでロッド', zh: '毛笔鱼竿' }, price: 250, slow: 1.2, wait: 0.7, color: C.deepBlue,
    desc: { ko: '원이 20% 천천히 · 입질 30% 빨리', en: 'Ring 20% slower · bites 30% sooner', ja: '輪20%ゆっくり · アタリ30%早く', zh: '圆圈慢20% · 咬钩快30%' } },
  { name: { ko: '황금 크레파스 낚싯대', en: 'Golden Crayon Rod', ja: '黄金クレヨンロッド', zh: '黄金蜡笔鱼竿' }, price: 800, slow: 1.3, wait: 0.55, color: C.yellow,
    desc: { ko: '원이 30% 천천히 · 입질 45% 빨리', en: 'Ring 30% slower · bites 45% sooner', ja: '輪30%ゆっくり · アタリ45%早く', zh: '圆圈慢30% · 咬钩快45%' } },
];
const curRod = () => RODS[Math.min(save.rod || 0, RODS.length - 1)];

save.rod = save.rod || 0;                                 // 지금 끼운 낚싯대
if (!save.rods) {
  // 옛 저장(순서대로만 소유) → 가진 낚싯대 목록으로 마이그레이션
  save.rods = {};
  for (let i = 0; i <= (save.rod || 0); i++) save.rods[i] = true;
}
save.playMs = save.playMs || 0;                           // 플레이타임 (밀리초 누적)
save.baits = save.baits || {};                            // { 미끼id: 개수 }
save.bait = save.bait || 'bread';                         // 지금 끼운 미끼
save.spot = save.spot === 'sea' ? 'sea' : 'lake';         // 지금 낚시터 (스케치북 페이지)
save.hat = save.hat || 'cap';                             // 쓰고 있는 모자
save.pity = save.pity || { lake: 0, sea: 0, swamp: 0 };   // 지역별 시크릿 천장 카운터
save.hats = save.hats || { cap: true };                   // 가진 모자들
if (save.coins === undefined) {
  // 코인 기능이 생기기 전에 잡아둔 물고기도 소급해서 코인으로 쳐준다!
  save.coins = FISH.reduce((a, f) => a + (save.caught[f.id] || 0) * fishPrice(f), 0);
  persistSave();
}
if (!save.achvRewarded) {
  // 보상 기능이 생기기 전에 달성한 도전과제도 소급해서 코인 지급!
  save.achvRewarded = true;
  for (const a of ACHV) if (save.achieved[a.id]) save.coins += a.coins;
  persistSave();
}
if (save.coinEarned === undefined) {
  // "부자 화가" 과제용 누적 카운터 — 지금까지 모은 코인을 시작값으로
  save.coinEarned = save.coins;
  persistSave();
}

// 개그 뽑기 — gagWeights가 있으면 그 비율대로 (예: 클립멸치는 [35, 65])
function pickGag(fish) {
  const gags = LX(fish.gags);
  const w = fish.gagWeights;
  if (!w) return gags[Math.floor(Math.random() * gags.length)];
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < gags.length; i++) { r -= w[i]; if (r < 0) return gags[i]; }
  return gags[gags.length - 1];
}

// 받침이 있으면 '을', 없으면 '를'
function eulReul(word) {
  const code = word.charCodeAt(word.length - 1) - 44032;
  if (code < 0 || code > 11171) return '을(를)';
  return code % 28 ? '을' : '를';
}

// 물고기 성격별 원 패턴 — 잡는 손맛이 다 다르다!
//  slippery(미끌이): 중간에 멈칫! 하고 다시 줄어듦 / dash(돌진형): 끝에 갑자기 빨라짐
//  picky(깐깐이): 판정이 좁음 / legend(전설): 빨라지고 판정도 좁음
function traitProgress(p, trait) {
  if (trait === 'dash') return Math.pow(p, 1.8);
  if (trait === 'slippery') {
    if (p < 0.4) return p * 1.3;
    if (p < 0.6) return 0.52;              // 멈칫!
    return 0.52 + (p - 0.6) * 1.2;
  }
  if (trait === 'legend') return Math.pow(p, 1.4);
  if (trait === 'zigzag') {                   // 두 번 멈칫! (늪지)
    if (p < 0.25) return p * 1.2;
    if (p < 0.4) return 0.3;
    if (p < 0.6) return 0.3 + (p - 0.4) * 1.75;
    if (p < 0.72) return 0.65;
    return 0.65 + (p - 0.72) * 1.25;
  }
  if (trait === 'bounce') return p - 0.13 * Math.sin(Math.PI * 2 * p);   // 커졌다 작아졌다! (늪지)
  if (trait === 'imugi') return Math.pow(p, 1.5);   // 늪의 전설
  // ghost는 진행은 보통이지만 원이 유령처럼 깜빡인다 (그리기 쪽 참조)
  return p;
}

function circleRadius(c, t) {
  const p0 = Math.min(1, (t - c.start) / c.dur);
  const p = traitProgress(p0, game.fish && game.fish.trait);
  return TARGET_R * (START_MUL - (START_MUL - 0.2) * p);
}

// 성격별 판정 폭 (깐깐이 70% · 전설 80%)
function judgeMul() {
  const tr2 = game.fish && game.fish.trait;
  return tr2 === 'picky' ? 0.7 : (tr2 === 'legend' || tr2 === 'imugi') ? 0.8 : 1;
}

function newCircle(t, idx) {
  // 호수 안 아무 데나 (가장자리는 피해서)
  const L = SCENE.lake;
  const a = Math.random() * Math.PI * 2;
  const rr = Math.sqrt(Math.random()) * 0.6;
  return {
    x: L.cx + Math.cos(a) * L.rx * rr,
    y: L.cy + Math.sin(a) * L.ry * rr,
    start: t,
    dur: CIRCLE_DUR[Math.min(idx, CIRCLE_DUR.length - 1)] * game.fish.speed * curRod().slow,
  };
}

function startWaiting(t) {
  game.state = 'waiting';
  game.castAt = t;   // 던지기 연출 시작 (찌가 포물선으로 날아간다)
  game.biteAt = t + (AUTO_DEMO ? 800 : (2500 + Math.random() * 3500) * curRod().wait);
  sfx.cast();
}

function startMinigame(t) {
  game.state = 'minigame';
  game.fish = pickFish();   // 어떤 물고기가 물었는지 미리 정해둠 (잡기 전엔 비밀!)
  // 시크릿 천장: 전설이 오래 안 나왔으면 슬쩍 바꿔치기 (범위 끝에선 100% 등장)
  const rule = PITY[save.spot || 'lake'];
  if (rule && !AUTO_DEMO) {
    save.pity = save.pity || { lake: 0, sea: 0, swamp: 0 };
    const n = (save.pity[save.spot || 'lake'] || 0) + 1;   // 이 지역에서 몇 번째 입질인지
    if (game.fish.id !== rule.fish && n >= rule.start) {
      const chance = n >= rule.end ? 1 : 1 / (rule.end - n + 1);
      if (Math.random() < chance) game.fish = FISH.find(f => f.id === rule.fish);
    }
    save.pity[save.spot || 'lake'] = game.fish.id === rule.fish ? 0 : n;   // 나오면 처음부터 다시
    persistSave();
  }
  // 미끼 소모 (입질 1번에 1개, 다 쓰면 빵 부스러기로 돌아온다)
  if (!AUTO_DEMO && !DEV_FAKE && save.bait !== 'bread') {
    save.baits[save.bait] = Math.max(0, (save.baits[save.bait] || 0) - 1);
    if (!save.baits[save.bait]) save.bait = 'bread';
    save.baitUsed = (save.baitUsed || 0) + 1;   // "미끼 단골" 과제용
    persistSave();
  }
  game.roundPerfect = true; // 전부 "딱 맞았어!!"로 잡는지 (화가의 손 과제)
  game.ci = 0;
  game.circle = null;
  game.nextAt = t + 500;      // 찌가 쑥 들어가는 걸 볼 시간
  game.biteFxUntil = t + 600;
  sfx.bite();
}

function endRound(t, ok, msg) {
  game.state = 'result';
  game.result = ok ? 'catch' : 'escape';
  game.resultMsg = msg;
  game.resultAt = t;
  game.circle = null;
  if (ok) {
    game.caught++;
    // 잡은 물고기의 전용 개그 한마디 (모여봐요 동물의숲처럼!)
    game.gag = pickGag(game.fish);
    game.wasPerfect = game.roundPerfect;                                // 퍼펙트로만 잡았나?
    game.coinGain = fishPrice(game.fish) * (game.wasPerfect ? 2 : 1);   // 퍼펙트면 코인 2배!
    game.isNew = !save.caught[game.fish.id];   // 처음 잡는 물고기면 NEW! 표시
    sfx.catchFish();
    if (!AUTO_DEMO) {  // 자동 시범은 기록에 안 남김
      save.caught[game.fish.id] = (save.caught[game.fish.id] || 0) + 1;
      save.coins = (save.coins || 0) + game.coinGain;
      save.coinEarned = (save.coinEarned || 0) + game.coinGain;
      if (game.roundPerfect) save.perfect++;
      persistSave();
      checkAchievements();
    }
  } else {
    game.missed++;
    sfx.escape();
    if (!AUTO_DEMO) { save.missed++; persistSave(); checkAchievements(); }
  }
}

// 게임 중 도감·상점 버튼 (왼쪽 위) — 언어에 따라 폭이 달라짐
function dexBtnRect() {
  return { x: 24, y: SPIRAL_H + 14, w: LANG === 'en' ? 128 : 88, h: 38 };
}
function shopBtnRect() {
  const b = dexBtnRect();
  return { x: b.x + b.w + 10, y: b.y, w: LANG === 'en' ? 96 : 88, h: 38 };
}
function menuBtnRect() {
  const b = shopBtnRect();
  return { x: b.x + b.w + 10, y: b.y, w: LANG === 'en' ? 96 : 88, h: 38 };
}
// 일시정지 버튼 (오른쪽 위 구석, 코인 아래)
function pauseBtnRect() {
  return { x: W - 62, y: SPIRAL_H + 76, w: 38, h: 38 };
}
// 페이지 넘김 버튼 두 개 (오른쪽 아래) — 호수·바다·늪지
function nextSpotRect() {
  const w = LANG === 'en' ? 150 : 152;
  return { x: W - w - 24, y: H - 66, w, h: 38 };
}
function prevSpotRect() {
  const w = LANG === 'en' ? 150 : 152;
  const n = nextSpotRect();
  return { x: n.x - w - 10, y: n.y, w, h: 38 };
}

function onTap(t, px, py) {
  if (game.paused) {
    // 일시정지 풀기 — 멈춘 시간만큼 타이머를 뒤로 밀어준다
    const d = t - game.pausedAt;
    game.biteAt += d;
    game.nextAt += d;
    game.castAt += d;
    if (game.circle) game.circle.start += d;
    game.paused = false;
    return;
  }
  if (game.state === 'achv') {
    const pages = Math.ceil(ACHV.length / ACHV_PER_PAGE);
    if (px !== undefined && pages > 1) {
      const nav = achvNavRects();
      const inR = b => px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
      if (inR(nav.prev)) {
        if (game.achvPage > 0) { game.achvPage--; renderAchvToCache(); }
        return;
      }
      if (inR(nav.next)) {
        if (game.achvPage < pages - 1) { game.achvPage++; renderAchvToCache(); }
        return;
      }
    }
    closeAchv();
  } else if (game.state === 'stats') {
    if (px !== undefined) {
      const nav = achvNavRects();
      const inR = b => px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
      if (inR(nav.prev)) {
        if (game.statsPage > 0) { game.statsPage--; renderStatsToCache(); }
        return;
      }
      if (inR(nav.next)) {
        if (game.statsPage < statsPages() - 1) { game.statsPage++; renderStatsToCache(); }
        return;
      }
    }
    closeStats();
  } else if (game.state === 'shop') {
    if (px !== undefined) {
      const L = shopLayout();
      const inRect = b => px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
      // 페이지 화살표 (장비 ↔ 꾸미기)
      const nav = shopNavRects();
      if (inRect(nav.prev)) {
        if (game.shopPage > 0) { game.shopPage--; game.shopMsg = null; renderShopToCache(); }
        return;
      }
      if (inRect(nav.next)) {
        if (game.shopPage < 1) { game.shopPage++; game.shopMsg = null; renderShopToCache(); }
        return;
      }
      if (game.shopPage === 1) {
        // 꾸미기 페이지: 모자 사기/쓰기
        const hrow = L.hats.find(inRect);
        if (hrow) {
          const ht = hrow.ht;
          if (ht.price === 0 || save.hats[ht.id]) {
            save.hat = ht.id;                    // 이미 있으면 바로 착용
            game.shopMsg = null;
            persistSave();
            renderSceneToCache();                // 쓰고 있는 모자가 바뀐다!
          } else if ((save.coins || 0) >= ht.price) {
            save.coins -= ht.price;
            save.hats[ht.id] = true;
            save.hat = ht.id;
            game.shopMsg = null;
            sfx.buy();
            persistSave();
            renderSceneToCache();
          } else {
            game.shopMsg = tr('needCoins');
          }
          renderShopToCache();
          return;
        }
        closeShop(t);
        return;
      }
      const bait = L.baits.find(inRect);
      if (bait) {
        const { b } = bait;
        if (b.price > 0 && px > bait.x + bait.w - 150) {   // 오른쪽 가격 → 구매
          if ((save.coins || 0) >= b.price) {
            save.coins -= b.price;
            save.baits[b.id] = (save.baits[b.id] || 0) + 1;
            game.shopMsg = null;
            sfx.buy();
            persistSave();
          } else {
            game.shopMsg = tr('needCoins');
          }
        } else {                                           // 나머지 → 골라 끼우기
          if (b.price === 0 || (save.baits[b.id] || 0) > 0) {
            save.bait = b.id;
            game.shopMsg = null;
            persistSave();
          } else {
            game.shopMsg = tr('noBait');
          }
        }
        renderShopToCache();
        return;
      }
      const row = L.rows.find(inRect);
      if (row) {
        const i = row.i;
        if (save.rods[i]) {
          if (save.rod !== i) {                // 가진 낚싯대는 클릭해서 갈아 끼우기!
            save.rod = i;
            game.shopMsg = null;
            persistSave();
            renderSceneToCache();              // 낚싯대 색이 바뀌니까 풍경도 다시!
          }
        } else if (!save.rods[i - 1]) {
          game.shopMsg = tr('lockedRod');      // 순서대로만 살 수 있음
        } else if ((save.coins || 0) >= row.r.price) {
          save.coins -= row.r.price;
          save.rods[i] = true;
          save.rod = i;
          game.shopMsg = null;
          sfx.buy();
          persistSave();
          checkAchievements();                 // "황금 손" 과제 확인
          renderSceneToCache();
        } else {
          game.shopMsg = tr('needCoins');
        }
        renderShopToCache();
        return;
      }
    }
    closeShop(t);
  } else if (game.state === 'dex') {
    if (game.dexDetail) {  // 상세 카드가 열려 있으면 → 카드만 닫고 도감으로
      game.dexDetail = null;
      renderDexToCache();
      return;
    }
    if (px !== undefined) {
      const L = dexLayout();
      const inRect = b => px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
      // 호수/바다 탭 전환
      if (inRect(L.tabLake) || inRect(L.tabSea) || inRect(L.tabSwamp)) {
        const tab = inRect(L.tabSwamp) ? 'swamp' : inRect(L.tabSea) ? 'sea' : 'lake';
        if (game.dexTab !== tab) {
          game.dexTab = tab;
          game.dexPage = 0;
          renderDexToCache();
        }
        return;
      }
      // 페이지 넘김 화살표
      if (L.pages > 1) {
        if (inRect(L.prev) && game.dexPage > 0) { game.dexPage--; renderDexToCache(); return; }
        if (inRect(L.next) && game.dexPage < L.pages - 1) { game.dexPage++; renderDexToCache(); return; }
      }
      // 잡은 물고기 칸을 클릭하면 → 상세 카드
      const cell = L.cells.find(inRect);
      if (cell && (save.caught[cell.f.id] || 0) > 0) {
        game.dexDetail = cell.f;
        renderDexToCache();
        return;
      }
    }
    closeDex(t);
  } else if (game.state === 'waiting' || game.state === 'idle') {
    const b = dexBtnRect();
    if (px !== undefined && px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) {
      openDex('waiting');
      return;
    }
    const sb = shopBtnRect();
    if (px !== undefined && px >= sb.x && px <= sb.x + sb.w && py >= sb.y && py <= sb.y + sb.h) {
      openShop('waiting');
      return;
    }
    const mb = menuBtnRect();
    if (px !== undefined && px >= mb.x && px <= mb.x + mb.w && py >= mb.y && py <= mb.y + mb.h) {
      // 메뉴로 돌아가기 (기록은 이미 저장돼 있으니 안전!)
      game.state = 'menu';
      menuEl.classList.remove('hidden');
      return;
    }
    const si0 = SPOTS.indexOf(save.spot || 'lake');
    const nb = nextSpotRect(), pvb = prevSpotRect();
    const hitNext = px !== undefined && px >= nb.x && px <= nb.x + nb.w && py >= nb.y && py <= nb.y + nb.h;
    const hitPrev = px !== undefined && px >= pvb.x && px <= pvb.x + pvb.w && py >= pvb.y && py <= pvb.y + pvb.h;
    if (hitNext || hitPrev) {
      const ni = si0 + (hitNext ? 1 : -1);
      if (ni < 0 || ni >= SPOTS.length) return;   // 끝 페이지면 무시
      // 스케치북 페이지 넘기기 — 옛 페이지가 휙!
      game.flipOld = game.flipOld || document.createElement('canvas');
      game.flipOld.width = sceneCanvas.width;
      game.flipOld.height = sceneCanvas.height;
      game.flipOld.getContext('2d').drawImage(sceneCanvas, 0, 0);
      game.flipDir = hitNext ? 'fwd' : 'back';
      save.spot = SPOTS[ni];
      if (!DEV_FAKE) save.pageFlips = (save.pageFlips || 0) + 1;   // "세계일주" 과제용
      persistSave();
      checkAchievements();
      renderSceneToCache();
      game.flipStart = t;
      sfx.flip();
      // 음악은 페이지가 완전히 넘어가고(0.45초) + 0.68초 쉬고 나서 시작!
      Object.values(SPOT_BGM).forEach(a => a.pause());
      bgmHoldUntil = performance.now() + 1120;
      clearTimeout(bgmDelayTimer);
      bgmDelayTimer = setTimeout(syncSpotBgm, 1140);
      game.state = 'idle';   // 새 페이지에선 다시 던져야 한다!
      return;
    }
    const pz = pauseBtnRect();
    if (px !== undefined && px >= pz.x && px <= pz.x + pz.w && py >= pz.y && py <= pz.y + pz.h) {
      game.paused = true;      // 일시정지!
      game.pausedAt = t;
      return;
    }
    // 지나가는 친구를 클릭하면 화들짝!
    if (game.critter && !game.critter.fleeAt && px !== undefined && game.critter.x !== undefined &&
        Math.hypot(px - game.critter.x, py - game.critter.y) < 36) {
      game.critter.fleeAt = t;
      game.judgeText = game.critter.type === 'firefly' ? '✨' : '!';
      game.judgeUntil = t + 600;
      game.judgeX = game.critter.x;
      game.judgeY = game.critter.y - 24;
      sfx.critter();
      if (!DEV_FAKE && !AUTO_DEMO) {           // "놀래키기 대장" 과제용
        save.critterScared = (save.critterScared || 0) + 1;
        persistSave();
        checkAchievements();
      }
      return;
    }
    if (game.state === 'idle') {
      startWaiting(t);         // 던지기! (클릭이나 스페이스)
      return;
    }
    game.shushUntil = t + 1000;
  } else if (game.state === 'minigame' && game.circle) {
    const pz = pauseBtnRect();
    if (px !== undefined && px >= pz.x && px <= pz.x + pz.w && py >= pz.y && py <= pz.y + pz.h) {
      game.paused = true;
      game.pausedAt = t;
      return;
    }
    const r = circleRadius(game.circle, t);
    const diff = Math.abs(r - TARGET_R);
    if (diff <= TARGET_R * 0.22 * judgeMul()) {
      hitCircle(t, tr('perfect'));
    } else if (diff <= TARGET_R * 0.55 * judgeMul()) {
      game.roundPerfect = false;
      hitCircle(t, tr('nice'));
    } else {
      endRound(t, false, r > TARGET_R ? tr('tooFast') : tr('tooSlow'));
    }
  } else if (game.state === 'result' && t - game.resultAt > 500) {
    game.state = 'idle';   // 상자를 닫으면 던지기 대기 상태로
  }
}

function hitCircle(t, text) {
  if (text === tr('perfect')) sfx.perfect(); else sfx.good();
  game.judgeText = text;
  game.judgeUntil = t + 550;
  game.judgeX = game.circle.x;
  game.judgeY = game.circle.y - TARGET_R - 14;
  game.circle = null;
  game.ci++;
  if (game.ci >= game.fish.circles) {
    endRound(t, true, '낚았다!!');
  } else {
    game.nextAt = t + 300;
  }
}

canvas.addEventListener('pointerdown', e => {
  startBgm();   // 첫 터치부터 음악 시작 (브라우저 규칙상 클릭이 있어야 소리가 남)
  const r = canvas.getBoundingClientRect();
  onTap(performance.now(), (e.clientX - r.left) / CANVAS_SCALE, (e.clientY - r.top) / CANVAS_SCALE);
});
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); onTap(performance.now()); }
  if (e.code === 'Escape' && game.state === 'dex') {
    if (game.dexDetail) { game.dexDetail = null; renderDexToCache(); }
    else closeDex(performance.now());
  }
  if (e.code === 'Escape' && game.state === 'achv') closeAchv();
  if (e.code === 'Escape' && game.state === 'shop') closeShop(performance.now());
  if (e.code === 'Escape' && game.state === 'stats') closeStats();
  if (e.code === 'Escape' && (game.state === 'waiting' || game.state === 'idle')) {   // Esc → 메뉴로
    game.state = 'menu';
    menuEl.classList.remove('hidden');
  }
});

// ============================================================
// 그리기 — 배경 캐시 + 움직이는 것들
// ============================================================
function renderSceneToCache() {
  sceneCanvas.width = canvas.width;
  sceneCanvas.height = canvas.height;
  sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx = sctx;                      // 붓을 캐시 캔버스로 바꿔 끼고
  const p = drawSketchbook();
  const sceneFn = save.spot === 'sea' ? drawSceneSea : save.spot === 'swamp' ? drawSceneSwamp : drawScene;
  sceneFn(p);   // 지금 펼친 페이지의 풍경
  drawSpiral();
  ctx = screenCtx;                 // 다시 화면 붓으로
}

// ---------- 도감 화면 (무거우니 열 때 캐시에 그려두고 복사) ----------
const dexCanvas = document.createElement('canvas');
const dctx = dexCanvas.getContext('2d');

// 도감 칸 배치 계산 — 그릴 때와 클릭 판정할 때 같은 값을 쓴다
// 가로 4칸 × 세로 3칸 = 한 페이지 12마리, ◀▶로 페이지 넘김
const DEX_COLS = 4, DEX_ROWS = 3, DEX_PER_PAGE = DEX_COLS * DEX_ROWS;

// 지금 열린 탭(호수/바다)의 물고기 목록
const dexList = () => FISH.filter(f => habitatOf(f) === game.dexTab);

function dexLayout() {
  const bw = Math.min(960, W * 0.94), bh = Math.min(580, H * 0.86);
  const x0 = W / 2 - bw / 2, y0 = H / 2 - bh / 2;
  const list = dexList();
  const pages = Math.ceil(list.length / DEX_PER_PAGE);
  const cw = bw / DEX_COLS, chh = (bh - 134) / DEX_ROWS;
  const start = game.dexPage * DEX_PER_PAGE;
  const cells = list.slice(start, start + DEX_PER_PAGE).map((f, i) => {
    const left = x0 + cw * (i % DEX_COLS), top = y0 + 62 + chh * Math.floor(i / DEX_COLS);
    return { f, x: left + 8, y: top + 2, w: cw - 16, h: chh - 8,
             cx: left + cw / 2, cy: top + chh / 2 - 8 };
  });
  const prev = { x: x0 + 28, y: y0 + bh - 54, w: 48, h: 36 };
  const next = { x: x0 + bw - 76, y: y0 + bh - 54, w: 48, h: 36 };
  // 호수/바다/늪지 탭 (위 가운데 나란히)
  const tabLake = { x: W / 2 - 224, y: y0 + 12, w: 144, h: 38 };
  const tabSea = { x: W / 2 - 72, y: y0 + 12, w: 144, h: 38 };
  const tabSwamp = { x: W / 2 + 80, y: y0 + 12, w: 144, h: 38 };
  return { bw, bh, x0, y0, chh, cells, pages, prev, next, tabLake, tabSea, tabSwamp };
}

function renderDexToCache() {
  dexCanvas.width = canvas.width;
  dexCanvas.height = canvas.height;
  dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx = dctx;
  // 뒤를 살짝 어둡게
  ctx.fillStyle = 'rgba(60,50,38,0.35)';
  ctx.fillRect(0, 0, W, H);
  // 도감 종이
  const L = dexLayout();
  ctx.fillStyle = '#fdf8ec';
  ctx.beginPath();
  ctx.roundRect(L.x0, L.y0, L.bw, L.bh, 16);
  ctx.fill();
  crayonPath([[L.x0, L.y0], [L.x0 + L.bw, L.y0], [L.x0 + L.bw, L.y0 + L.bh], [L.x0, L.y0 + L.bh], [L.x0, L.y0]],
    { color: C.orange, width: 5, seed: 610, wobble: 2.5 });
  // 호수/바다/늪지 도감 탭 (켜진 탭은 주황, 꺼진 탭은 회색)
  [[L.tabLake, 'lake', T[LANG].dexLakeTab], [L.tabSea, 'sea', T[LANG].dexSeaTab],
   [L.tabSwamp, 'swamp', T[LANG].dexSwampTab]].forEach(([b, tab, fmt], i) => {
    const on = game.dexTab === tab;
    const list = FISH.filter(f => habitatOf(f) === tab);
    const k = list.filter(f => save.caught[f.id] > 0).length;
    ctx.save();
    ctx.globalAlpha = on ? 0.95 : 0.5;
    ctx.fillStyle = on ? '#fff3d6' : '#ffffff';
    ctx.beginPath();
    ctx.roundRect(b.x, b.y, b.w, b.h, 10);
    ctx.fill();
    ctx.restore();
    crayonPath([[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h], [b.x, b.y]],
      { color: on ? C.orange : C.gray, width: 3.5, seed: 615 + i, wobble: 1.2, alpha: on ? 0.95 : 0.5 });
    crayonText(fmt(k, list.length), b.x + b.w / 2, b.y + 25, 17, on ? C.darkBrown : C.gray);
  });
  // 물고기 칸들 (테두리 네모 + 그림)
  L.cells.forEach((cell, i) => {
    const { f, cx, cy } = cell;
    const n = save.caught[f.id] || 0;
    // 칸 테두리: 잡은 칸은 주황, 아직인 칸은 회색
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.roundRect(cell.x, cell.y, cell.w, cell.h, 10);
    ctx.fill();
    ctx.restore();
    crayonPath([[cell.x, cell.y], [cell.x + cell.w, cell.y], [cell.x + cell.w, cell.y + cell.h], [cell.x, cell.y + cell.h], [cell.x, cell.y]],
      { color: n > 0 ? C.orange : C.gray, width: 3.5, seed: 611 + i + game.dexPage * 12, wobble: 1.5, alpha: n > 0 ? 0.95 : 0.6 });
    if (n > 0) {
      ctx.save();
      ctx.translate(cx, cy - 10);
      ctx.scale(0.78, 0.78);
      ctx.translate(-cx, -(cy - 10));
      drawFish(f, cx, cy - 10);
      ctx.restore();
      crayonText(LX(f.name), cx, cy + L.chh / 2 - 30, 15, C.darkBrown);
      crayonText('×' + n, cx, cy + L.chh / 2 - 12, 14, C.gray);
    } else {
      crayonText('?', cx, cy + 4, 44, C.gray);
      crayonText('???', cx, cy + L.chh / 2 - 30, 15, C.gray);
    }
  });
  crayonText(tr('dexClose'), W / 2, L.y0 + L.bh - 62, 14, C.gray);
  // 페이지 넘김 (◀ 페이지 ▶)
  if (L.pages > 1) {
    [[L.prev, game.dexPage > 0, -1], [L.next, game.dexPage < L.pages - 1, 1]].forEach(([b, on, dir], i) => {
      crayonPath([[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h], [b.x, b.y]],
        { color: on ? C.brown : C.gray, width: 3, seed: 1101 + i, wobble: 1, alpha: on ? 0.9 : 0.35 });
      const mx = b.x + b.w / 2, my = b.y + b.h / 2;
      crayonPath([[mx - dir * 6, my - 8], [mx + dir * 6, my], [mx - dir * 6, my + 8]],
        { color: on ? C.darkBrown : C.gray, width: 3.5, seed: 1103 + i, wobble: 0.5, alpha: on ? 1 : 0.4 });
    });
    crayonText(`${game.dexPage + 1} / ${L.pages}`, W / 2, L.y0 + L.bh - 30, 17, C.darkBrown);
  }

  // 물고기 상세 카드 (진짜 도감처럼: 큰 그림 + 잡은 횟수 + 개그 모음)
  if (game.dexDetail) {
    const f = game.dexDetail, n = save.caught[f.id] || 0;
    ctx.fillStyle = 'rgba(60,50,38,0.3)';
    ctx.fillRect(0, 0, W, H);
    const dw = Math.min(560, W * 0.82), dh = 302;
    const dx = W / 2 - dw / 2, dy = H / 2 - dh / 2;
    ctx.fillStyle = '#fffdf2';
    ctx.beginPath();
    ctx.roundRect(dx, dy, dw, dh, 16);
    ctx.fill();
    crayonPath([[dx, dy], [dx + dw, dy], [dx + dw, dy + dh], [dx, dy + dh], [dx, dy]],
      { color: C.orange, width: 5, seed: 630, wobble: 2.5 });
    ctx.save();
    ctx.translate(W / 2, dy + 88);
    ctx.scale(1.25, 1.25);
    ctx.translate(-W / 2, -(dy + 88));
    drawFish(f, W / 2, dy + 88);
    ctx.restore();
    crayonText(LX(f.name), W / 2, dy + 172, 28, C.darkBrown);
    crayonText(T[LANG].dexCount(n), W / 2, dy + 204, 18, C.redDark);
    LX(f.gags).forEach((g, i) => {
      crayonText(`“${g}”`, W / 2, dy + 236 + i * 26, 16, C.deepBlue);
    });
  }
  ctx = screenCtx;
}

// ---------- 도전과제 화면 ----------
const achvCanvas = document.createElement('canvas');
const actx = achvCanvas.getContext('2d');

function renderAchvToCache() {
  achvCanvas.width = canvas.width;
  achvCanvas.height = canvas.height;
  actx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx = actx;
  ctx.fillStyle = 'rgba(60,50,38,0.35)';
  ctx.fillRect(0, 0, W, H);
  const bw = Math.min(980, W * 0.95), bh = Math.min(590, H * 0.87);
  const x0 = W / 2 - bw / 2, y0 = H / 2 - bh / 2;
  ctx.fillStyle = '#fdf8ec';
  ctx.beginPath();
  ctx.roundRect(x0, y0, bw, bh, 16);
  ctx.fill();
  crayonPath([[x0, y0], [x0 + bw, y0], [x0 + bw, y0 + bh], [x0, y0 + bh], [x0, y0]],
    { color: C.orange, width: 5, seed: 650, wobble: 2.5 });
  crayonText(T[LANG].achvTitle(achievedCount(), ACHV.length), W / 2, y0 + 40, 25, C.darkBrown);

  // 2열 그리드 고정 — 가로는 안 늘리고, 12개 넘으면 세로로 페이지를 넘긴다 (◀▶)
  const pages = Math.ceil(ACHV.length / ACHV_PER_PAGE);
  const start = game.achvPage * ACHV_PER_PAGE;
  const cellW = (bw - 60) / 2;
  const cellH = Math.min(84, (bh - 140) / (ACHV_PER_PAGE / 2));
  ACHV.slice(start, start + ACHV_PER_PAGE).forEach((a, i) => {
    const gi = start + i;
    const cx0 = x0 + 20 + (i % 2) * (cellW + 20);
    const cy0 = y0 + 58 + Math.floor(i / 2) * cellH;
    const p = achvProgress(a);
    const done = save.achieved[a.id] || p.done;
    crayonPath([[cx0, cy0], [cx0 + cellW, cy0], [cx0 + cellW, cy0 + cellH - 8], [cx0, cy0 + cellH - 8], [cx0, cy0]],
      { color: done ? C.orange : C.gray, width: 3, seed: 651 + gi, wobble: 1.2, alpha: done ? 0.95 : 0.55 });
    crayonText(LX(a.name), cx0 + 14, cy0 + 23, 17, done ? C.redDark : C.darkBrown, 'left');
    drawCoins(cx0 + cellW - 16, cy0 + cellH - 18, 13, a.coins);   // 보상 코인 (오른쪽 아래)
    crayonText(LX(a.desc), cx0 + 14, cy0 + 43, 12, C.gray, 'left');
    const progressText = p.parts.map(pp => `${pp.label} ${pp.have}/${pp.need}`).join(' · ');
    crayonText(progressText, cx0 + 14, cy0 + 61, 12, done ? C.redDark : C.deepBlue, 'left');
    if (done) {
      // 달성 도장!
      const sx = cx0 + cellW - 46, sy = cy0 + cellH / 2 - 5;
      crayonPath(ellipsePts(sx, sy, 30, 19, 18),
        { color: C.redDark, width: 3, seed: 680 + gi, wobble: 1.5 });
      crayonText(tr('achvDone'), sx, sy + 5, 14, C.redDark);
    }
  });
  // 페이지 넘김 (◀ 페이지 ▶) — 도감과 같은 방식
  if (pages > 1) {
    const nav = achvNavRects();
    [[nav.prev, game.achvPage > 0, -1], [nav.next, game.achvPage < pages - 1, 1]].forEach(([b, on, dir], i) => {
      crayonPath([[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h], [b.x, b.y]],
        { color: on ? C.brown : C.gray, width: 3, seed: 1121 + i, wobble: 1, alpha: on ? 0.9 : 0.35 });
      const mx = b.x + b.w / 2, my = b.y + b.h / 2;
      crayonPath([[mx - dir * 6, my - 8], [mx + dir * 6, my], [mx - dir * 6, my + 8]],
        { color: on ? C.darkBrown : C.gray, width: 3.5, seed: 1123 + i, wobble: 0.5, alpha: on ? 1 : 0.4 });
    });
    crayonText(`${game.achvPage + 1} / ${pages}`, W / 2, y0 + bh - 30, 16, C.darkBrown);
  }
  crayonText(tr('achvClose'), W / 2, y0 + bh - 58, 13, C.gray);
  ctx = screenCtx;
}

// 도전과제 페이지 화살표 위치 (그릴 때와 클릭 판정할 때 같은 값)
function achvNavRects() {
  const bw = Math.min(980, W * 0.95), bh = Math.min(590, H * 0.87);
  const x0 = W / 2 - bw / 2, y0 = H / 2 - bh / 2;
  return {
    prev: { x: x0 + 28, y: y0 + bh - 54, w: 48, h: 36 },
    next: { x: x0 + bw - 76, y: y0 + bh - 54, w: 48, h: 36 },
  };
}

function openAchv() {
  game.achvPage = 0;
  game.state = 'achv';
  menuEl.classList.add('hidden');
  renderAchvToCache();
}

function closeAchv() {
  game.state = 'menu';
  menuEl.classList.remove('hidden');
}

// ---------- 상점 화면 (낚싯대 업그레이드) ----------
const shopCanvas = document.createElement('canvas');
const shctx = shopCanvas.getContext('2d');

function shopNavRects() {
  const bw = Math.min(680, W * 0.92), bh = Math.min(660, H * 0.92);
  const x0 = W / 2 - bw / 2, y0 = H / 2 - bh / 2;
  return {
    prev: { x: x0 + 24, y: y0 + bh - 52, w: 48, h: 36 },
    next: { x: x0 + bw - 72, y: y0 + bh - 52, w: 48, h: 36 },
  };
}

function shopLayout() {
  const bw = Math.min(680, W * 0.92), bh = Math.min(660, H * 0.92);
  const x0 = W / 2 - bw / 2, y0 = H / 2 - bh / 2;
  const rowH = (bh - 208) / (RODS.length + BAITS.length);
  const rows = RODS.map((r, i) => ({
    r, i, x: x0 + 22, y: y0 + 66 + rowH * i, w: bw - 44, h: rowH - 10,
  }));
  const by0 = y0 + 66 + rowH * RODS.length + 36;
  const baits = BAITS.map((b, i) => ({
    b, i, x: x0 + 22, y: by0 + rowH * i, w: bw - 44, h: rowH - 10,
  }));
  // 2페이지(꾸미기): 모자들은 낚싯대 자리와 같은 칸을 쓴다
  const hats = HATS.map((ht, i) => ({
    ht, i, x: x0 + 22, y: y0 + 66 + (rowH + 14) * i, w: bw - 44, h: rowH,
  }));
  return { bw, bh, x0, y0, rows, baits, hats, baitTitleY: by0 - 12 };
}

// 코인 표시 (노란 동전 + 개수) — x가 오른쪽 끝, 오른쪽 정렬
function drawCoins(x, y, size, n = save.coins || 0) {
  ctx.save();
  ctx.font = `700 ${size}px "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
  const w = ctx.measureText(String(n)).width;
  ctx.restore();
  crayonText(String(n), x, y, size, C.darkBrown, 'right');
  const ccx = x - w - 15, ccy = y - size * 0.32;
  scribbleFill(ellipseRows(ccx, ccy, 7, 7, 4), { color: C.yellow, seed: 691, alpha: 0.85, width: 4 });
  crayonPath(ellipsePts(ccx, ccy, 8.5, 8.5, 12), { color: C.orange, width: 2.5, seed: 692, wobble: 0.7 });
}

// 기다리는 동안 지나가는 지역 친구! (호수 잠자리 · 바다 갈매기 · 늪지 반딧불)
function spawnCritter(t) {
  const spot = save.spot || 'lake';
  const fromLeft = Math.random() < 0.5;
  game.critter = {
    type: spot === 'sea' ? 'gull' : spot === 'swamp' ? 'firefly' : 'dragonfly',
    born: t,
    x0: fromLeft ? -40 : W + 40,
    vx: (fromLeft ? 1 : -1) * (spot === 'swamp' ? 32 : spot === 'sea' ? 95 : 62) / 1000,
    y0: SPIRAL_H + 90 + Math.random() * 150,
    seed: Math.floor(Math.random() * 100),
    fleeAt: 0,
  };
}

function drawCritter(cr, t) {
  const x = cr.x, y = cr.y;
  if (cr.type === 'dragonfly') {        // 빨간 잠자리 (날개 파닥파닥)
    crayonPath([[x - 10, y], [x + 12, y]], { color: C.red, width: 3.5, seed: 2301 + cr.seed % 7, wobble: 0.5 });
    crayonPath(ellipsePts(x - 2, y - 6, 8, 3, 8),
      { color: C.skyBlue, width: 2, seed: 2302, wobble: 0.5, alpha: 0.5 + 0.4 * Math.sin(t / 40) });
    crayonPath(ellipsePts(x + 4, y - 6, 8, 3, 8),
      { color: C.skyBlue, width: 2, seed: 2303, wobble: 0.5, alpha: 0.5 + 0.4 * Math.cos(t / 40) });
    crayonPath(ellipsePts(x - 12, y - 1, 2.5, 2.5, 6), { color: C.red, width: 2.5, seed: 2304, wobble: 0.3, alpha: 1 });
  } else if (cr.type === 'gull') {      // 갈매기 (날갯짓)
    const g = 14, f = Math.sin(t / 120) * 4;
    crayonPath([[x - g, y], [x - g / 2, y - 6 - f], [x, y], [x + g / 2, y - 6 - f], [x + g, y]],
      { color: C.navy, width: 2.8, seed: 2306, wobble: 0.8 });
  } else {                              // 반딧불 (은은하게 깜빡)
    const pulse = 0.5 + 0.5 * Math.sin(t / 220);
    crayonPath(ellipsePts(x, y, 3, 3, 6), { color: C.yellow, width: 3, seed: 2307, wobble: 0.3, alpha: 1 });
    crayonPath(ellipsePts(x, y, 7 + pulse * 4, 7 + pulse * 4, 10),
      { color: C.yellow, width: 1.5, seed: 2308, wobble: 0.5, alpha: 0.35 * pulse + 0.1 });
  }
}

// 일시정지 버튼 (⏸ 모양 크레파스 막대 두 개)
function drawPauseBtn() {
  const b = pauseBtnRect();
  ctx.save();
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = '#fdf8ec';
  ctx.beginPath();
  ctx.roundRect(b.x, b.y, b.w, b.h, 10);
  ctx.fill();
  ctx.restore();
  crayonPath([[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h], [b.x, b.y]],
    { color: C.brown, width: 3, seed: 1801, wobble: 1 });
  crayonPath([[b.x + 14, b.y + 11], [b.x + 14, b.y + 27]], { color: C.darkBrown, width: 4, seed: 1802, wobble: 0.4 });
  crayonPath([[b.x + 24, b.y + 11], [b.x + 24, b.y + 27]], { color: C.darkBrown, width: 4, seed: 1803, wobble: 0.4 });
}

// 낚싯대 그림 (상점용 작은 아이콘)
function drawRodIcon(i, cx, cy, len) {
  const x1 = cx - len / 2, y1 = cy + len * 0.28, x2 = cx + len / 2, y2 = cy - len * 0.28;
  if (i === 0) {          // 나뭇가지: 갈색 + 잔가지 하나
    crayonPath([[x1, y1], [x2, y2]], { color: C.darkBrown, width: 5, seed: 771, wobble: 2.5 });
    crayonPath([[cx, cy], [cx + 8, cy - 14]], { color: C.brown, width: 3, seed: 772, wobble: 1.5 });
  } else if (i === 1) {   // 연필: 주황 몸통 + 까만 심 + 분홍 지우개
    crayonPath([[x1, y1], [x2, y2]], { color: C.orange, width: 6, seed: 773, wobble: 1 });
    crayonPath([[x2 - 6, y2 + 4], [x2, y2]], { color: C.darkBrown, width: 5, seed: 774, wobble: 0.5 });
    crayonPath(ellipsePts(x1 + 2, y1 - 1, 5, 5, 8), { color: C.pink, width: 4, seed: 775, wobble: 0.5, alpha: 1 });
  } else if (i === 2) {   // 붓: 나무 손잡이 + 파란 물감 붓끝
    crayonPath([[x1, y1], [x2 - 12, y2 + 7]], { color: C.brown, width: 5, seed: 776, wobble: 1 });
    crayonPath([[x2 - 12, y2 + 7], [x2, y2]], { color: C.deepBlue, width: 7, seed: 777, wobble: 1.5 });
  } else {                // 황금 크레파스: 굵은 노랑 + 반짝반짝
    crayonPath([[x1, y1], [x2, y2]], { color: C.yellow, width: 8, seed: 778, wobble: 1 });
    crayonPath([[x1, y1], [x2, y2]], { color: C.orange, width: 2.5, seed: 779, wobble: 1, alpha: 0.7 });
    [[x2 + 7, y2 - 6], [cx + 2, cy - 13], [x1 - 5, y1 - 11]].forEach(([gx, gy], k) => {
      crayonPath([[gx - 4, gy], [gx + 4, gy]], { color: C.orange, width: 2, seed: 780 + k, wobble: 0.3, alpha: 1 });
      crayonPath([[gx, gy - 4], [gx, gy + 4]], { color: C.orange, width: 2, seed: 785 + k, wobble: 0.3, alpha: 1 });
    });
  }
}

function renderShopToCache() {
  shopCanvas.width = canvas.width;
  shopCanvas.height = canvas.height;
  shctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx = shctx;
  ctx.fillStyle = 'rgba(60,50,38,0.35)';
  ctx.fillRect(0, 0, W, H);
  const L = shopLayout();
  ctx.fillStyle = '#fdf8ec';
  ctx.beginPath();
  ctx.roundRect(L.x0, L.y0, L.bw, L.bh, 16);
  ctx.fill();
  crayonPath([[L.x0, L.y0], [L.x0 + L.bw, L.y0], [L.x0 + L.bw, L.y0 + L.bh], [L.x0, L.y0 + L.bh], [L.x0, L.y0]],
    { color: C.orange, width: 5, seed: 790, wobble: 2.5 });
  crayonText(game.shopPage === 1 ? tr('closet') : tr('shopTitle'), W / 2, L.y0 + 42, 26, C.darkBrown);
  drawCoins(L.x0 + L.bw - 28, L.y0 + 46, 20);   // 내 코인 (오른쪽 위)

  if (game.shopPage === 1) {
    // ---- 2페이지: 꾸미기 (모자) ----
    L.hats.forEach(row => {
      const { ht, i } = row;
      const owned = ht.price === 0 || save.hats[ht.id];
      const wearing = save.hat === ht.id;
      ctx.save();
      ctx.globalAlpha = 0.65;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(row.x, row.y, row.w, row.h, 10);
      ctx.fill();
      ctx.restore();
      crayonPath([[row.x, row.y], [row.x + row.w, row.y], [row.x + row.w, row.y + row.h], [row.x, row.y + row.h], [row.x, row.y]],
        { color: wearing ? C.orange : owned ? C.brown : C.gray,
          width: 3, seed: 1701 + i, wobble: 1.2, alpha: wearing ? 0.95 : owned ? 0.85 : 0.5 });
      drawHatIcon(ht.id, row.x + 52, row.y + row.h / 2);
      crayonText(LX(ht.name), row.x + 104, row.y + row.h / 2 - 5, 17, owned || wearing ? C.darkBrown : C.gray, 'left');
      crayonText(LX(ht.desc), row.x + 104, row.y + row.h / 2 + 17, 12.5, C.gray, 'left');
      const rx = row.x + row.w - 20;
      if (wearing) {
        crayonPath(ellipsePts(rx - 42, row.y + row.h / 2, 42, 18, 18),
          { color: C.redDark, width: 2.5, seed: 1711 + i, wobble: 1.2 });
        crayonText(tr('using'), rx - 42, row.y + row.h / 2 + 5, 14, C.redDark);
      } else if (owned) {
        crayonText(tr('equip'), rx, row.y + row.h / 2 + 5, 15, C.redDark, 'right');
      } else {
        drawCoins(rx, row.y + row.h / 2 - 3, 16, ht.price);
        crayonText(tr('buy'), rx, row.y + row.h / 2 + 21, 14,
          (save.coins || 0) >= ht.price ? C.redDark : C.gray, 'right');
      }
    });
    // 페이지 화살표 + 닫기 안내
    const nav = shopNavRects();
    [[nav.prev, game.shopPage > 0, -1], [nav.next, game.shopPage < 1, 1]].forEach(([b, on, dir], i) => {
      crayonPath([[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h], [b.x, b.y]],
        { color: on ? C.brown : C.gray, width: 3, seed: 1721 + i, wobble: 1, alpha: on ? 0.9 : 0.35 });
      const mx = b.x + b.w / 2, my = b.y + b.h / 2;
      crayonPath([[mx - dir * 6, my - 8], [mx + dir * 6, my], [mx - dir * 6, my + 8]],
        { color: on ? C.darkBrown : C.gray, width: 3.5, seed: 1723 + i, wobble: 0.5, alpha: on ? 1 : 0.4 });
    });
    if (game.shopMsg) crayonText(game.shopMsg, W / 2, L.y0 + L.bh - 48, 16, C.redDark);
    crayonText(tr('shopClose'), W / 2, L.y0 + L.bh - 20, 13, C.gray);
    ctx = screenCtx;
    return;
  }

  L.rows.forEach(row => {
    const { r, i } = row;
    const owned = !!save.rods[i], isNext = !owned && !!save.rods[i - 1];
    ctx.save();
    ctx.globalAlpha = 0.65;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.roundRect(row.x, row.y, row.w, row.h, 10);
    ctx.fill();
    ctx.restore();
    crayonPath([[row.x, row.y], [row.x + row.w, row.y], [row.x + row.w, row.y + row.h], [row.x, row.y + row.h], [row.x, row.y]],
      { color: i === save.rod ? C.orange : (owned || isNext) ? C.brown : C.gray,
        width: 3, seed: 741 + i, wobble: 1.2, alpha: (owned || isNext) ? 0.9 : 0.45 });
    drawRodIcon(i, row.x + 52, row.y + row.h / 2, 62);
    crayonText(LX(r.name), row.x + 104, row.y + row.h / 2 - 5, 17,
      (owned || isNext) ? C.darkBrown : C.gray, 'left');
    crayonText(LX(r.desc), row.x + 104, row.y + row.h / 2 + 17, 12.5, C.gray, 'left');
    // 오른쪽: 사용 중 도장 / 보유 / 가격+구매
    const rx = row.x + row.w - 20;
    if (i === save.rod) {
      crayonPath(ellipsePts(rx - 42, row.y + row.h / 2, 42, 18, 18),
        { color: C.redDark, width: 2.5, seed: 795 + i, wobble: 1.2 });
      crayonText(tr('using'), rx - 42, row.y + row.h / 2 + 5, 14, C.redDark);
    } else if (owned) {
      crayonText(tr('equip'), rx, row.y + row.h / 2 + 5, 15, C.redDark, 'right');
    } else {
      drawCoins(rx, row.y + row.h / 2 - 3, 16, r.price);
      crayonText(isNext ? tr('buy') : '···', rx, row.y + row.h / 2 + 21, 14,
        isNext ? ((save.coins || 0) >= r.price ? C.redDark : C.gray) : C.gray, 'right');
    }
  });

  // --- 미끼 코너 ---
  crayonText(tr('baitTitle'), L.x0 + 30, L.baitTitleY, 15, C.darkBrown, 'left');
  L.baits.forEach(row => {
    const { b, i } = row;
    const owned = b.price === 0 ? 1 : (save.baits[b.id] || 0);
    const selected = save.bait === b.id;
    ctx.save();
    ctx.globalAlpha = 0.65;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.roundRect(row.x, row.y, row.w, row.h, 10);
    ctx.fill();
    ctx.restore();
    crayonPath([[row.x, row.y], [row.x + row.w, row.y], [row.x + row.w, row.y + row.h], [row.x, row.y + row.h], [row.x, row.y]],
      { color: selected ? C.orange : owned > 0 ? C.brown : C.gray,
        width: 3, seed: 811 + i, wobble: 1.2, alpha: selected ? 0.95 : owned > 0 ? 0.8 : 0.45 });
    drawBaitIcon(i, row.x + 52, row.y + row.h / 2);
    crayonText(LX(b.name), row.x + 104, row.y + row.h / 2 - 5, 17,
      owned > 0 || selected ? C.darkBrown : C.gray, 'left');
    crayonText(LX(b.desc), row.x + 104, row.y + row.h / 2 + 17, 12.5, C.gray, 'left');
    const rx = row.x + row.w - 20;
    if (selected) {
      crayonPath(ellipsePts(rx - 215, row.y + row.h / 2, 40, 16, 18),
        { color: C.redDark, width: 2.5, seed: 821 + i, wobble: 1.2 });
      crayonText(tr('using'), rx - 215, row.y + row.h / 2 + 4, 13, C.redDark);
    }
    if (b.price > 0) {
      crayonText('×' + (save.baits[b.id] || 0), rx - 130, row.y + row.h / 2 + 5, 15,
        (save.baits[b.id] || 0) > 0 ? C.darkBrown : C.gray, 'right');
      drawCoins(rx, row.y + row.h / 2 - 3, 16, b.price);
      crayonText(tr('buy'), rx, row.y + row.h / 2 + 21, 14,
        (save.coins || 0) >= b.price ? C.redDark : C.gray, 'right');
    } else {
      crayonText(tr('free'), rx, row.y + row.h / 2 + 5, 14, C.gray, 'right');
    }
  });

  // 페이지 화살표 (▶ 누르면 꾸미기 페이지!)
  const nav = shopNavRects();
  [[nav.prev, false, -1], [nav.next, true, 1]].forEach(([b, on, dir], i) => {
    crayonPath([[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h], [b.x, b.y]],
      { color: on ? C.brown : C.gray, width: 3, seed: 1725 + i, wobble: 1, alpha: on ? 0.9 : 0.35 });
    const mx = b.x + b.w / 2, my = b.y + b.h / 2;
    crayonPath([[mx - dir * 6, my - 8], [mx + dir * 6, my], [mx - dir * 6, my + 8]],
      { color: on ? C.darkBrown : C.gray, width: 3.5, seed: 1727 + i, wobble: 0.5, alpha: on ? 1 : 0.4 });
  });
  if (game.shopMsg) crayonText(game.shopMsg, W / 2, L.y0 + L.bh - 48, 16, C.redDark);
  crayonText(tr('shopClose'), W / 2, L.y0 + L.bh - 20, 13, C.gray);
  ctx = screenCtx;
}

// 모자 그림 (상점용 작은 아이콘)
function drawHatIcon(id, cx, cy) {
  if (id === 'straw') {          // 밀짚모자: 넓은 챙 + 봉긋 지붕
    scribbleFill(ellipseRows(cx, cy - 4, 12, 8, 4), { color: C.yellow, seed: 1731, alpha: 0.8, width: 4 });
    crayonPath(ellipsePts(cx, cy + 4, 22, 6, 18), { color: C.brown, width: 3, seed: 1732, wobble: 0.8 });
    crayonPath(ellipsePts(cx, cy - 4, 12, 9, 14), { color: C.brown, width: 3, seed: 1733, wobble: 0.8 });
  } else if (id === 'wizard') {  // 마법사 고깔: 파란 세모 + 별
    crayonPath([[cx - 14, cy + 8], [cx, cy - 16], [cx + 14, cy + 8], [cx - 14, cy + 8]],
      { color: C.deepBlue, width: 3.5, seed: 1734, wobble: 1 });
    scribbleFill(ellipseRows(cx, cy + 1, 8, 6, 4), { color: C.skyBlue, seed: 1735, alpha: 0.4, width: 4 });
    [[cx - 4, cy - 2], [cx + 5, cy + 3]].forEach(([gx, gy], k) => {
      crayonPath([[gx - 3, gy], [gx + 3, gy]], { color: C.yellow, width: 2, seed: 1736 + k, wobble: 0.3, alpha: 1 });
      crayonPath([[gx, gy - 3], [gx, gy + 3]], { color: C.yellow, width: 2, seed: 1738 + k, wobble: 0.3, alpha: 1 });
    });
  } else if (id === 'crown') {   // 황금 왕관: 지그재그 + 보석
    scribbleFill(ellipseRows(cx, cy + 3, 13, 5, 4), { color: C.yellow, seed: 1741, alpha: 0.85, width: 4 });
    crayonPath([[cx - 15, cy + 8], [cx - 15, cy - 4], [cx - 8, cy + 2], [cx, cy - 10], [cx + 8, cy + 2], [cx + 15, cy - 4], [cx + 15, cy + 8], [cx - 15, cy + 8]],
      { color: C.orange, width: 3, seed: 1742, wobble: 0.8 });
    crayonPath(ellipsePts(cx, cy + 3, 2.5, 2.5, 8), { color: C.red, width: 2.5, seed: 1743, wobble: 0.3, alpha: 1 });
  } else {                       // 기본 주황 야구모자
    const capArc = [];
    for (let i = 0; i <= 12; i++) {
      const a = Math.PI - (i / 12) * Math.PI;
      capArc.push([cx + Math.cos(a) * 12, cy + 2 - Math.sin(a) * 10]);
    }
    scribbleFill(ellipseRows(cx, cy - 2, 9, 6, 4), { color: C.orange, seed: 1744, alpha: 0.6, width: 4 });
    crayonPath(capArc, { color: C.orange, width: 3, seed: 1745, wobble: 0.8 });
    crayonPath([[cx + 10, cy + 2], [cx + 20, cy + 4]], { color: C.orange, width: 3, seed: 1746, wobble: 0.5 });
  }
}

// 미끼 그림 (상점용 작은 아이콘)
function drawBaitIcon(i, cx, cy) {
  if (i === 0) {          // 빵 부스러기: 갈색 부스러기들
    [[-10, -4], [2, -9], [10, 1], [-3, 6], [8, 9]].forEach(([dx, dy], k) => {
      crayonPath(ellipsePts(cx + dx, cy + dy, 3.5 + (k % 2), 3 + (k % 2), 8),
        { color: k % 2 ? C.brown : C.orange, width: 3, seed: 831 + k, wobble: 0.5, alpha: 0.95 });
    });
  } else if (i === 1) {   // 반짝이풀: 분홍 방울 + 반짝반짝
    crayonPath(ellipsePts(cx - 4, cy + 2, 7, 9, 12), { color: C.pink, width: 3.5, seed: 841, wobble: 0.8 });
    [[cx + 9, cy - 8], [cx + 13, cy + 5]].forEach(([gx, gy], k) => {
      crayonPath([[gx - 4, gy], [gx + 4, gy]], { color: k ? C.skyBlue : C.yellow, width: 2, seed: 842 + k, wobble: 0.3, alpha: 1 });
      crayonPath([[gx, gy - 4], [gx, gy + 4]], { color: k ? C.skyBlue : C.yellow, width: 2, seed: 845 + k, wobble: 0.3, alpha: 1 });
    });
  } else {                // 황금 물감: 노란 물감 방울 + 반짝
    scribbleFill(ellipseRows(cx - 2, cy + 3, 7, 8, 4), { color: C.yellow, seed: 851, alpha: 0.8, width: 4 });
    crayonPath(ellipsePts(cx - 2, cy + 3, 8, 9, 12), { color: C.orange, width: 3, seed: 852, wobble: 0.8 });
    crayonPath([[cx - 2, cy - 12], [cx - 5, cy - 5]], { color: C.orange, width: 3, seed: 853, wobble: 0.5 });
    crayonPath([[cx + 11, cy - 9], [cx + 15, cy - 9]], { color: C.orange, width: 2, seed: 854, wobble: 0.3, alpha: 1 });
    crayonPath([[cx + 13, cy - 11], [cx + 13, cy - 7]], { color: C.orange, width: 2, seed: 855, wobble: 0.3, alpha: 1 });
  }
}

// ---------- 내 기록 화면 (요약 + 플레이타임 + TOP 5 + 전체 순위) ----------
const statsCanvas = document.createElement('canvas');
const stctx = statsCanvas.getContext('2d');
const RANK_PER_PAGE = 30;   // 순위 페이지: 2열 × 15줄

function statsPages() { return 1 + Math.ceil(FISH.length / RANK_PER_PAGE); }

function fmtPlay(ms) {
  // 초까지 정확하게! (예: 2시간 13분 42초)
  const s = Math.floor(ms / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60);
  if (LANG === 'ko') {
    if (h > 0) return `${h}시간 ${m % 60}분 ${s % 60}초`;
    if (m > 0) return `${m}분 ${s % 60}초`;
    return `${s}초`;
  }
  if (LANG === 'ja') {
    if (h > 0) return `${h}時間${m % 60}分${s % 60}秒`;
    if (m > 0) return `${m}分${s % 60}秒`;
    return `${s}秒`;
  }
  if (LANG === 'zh') {
    if (h > 0) return `${h}小时${m % 60}分${s % 60}秒`;
    if (m > 0) return `${m}分${s % 60}秒`;
    return `${s}秒`;
  }
  if (h > 0) return `${h}h ${m % 60}m ${s % 60}s`;
  if (m > 0) return `${m}m ${s % 60}s`;
  return `${s}s`;
}

function renderStatsToCache() {
  statsCanvas.width = canvas.width;
  statsCanvas.height = canvas.height;
  stctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx = stctx;
  ctx.fillStyle = 'rgba(60,50,38,0.35)';
  ctx.fillRect(0, 0, W, H);
  const bw = Math.min(980, W * 0.95), bh = Math.min(590, H * 0.87);
  const x0 = W / 2 - bw / 2, y0 = H / 2 - bh / 2;
  ctx.fillStyle = '#fdf8ec';
  ctx.beginPath();
  ctx.roundRect(x0, y0, bw, bh, 16);
  ctx.fill();
  crayonPath([[x0, y0], [x0 + bw, y0], [x0 + bw, y0 + bh], [x0, y0 + bh], [x0, y0]],
    { color: C.orange, width: 5, seed: 1601, wobble: 2.5 });

  if (game.statsPage === 0) {
    // ---- 1페이지: 요약 + TOP 5 (가운데 구분선으로 확실히 나눔) ----
    crayonText(tr('stats'), W / 2, y0 + 40, 25, C.darkBrown);
    const dvx = x0 + bw * 0.56;
    crayonPath([[dvx, y0 + 72], [dvx, y0 + bh - 72]],
      { color: C.brown, width: 3, seed: 1605, wobble: 2.5, alpha: 0.45 });
    crayonText(tr('summary'), x0 + bw * 0.28, y0 + 92, 19, C.redDark);
    const c = totalCaught(), m = save.missed || 0;
    const rate = (c + m) > 0 ? Math.round(c / (c + m) * 100) : 0;
    const lines = [
      [T[LANG].stPlay(fmtPlay(save.playMs || 0)), C.redDark, 19],
      [tr('stPlayNote'), C.gray, 12.5],
      [T[LANG].stCatch(c, m, rate), C.darkBrown, 17],
      [T[LANG].stPerfect(save.perfect || 0), C.darkBrown, 17],
      [T[LANG].stCoins(save.coins || 0, save.coinEarned || 0), C.darkBrown, 17],
      [T[LANG].stDex(kindsIn('lake'), kindsIn('sea'), kindsIn('swamp')), C.darkBrown, 17],
      [T[LANG].stAchv(achievedCount(), ACHV.length), C.darkBrown, 17],
      [T[LANG].stFlips(save.pageFlips || 0, save.baitUsed || 0), C.darkBrown, 17],
    ];
    let ly = y0 + 136;
    lines.forEach(([txt, col, size]) => {
      crayonText(txt, x0 + 44, ly, size, col, 'left');
      ly += size < 14 ? 26 : 42;
    });
    // TOP 5 (물고기 그림과 함께!)
    const ranked = FISH.map(f => ({ f, n: save.caught[f.id] || 0 }))
      .sort((a, b) => b.n - a.n).slice(0, 5);
    const tx = x0 + bw * 0.62;
    crayonText(tr('top5'), tx + bw * 0.16, y0 + 92, 19, C.redDark);
    ranked.forEach(({ f, n }, i) => {
      const ry = y0 + 140 + i * 82;
      if (n > 0) {
        ctx.save();
        ctx.translate(tx + 44, ry);
        ctx.scale(0.48, 0.48);
        ctx.translate(-(tx + 44), -ry);
        drawFish(f, tx + 44, ry);
        ctx.restore();
        crayonText(`${i + 1}. ${LX(f.name)}`, tx + 110, ry - 2, 16, i === 0 ? C.redDark : C.darkBrown, 'left');
        crayonText('×' + n, tx + 110, ry + 20, 15, C.deepBlue, 'left');
      } else {
        crayonText(`${i + 1}. ???`, tx + 110, ry + 4, 16, C.gray, 'left');
      }
    });
  } else {
    // ---- 2페이지부터: 전체 순위 (1등부터 끝까지!) ----
    crayonText(tr('rankAll'), W / 2, y0 + 40, 22, C.darkBrown);
    const ranked = FISH.map(f => ({ f, n: save.caught[f.id] || 0 })).sort((a, b) => b.n - a.n);
    const start = (game.statsPage - 1) * RANK_PER_PAGE;
    ranked.slice(start, start + RANK_PER_PAGE).forEach(({ f, n }, i) => {
      const col = Math.floor(i / 15), row = i % 15;
      const rx = x0 + 48 + col * (bw / 2 - 24);
      const ry = y0 + 82 + row * 29;
      const rank = start + i + 1;
      const medal = rank === 1 ? '🥇 ' : rank === 2 ? '🥈 ' : rank === 3 ? '🥉 ' : '';
      if (n > 0) {
        crayonText(`${rank}. ${medal}${LX(f.name)}`, rx, ry, 15,
          rank <= 3 ? C.redDark : C.darkBrown, 'left');
        crayonText('×' + n, rx + bw * 0.36, ry, 15, C.deepBlue, 'right');
      } else {
        crayonText(`${rank}. ???`, rx, ry, 15, C.gray, 'left');
      }
    });
  }

  // 페이지 넘김 (◀▶) — 도전과제와 같은 위치
  const nav = achvNavRects();
  [[nav.prev, game.statsPage > 0, -1], [nav.next, game.statsPage < statsPages() - 1, 1]].forEach(([b, on, dir], i) => {
    crayonPath([[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h], [b.x, b.y]],
      { color: on ? C.brown : C.gray, width: 3, seed: 1611 + i, wobble: 1, alpha: on ? 0.9 : 0.35 });
    const mx = b.x + b.w / 2, my = b.y + b.h / 2;
    crayonPath([[mx - dir * 6, my - 8], [mx + dir * 6, my], [mx - dir * 6, my + 8]],
      { color: on ? C.darkBrown : C.gray, width: 3.5, seed: 1613 + i, wobble: 0.5, alpha: on ? 1 : 0.4 });
  });
  crayonText(`${game.statsPage + 1} / ${statsPages()}`, W / 2, y0 + bh - 30, 16, C.darkBrown);
  crayonText(tr('statsClose'), W / 2, y0 + bh - 58, 13, C.gray);
  ctx = screenCtx;
}

function openStats() {
  game.statsPage = 0;
  game.state = 'stats';
  menuEl.classList.add('hidden');
  renderStatsToCache();
}

function closeStats() {
  game.state = 'menu';
  menuEl.classList.remove('hidden');
}

function openShop(from) {
  game.shopReturn = from;
  game.shopMsg = null;
  game.shopPage = 0;
  game.state = 'shop';
  if (from === 'menu') menuEl.classList.add('hidden');
  renderShopToCache();
}

function closeShop(t) {
  if (game.shopReturn === 'menu') {
    game.state = 'menu';
    menuEl.classList.remove('hidden');
  } else {
    game.state = 'idle';   // 상점을 닫으면 던지기 대기 상태로
  }
}

function openDex(from) {
  game.dexReturn = from;
  game.dexPage = 0;
  game.dexTab = save.spot || 'lake';   // 지금 낚시터의 도감부터
  game.state = 'dex';
  if (from === 'menu') menuEl.classList.add('hidden');
  renderDexToCache();
}

function closeDex(t) {
  game.dexDetail = null;
  if (game.dexReturn === 'menu') {
    game.state = 'menu';
    menuEl.classList.remove('hidden');
  } else {
    game.state = 'idle';   // 도감을 닫으면 던지기 대기 상태로
  }
}

function crayonText(str, x, y, size, color, align = 'center') {
  ctx.save();
  ctx.font = `700 ${size}px "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.globalAlpha = 0.85;
  ctx.fillText(str, x, y);
  ctx.restore();
}

// ============================================================
// 물고기 크레파스 그림들 (x,y = 중심)
// ============================================================
function fishEyeMouth(x, y, seed, color) {
  // 공용: 동그란 눈 + 웃는 입
  crayonPath(ellipsePts(x, y, 3.5, 3.5, 10),
    { color, width: 3.5, seed, wobble: 0.5, alpha: 1 });
  crayonPath([[x + 3, y + 8], [x + 8, y + 11], [x + 13, y + 8]],
    { color, width: 2.5, seed: seed + 1, wobble: 0.5 });
}

    'bookmark-arapaima': () => {  // 늪에서 제일 큰 책갈피 피라루쿠
      const s = 40;
      scribbleFill(ellipseRows(x, y, s * 1.05, s * 0.3, 6),
        { color: C.red, seed: 2111, alpha: 0.35, width: 6 });
      crayonPath([[x - s * 1.25, y - s * 0.32], [x + s * 1.05, y - s * 0.32], [x + s * 1.15, y + s * 0.32], [x - s * 1.25, y + s * 0.32], [x - s * 1.25, y - s * 0.32]],
        { color: C.redDark, width: 3.5, seed: 2112, wobble: 1 });   // 납작 길쭉 책갈피 몸
      // 비늘 격자 (책갈피 무늬)
      for (let i = 0; i < 4; i++) {
        crayonPath([[x - s * 0.9 + i * s * 0.5, y - s * 0.3], [x - s * 0.9 + i * s * 0.5, y + s * 0.3]],
          { color: C.orange, width: 2, seed: 2113 + i, wobble: 0.8, alpha: 0.8 });
      }
      // 꼬리 끝 책갈피 술(태슬)!
      crayonPath([[x + s * 1.15, y], [x + s * 1.45, y]], { color: C.yellow, width: 2.5, seed: 2118, wobble: 0.5 });
      for (let i = 0; i < 3; i++) {
        crayonPath([[x + s * 1.45, y], [x + s * 1.7, y - 8 + i * 8]],
          { color: C.yellow, width: 2, seed: 2119 + i, wobble: 1 });
      }
      fishEyeMouth(x - s * 0.9, y - s * 0.06, 2123, '#ffffff');
    },
    'doodle-imugi': () => {  // 늪의 전설 — 천 년 뒤엔 낙서용!
      const s = 36;
      const body = [];
      for (let i = 0; i <= 20; i++) {
        const t2 = i / 20;
        body.push([x - s * 1.3 + t2 * s * 2.6, y + Math.sin(t2 * Math.PI * 2.2 + 1) * s * 0.3]);
      }
      crayonPath(body, { color: C.skyBlue, width: 10, seed: 2131, wobble: 4, alpha: 0.8, passes: 2 });
      crayonPath(body, { color: C.navy, width: 3, seed: 2132, wobble: 4 });
      // 아직 자라다 만 뿔 (뭉툭!)
      crayonPath([[x - s * 1.28, y - s * 0.2], [x - s * 1.34, y - s * 0.38]],
        { color: C.brown, width: 3.5, seed: 2133, wobble: 0.8 });
      // 머리 + 수염
      crayonPath(ellipsePts(x - s * 1.25, y, s * 0.26, s * 0.2, 14),
        { color: C.navy, width: 3, seed: 2134, wobble: 1.5 });
      crayonPath([[x - s * 1.48, y + s * 0.08], [x - s * 1.75, y + s * 0.18]],
        { color: C.navy, width: 2, seed: 2135, wobble: 1.5 });
      // 물방울 (용이 되고 싶어서 하늘을 봄!)
      crayonPath(ellipsePts(x - s * 1.1, y - s * 0.5, 3, 4, 8),
        { color: C.skyBlue, width: 2.5, seed: 2136, wobble: 0.5, alpha: 0.9 });
      crayonPath(ellipsePts(x - s * 1.3, y - s * 0.12, 2.5, 2.5, 6),
        { color: '#ffffff', width: 2.5, seed: 2137, wobble: 0.3, alpha: 1 });
      crayonPath([[x + s * 1.3, y], [x + s * 1.55, y - s * 0.2], [x + s * 1.5, y + s * 0.16], [x + s * 1.3, y]],
        { color: C.navy, width: 3, seed: 2138, wobble: 1 });
    },
  };
  (d[fish.id] || d['kkobulchi'])();
}

function drawDynamic(t) {
  const home = SCENE.bobberHome, tip = SCENE.rodTip;
  if (!home) return;

  // 찌 위치: 평소엔 살랑살랑, 입질/미니게임 중엔 쑥 들어감
  let bobDip = Math.sin(t / 500) * 2.5;
  if (game.state === 'minigame') bobDip = 13;
  if (game.state === 'result' && game.result === 'catch') bobDip = -4;
  let bx = home.x, by = home.y + bobDip;
  if (game.state === 'idle') {   // 던지기 전: 찌가 낚싯대 끝에 대롱대롱
    bx = tip.x + 6;
    by = tip.y + 34;
  }
  // 던지기 연출: 찌가 낚싯대 끝에서 포물선을 그리며 날아간다 (0.55초)
  const cp = (t - (game.castAt || -99999)) / 550;
  if (game.state === 'waiting' && cp >= 0 && cp < 1) {
    const e = 1 - Math.pow(1 - cp, 2);
    bx = tip.x + (home.x - tip.x) * e;
    by = tip.y + (home.y - tip.y) * e - Math.sin(cp * Math.PI) * 46;
  } else if (game.state === 'waiting' && cp >= 1 && cp < 1.8) {
    const sp = (cp - 1) / 0.8;   // 착수 물결 (퐁당!)
    crayonPath(ellipsePts(home.x, home.y + 4, 12 + sp * 24, 4 + sp * 7, 14),
      { color: C.deepBlue, width: 2.5, seed: 229, wobble: 1.2, alpha: 0.55 * (1 - sp) + 0.1 });
  }

  // 낚싯줄 + 찌 + 물결
  crayonPath([[tip.x, tip.y], [bx, by - 6]],
    { color: C.gray, width: 2.5, seed: 222, wobble: 2 });
  crayonPath(ellipsePts(bx, by - 4, 5.5, 6.5, 14),
    { color: C.red, width: 5, seed: 224, wobble: 0.6, alpha: 1 });
  if (game.state !== 'idle') {
    crayonPath(ellipsePts(bx, by + 4, 20, 6, 18),
      { color: C.navy, width: 3, seed: 226, wobble: 1.5, alpha: 0.55 });
  }

  // 입질 순간 물튀김 (커지는 물결 두 겹)
  if (t < game.biteFxUntil) {
    const p = 1 - (game.biteFxUntil - t) / 600;
    crayonPath(ellipsePts(bx, by + 4, 24 + p * 26, 8 + p * 8, 18),
      { color: C.deepBlue, width: 3, seed: 228, wobble: 1.5, alpha: 0.5 * (1 - p) + 0.2 });
    crayonText(tr('bite'), bx, by - 34, 24, C.redDark);
  }

  // 상태별 안내와 동그라미
  // 지나가는 친구 (클릭하면 화들짝 도망!)
  if (game.critter && (game.state === 'waiting' || game.state === 'idle')) {
    const cr = game.critter;
    const age = t - cr.born;
    const flee = cr.fleeAt ? t - cr.fleeAt : 0;
    cr.x = cr.x0 + cr.vx * age + (flee ? cr.vx * 3.5 * flee : 0);
    cr.y = cr.y0 + Math.sin(age / (cr.type === 'firefly' ? 480 : 260) + cr.seed) *
      (cr.type === 'firefly' ? 34 : 12) - (flee ? flee * 0.13 : 0);
    drawCritter(cr, t);
    if (cr.x < -60 || cr.x > W + 60 || cr.y < SPIRAL_H - 20) {
      game.critter = null;
      game.critterNextAt = t + 4000 + Math.random() * 6000;   // 다음 친구는 잠시 후에
    }
  }

  // 좁은 화면(폰 가로)에선 안내 문구를 버튼 아랫줄로 내린다
  const hudY = SPIRAL_H + (W < 820 ? 66 : 40);
  if (game.state === 'waiting' || game.state === 'idle') {
    crayonText(game.state === 'idle' ? tr('castHint') : tr('waiting'), W / 2, hudY, 22,
      game.state === 'idle' ? C.redDark : C.darkBrown);
    if (game.state === 'waiting' && t < game.shushUntil) crayonText(tr('shush'), W / 2, hudY + 30, 18, C.gray);
    // 지금 끼운 미끼 (왼쪽 아래)
    const bn = BAITS.find(b => b.id === save.bait) || BAITS[0];
    const cnt = bn.price ? ` ×${save.baits[bn.id] || 0}` : '';
    crayonText(tr('baitLabel') + LX(bn.name) + cnt, 24, H - 28, 15, C.darkBrown, 'left');
    // 도감·상점·메뉴 버튼 (왼쪽 위 나란히)
    [[dexBtnRect(), tr('dex')], [shopBtnRect(), tr('shop')], [menuBtnRect(), tr('menuBtn')]].forEach(([b, label], bi) => {
      ctx.save();
      ctx.globalAlpha = 0.92;
      ctx.fillStyle = '#fdf8ec';
      ctx.beginPath();
      ctx.roundRect(b.x, b.y, b.w, b.h, 10);
      ctx.fill();
      ctx.restore();
      crayonPath([[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h], [b.x, b.y]],
        { color: C.brown, width: 3.5, seed: 601 + bi, wobble: 1.2 });
      crayonText(label, b.x + b.w / 2, b.y + 26, 17, C.darkBrown);
    });
    // 페이지 넘김 버튼 (◀ 이전 / 다음 ▶) — 끝 페이지에선 흐리게
    const si = SPOTS.indexOf(save.spot || 'lake');
    [[prevSpotRect(), tr('pagePrev'), si > 0], [nextSpotRect(), tr('pageNext'), si < SPOTS.length - 1]].forEach(([b, label, on], bi) => {
      ctx.save();
      ctx.globalAlpha = on ? 0.92 : 0.35;
      ctx.fillStyle = '#fdf8ec';
      ctx.beginPath();
      ctx.roundRect(b.x, b.y, b.w, b.h, 10);
      ctx.fill();
      ctx.restore();
      crayonPath([[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h], [b.x, b.y]],
        { color: on ? C.brown : C.gray, width: 3.5, seed: 605 + bi, wobble: 1.2, alpha: on ? 0.9 : 0.4 });
      crayonText(label, b.x + b.w / 2, b.y + 26, 16, on ? C.darkBrown : C.gray);
    });
    drawPauseBtn();
  } else if (game.state === 'minigame') {
    crayonText(tr('hint'), W / 2, hudY, 22, C.darkBrown);
    drawPauseBtn();
    if (game.circle) {
      const c = game.circle;
      const r = circleRadius(c, t);
      // 목표 원 (갈색, 얇게) + 줄어드는 원 (주황, 굵게)
      crayonPath(ellipsePts(c.x, c.y, TARGET_R, TARGET_R, 22),
        { color: C.darkBrown, width: 3.5, seed: 240 + game.ci, wobble: 1.5, alpha: 0.8 });
      const ringCol = { slippery: C.skyBlue, dash: C.redDark, picky: C.pink, legend: C.yellow,
        ghost: C.gray, zigzag: C.darkGreen, bounce: C.green, imugi: C.yellow }[game.fish.trait] || C.orange;
      const p0r = Math.min(1, (t - c.start) / c.dur);
      const ghosty = game.fish.trait === 'ghost' || game.fish.trait === 'imugi';
      const blink = ghosty && Math.sin(p0r * Math.PI * 6) < -0.25 ? 0.06 : 1;   // 유령처럼 깜빡!
      crayonPath(ellipsePts(c.x, c.y, r, r, 26),
        { color: ringCol, width: 6, seed: 250 + game.ci, wobble: 2, alpha: blink });
      crayonText(`${game.ci + 1} / ${game.fish.circles}`, c.x, c.y + 7, 18, C.darkBrown);
    }
  } else if (game.state === 'result') {
    if (game.result === 'catch') {
      // 가운데 잡았다! 상자 (모동숲 스타일: 물고기 + 이름 + 개그 한마디)
      const bw = Math.min(470, W * 0.72), bh = 232;
      const rx0 = W / 2 - bw / 2, ry0 = H * 0.42 - bh / 2;
      ctx.save();
      ctx.globalAlpha = 0.96;
      ctx.fillStyle = '#fffdf2';
      ctx.beginPath();
      ctx.roundRect(rx0, ry0, bw, bh, 14);
      ctx.fill();
      ctx.restore();
      crayonPath([[rx0, ry0], [rx0 + bw, ry0], [rx0 + bw, ry0 + bh], [rx0, ry0 + bh], [rx0, ry0]],
        { color: C.orange, width: 5, seed: 310, wobble: 2.5 });
      if (game.isNew) {   // 처음 잡은 물고기! (도감에 새로 등록)
        scribbleFill(ellipseRows(rx0 + 30, ry0 + 8, 32, 15, 5),
          { color: C.yellow, seed: 316, alpha: 0.85, width: 4 });
        crayonPath(ellipsePts(rx0 + 30, ry0 + 8, 37, 19, 16),
          { color: C.orange, width: 3, seed: 317, wobble: 1.5 });
        crayonText('NEW!', rx0 + 30, ry0 + 14, 17, C.redDark);
      }
      drawFish(game.fish, W / 2 - 8, ry0 + 62);
      crayonText(T[LANG].caught(game.fish), W / 2, ry0 + 130, 26, C.redDark);
      crayonText(game.gag, W / 2, ry0 + 164, 18, C.deepBlue);
      crayonText((game.wasPerfect ? T[LANG].gainPerfect : T[LANG].gain)(game.coinGain || 0),
        W / 2, ry0 + 200, 20, game.wasPerfect ? C.redDark : C.orange);
      if (t - game.resultAt > 500) {
        crayonText(tr('again'), W / 2, ry0 + bh + 36, 20, C.darkBrown);
      }
    } else {
      crayonText(game.resultMsg, W / 2, hudY, 26, C.deepBlue);
      if (t - game.resultAt > 500) {
        crayonText(tr('again'), W / 2, hudY + 60, 20, C.darkBrown);
      }
    }
  }

  // 판정 텍스트 (딱 맞았어!! / 좋아!)
  if (t < game.judgeUntil) {
    crayonText(game.judgeText, game.judgeX, game.judgeY, 22, C.redDark);
  }

  // 점수 + 코인 (오른쪽 위)
  crayonText(T[LANG].score(game.caught, game.missed), W - 24, SPIRAL_H + 34, 17, C.darkBrown, 'right');
  drawCoins(W - 24, SPIRAL_H + 62, 17);

  // 도전과제 달성 배너 (하나씩 차례로 4초간)
  if (!game.achvBanner && game.achvQueue.length && t > game.achvBannerUntil) {
    game.achvBanner = game.achvQueue.shift();
    game.achvBannerUntil = t + 4000;
    sfx.achv();
  }
  if (game.achvBanner) {
    if (t > game.achvBannerUntil) {
      game.achvBanner = null;
    } else {
      const abw = 340, abh = 98;
      const ax = W / 2 - abw / 2, ay = SPIRAL_H + 56;
      ctx.save();
      ctx.globalAlpha = 0.97;
      ctx.fillStyle = '#fffdf2';
      ctx.beginPath();
      ctx.roundRect(ax, ay, abw, abh, 14);
      ctx.fill();
      ctx.restore();
      crayonPath([[ax, ay], [ax + abw, ay], [ax + abw, ay + abh], [ax, ay + abh], [ax, ay]],
        { color: C.yellow, width: 5, seed: 670, wobble: 2 });
      crayonText(tr('achvGet'), W / 2, ay + 26, 16, C.gray);
      crayonText('★ ' + LX(game.achvBanner.name) + ' ★', W / 2, ay + 54, 22, C.redDark);
      crayonText(T[LANG].gain(game.achvBanner.coins), W / 2, ay + 82, 18, C.orange);
    }
  }
}

let CANVAS_SCALE = 1;   // 화면이 낮으면 게임 전체를 이 배율로 축소해서 보여줌
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);   // 폰에서 너무 무거워지지 않게
  const vw = window.innerWidth, vh = window.innerHeight;
  // 폰 세로(좁은 세로 화면)는 가로로 돌려달라고 안내
  document.getElementById('rotate').style.display = (vh > vw && vw < 600) ? 'flex' : 'none';
  // 가상 해상도: 세로가 640px보다 낮으면(폰 가로 등) 640px짜리 화면을 그대로 축소!
  //  → 버튼·글자 비율이 데스크톱과 똑같아서 절대 안 겹친다
  CANVAS_SCALE = Math.min(1, vh / 640);
  H = Math.round(vh / CANVAS_SCALE);
  // 가로로 너무 길쭉하면 양옆을 책상으로 남기고 가운데만 게임 화면으로
  W = Math.min(Math.round(vw / CANVAS_SCALE), Math.round(H * 1.9));
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = Math.round(W * CANVAS_SCALE) + 'px';
  canvas.style.height = Math.round(H * CANVAS_SCALE) + 'px';
  canvas.style.marginLeft = Math.floor((vw - W * CANVAS_SCALE) / 2) + 'px';
  renderSceneToCache();
  if (game.state === 'dex') renderDexToCache();
  if (game.state === 'achv') renderAchvToCache();
  if (game.state === 'shop') renderShopToCache();
  if (game.state === 'stats') renderStatsToCache();
}
window.addEventListener('resize', resize);

let lastTickT = 0, nextPlaySave = 0;
function tick(t) {
  // 플레이타임 재기 (게임 화면에 있을 때만, 10초마다 저장)
  const dt = Math.min(1000, Math.max(0, t - lastTickT));
  lastTickT = t;
  if (!AUTO_DEMO && !DEV_FAKE && !game.paused &&
      (game.state === 'waiting' || game.state === 'minigame' || game.state === 'result' || game.state === 'idle')) {
    save.playMs = (save.playMs || 0) + dt;
    if (t > nextPlaySave) { nextPlaySave = t + 10000; persistSave(); }
  }
  // 라인 보일: 0.7초마다 배경을 살짝 다르게 다시 그림 (메뉴에서 끌 수 있음)
  const f = Math.floor(t / 700) % 3;
  if (BOIL && f !== lastBoil) {
    lastBoil = f;
    boilSeed = f;
    renderSceneToCache();
    if (game.state === 'dex') renderDexToCache();    // 도감 그림도 같이 꿈틀
    if (game.state === 'achv') renderAchvToCache();
    if (game.state === 'shop') renderShopToCache();
    if (game.state === 'stats') renderStatsToCache();
  }

  // 기다리는 동안 구경거리: 지역 친구가 가끔 지나간다
  if (!game.paused && !AUTO_DEMO && (game.state === 'waiting' || game.state === 'idle')) {
    if (!game.critter && t > (game.critterNextAt || 0)) spawnCritter(t);
  } else if (game.state !== 'waiting' && game.state !== 'idle' && game.critter) {
    game.critter = null;   // 낚시가 시작되면 사라진다
  }

  // 상태 진행 (일시정지 중엔 멈춤!)
  if (game.state === 'idle' && AUTO_DEMO) {
    startWaiting(t);
  } else if (game.paused) {
    // 아무것도 진행하지 않는다
  } else if (game.state === 'waiting') {
    if (!game.biteAt) startWaiting(t);
    else if (t >= game.biteAt) startMinigame(t);
  } else if (game.state === 'minigame') {
    if (!game.circle && t >= game.nextAt) game.circle = newCircle(t, game.ci);
    if (game.circle && AUTO_DEMO && Math.abs(circleRadius(game.circle, t) - TARGET_R) < 1.5) {
      onTap(t);
    }
    if (game.circle && t - game.circle.start >= game.circle.dur * 0.95) {
      endRound(t, false, tr('ignored'));
    }
  }

  // 화면 그리기
  if (game.state === 'menu' || game.state === 'zoom') {
    // 메뉴: 책상 위에 놓인 작은 스케치북 → 시작하면 쭉 확대되며 들어감
    let sc = 0.52;
    if (game.state === 'zoom') {
      const p = Math.min(1, (t - game.zoomStart) / 1300);
      sc = 0.52 + 0.48 * (1 - Math.pow(1 - p, 3));  // 처음엔 빠르고 끝은 사뿐히
      if (p >= 1) game.state = 'idle';   // 바로 낚시가 아니라, 던지기 키를 기다린다!
    }
    screenCtx.setTransform(1, 0, 0, 1, 0, 0);
    screenCtx.fillStyle = C.desk;
    screenCtx.fillRect(0, 0, canvas.width, canvas.height);
    const dw = canvas.width * sc, dh = canvas.height * sc;
    screenCtx.save();
    screenCtx.shadowColor = 'rgba(0,0,0,0.35)';
    screenCtx.shadowBlur = 34 * DPR * (1 - sc);
    screenCtx.shadowOffsetY = 8 * DPR * (1 - sc);
    screenCtx.drawImage(sceneCanvas, (canvas.width - dw) / 2, (canvas.height - dh) / 2, dw, dh);
    screenCtx.restore();
    screenCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  } else if (game.state === 'dex' || game.state === 'achv' || game.state === 'shop' || game.state === 'stats') {
    // 도감/도전과제/상점/내 기록: 배경 위에 캐시를 덮어 그림
    screenCtx.setTransform(1, 0, 0, 1, 0, 0);
    screenCtx.drawImage(sceneCanvas, 0, 0);
    screenCtx.drawImage(game.state === 'dex' ? dexCanvas : game.state === 'achv' ? achvCanvas
      : game.state === 'shop' ? shopCanvas : statsCanvas, 0, 0);
    screenCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  } else {
    // 게임 중: 배경 캐시 복사 + 움직이는 것들
    screenCtx.setTransform(1, 0, 0, 1, 0, 0);
    screenCtx.drawImage(sceneCanvas, 0, 0);
    screenCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (game.paused) {
      // 일시정지 화면 — 어둡게 + 안내
      screenCtx.save();
      screenCtx.fillStyle = 'rgba(60,50,38,0.45)';
      screenCtx.fillRect(0, 0, W, H);
      screenCtx.restore();
      crayonText(tr('paused'), W / 2, H / 2 - 10, 40, '#fdf8ec');
      crayonText(tr('resume'), W / 2, H / 2 + 32, 18, '#fdf8ec');
      requestAnimationFrame(tick);
      return;
    }
    drawDynamic(t);
    // 페이지 넘김 연출 (0.45초):
    //  호수→바다(fwd)  = 지금 페이지가 스프링 쪽으로 접혀 올라가며 다음 장이 드러남
    //  바다→호수(back) = 앞 장이 스프링에서 아래로 내려와 지금 페이지를 덮음
    const fp = (t - (game.flipStart || -9e9)) / 450;
    if (fp >= 0 && fp < 1 && game.flipOld) {
      screenCtx.setTransform(1, 0, 0, 1, 0, 0);
      if (game.flipDir === 'back') {
        screenCtx.drawImage(game.flipOld, 0, 0);   // 아직 옛(바다) 페이지가 깔려 있고
      }
      screenCtx.save();
      screenCtx.shadowColor = 'rgba(0,0,0,0.3)';
      screenCtx.shadowBlur = 18;
      screenCtx.shadowOffsetY = 10;
      if (game.flipDir === 'back') {
        const g = fp * fp;               // 점점 빨라지며 툭 내려온다
        screenCtx.drawImage(sceneCanvas, 0, 0, canvas.width, Math.max(1, canvas.height * g));
      } else {
        const k = (1 - fp) * (1 - fp);   // 처음엔 천천히, 끝엔 휙!
        screenCtx.drawImage(game.flipOld, 0, 0, canvas.width, Math.max(1, canvas.height * k));
      }
      screenCtx.restore();
      screenCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
  }

  requestAnimationFrame(tick);
}

resize();
// 개발용: #auto(자동 시범)와 #catch(상자 미리보기)는 메뉴를 건너뛴다
if (AUTO_DEMO) {
  menuEl.style.display = 'none';
  game.state = 'waiting';
}
// #dex로 열면 가짜 기록으로 도감 화면을 미리 볼 수 있다 (진짜 저장엔 반영 안 됨)
// #dex=클립멸치 처럼 이름을 붙이면 그 물고기 상세 카드까지 열림
if (location.hash.startsWith('#dex')) {
  DEV_FAKE = true;
  [12, 100, 5, 3, 2, 1, 1].forEach((n, i) => { save.caught[FISH[i].id] = n; });
  const wanted = decodeURIComponent(location.hash).split('=')[1];
  // #dex=all — 60마리 전부 잡은 상태로 도감 구경 (아드님 검토용!)
  if (wanted === 'all') FISH.forEach(f => { save.caught[f.id] = 1; });
  game.dexDetail = FISH.find(f => f.name.ko === wanted) || null;
  openDex('menu');
  if (game.dexDetail) {   // 그 물고기가 사는 곳의 도감 탭으로
    game.dexTab = habitatOf(game.dexDetail);
    renderDexToCache();
  }
  if (wanted && /^\d+$/.test(wanted)) {  // #dex=2 → 2페이지 바로 열기
    game.dexPage = Math.min(+wanted - 1, Math.ceil(FISH.length / DEX_PER_PAGE) - 1);
    renderDexToCache();
  }
}
// #shop으로 열면 가짜 코인으로 상점 화면을 미리 볼 수 있다 (진짜 저장 오염 없음)
if (location.hash.startsWith('#shop')) {
  DEV_FAKE = true;
  save.coins = 300;
  save.rod = 1;
  save.rods = { 0: true, 1: true };
  save.baits = { glitter: 5 };
  save.bait = 'glitter';
  save.hats = { cap: true, straw: true };
  openShop('menu');
  if (location.hash === '#shop=2') { game.shopPage = 1; renderShopToCache(); }
}
// #sea로 열면 바다 페이지 기다림 화면을 미리 볼 수 있다 (진짜 저장 오염 없음)
if (location.hash === '#sea') {
  DEV_FAKE = true;
  save.spot = 'sea';
  renderSceneToCache();
  menuEl.style.display = 'none';
  game.state = 'waiting';
  game.biteAt = performance.now() + 9e9;
}
// #stats로 열면 가짜 기록으로 내 기록 화면을 미리 볼 수 있다 (#stats=2 → 순위 페이지)
if (location.hash.startsWith('#stats')) {
  DEV_FAKE = true;
  FISH.forEach((f, i) => { if (i % 3 !== 2) save.caught[f.id] = Math.max(1, 26 - i); });
  save.missed = 45; save.perfect = 131;
  save.coins = 472; save.coinEarned = 1702;
  save.playMs = (2 * 60 + 13) * 60000;
  save.pageFlips = 25; save.baitUsed = 12; save.rod = 3;
  openStats();
  const pg = +location.hash.split('=')[1];
  if (pg) {
    game.statsPage = Math.min(pg - 1, statsPages() - 1);
    renderStatsToCache();
  }
}
// #swamp로 열면 늪지 페이지 기다림 화면을 미리 볼 수 있다
if (location.hash === '#swamp') {
  DEV_FAKE = true;
  save.spot = 'swamp';
  renderSceneToCache();
  menuEl.style.display = 'none';
  game.state = 'waiting';
  game.biteAt = performance.now() + 9e9;
}
// #achv로 열면 가짜 기록으로 도전과제 화면을 미리 볼 수 있다 (#achv=2 → 2페이지)
if (location.hash.startsWith('#achv')) {
  DEV_FAKE = true;
  save.caught['clip-anchovy'] = 100;
  save.caught['eraser-shark'] = 7;
  save.caught['pencil-eel'] = 5;
  openAchv();
  const pg = +location.hash.split('=')[1];
  if (pg) {
    game.achvPage = Math.min(pg - 1, Math.ceil(ACHV.length / ACHV_PER_PAGE) - 1);
    renderAchvToCache();
  }
}
// #catch=꼬불치 처럼 이름을 붙이면 그 물고기 상자를 바로 볼 수 있다 (점수엔 반영 안 됨)
if (location.hash.startsWith('#catch')) {
  const wanted = decodeURIComponent(location.hash).split('=')[1];
  menuEl.style.display = 'none';
  game.state = 'result'; game.result = 'catch';
  game.resultMsg = ''; game.resultAt = performance.now();
  game.fish = FISH.find(f => f.name.ko === wanted) || pickFish();
  game.gag = LX(game.fish.gags)[0];
  game.coinGain = fishPrice(game.fish);
  game.wasPerfect = false;
  game.isNew = !save.caught[game.fish.id];
}
requestAnimationFrame(tick);
</script>
