<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>내 보물창고</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%23E8B18C'/><path d='M4.4 8.6L12 5.2l7.6 3.4v7.8L12 19.8l-7.6-3.4z' fill='%23fff' opacity='.9'/><path d='M4.4 8.6L12 12l7.6-3.4M12 12v7.8' stroke='%23C98F6B' stroke-width='1.2' fill='none'/></svg>" />
<meta name="theme-color" content="#FFF3EC" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ================= 색 테마 (설정에서 바꿈) =================
     파스텔 나무 진열장. --wood 계열이 진열장, --bg가 방 배경. */
  :root {
    --fs: 1;                 /* 글씨 크기 배율 */
    --bg: #FFF3EC;
    --bg2: #FFE6D8;
    --wood: #E8B18C;
    --wood-d: #C98F6B;
    --wood-l: #F5CDAF;
    --accent: #F08C5E;
    --text: #4A3B33;
    --sub: #9A8378;
    --card: #FFFDFB;
  }
  [data-theme="mint"] {
    --bg: #EBF7F1; --bg2: #D7EDE3; --wood: #A9CFC0; --wood-d: #85AE9E; --wood-l: #C9E5DA;
    --accent: #46A98D; --text: #2F4A42; --sub: #7C9A90; --card: #FBFFFD;
  }
  [data-theme="sky"] {
    --bg: #ECF3FD; --bg2: #D9E7F8; --wood: #A9C2E0; --wood-d: #86A2C4; --wood-l: #CBDCF0;
    --accent: #5B8FCF; --text: #33445C; --sub: #8195AE; --card: #FBFDFF;
  }
  [data-theme="lilac"] {
    --bg: #F4EFFB; --bg2: #E7DDF6; --wood: #C3B0DE; --wood-d: #A08BC2; --wood-l: #DCCFEE;
    --accent: #8E6FD4; --text: #453963; --sub: #948AAE; --card: #FDFBFF;
  }
  [data-theme="lemon"] {
    --bg: #FFF9E4; --bg2: #FCEFC3; --wood: #E7CE93; --wood-d: #C6AA6D; --wood-l: #F5E4BC;
    --accent: #E0A32A; --text: #5A4A28; --sub: #A2916C; --card: #FFFEF8;
  }
  [data-theme="rose"] {
    --bg: #FDEFF3; --bg2: #F8DDE5; --wood: #E5B2C0; --wood-d: #C892A2; --wood-l: #F3D3DC;
    --accent: #DE6E90; --text: #573742; --sub: #A9838E; --card: #FFFBFC;
  }
  /* ---- 밝은 나무 없는 테마 ---- */
  [data-theme="white"] {
    --bg: #FFFFFF; --bg2: #F1F1F4; --wood: #DCDCE2; --wood-d: #B9B9C3; --wood-l: #EDEDF1;
    --accent: #5A5A66; --text: #24242A; --sub: #8E8E99; --card: #FFFFFF;
  }
  [data-theme="wood"] {
    --bg: #F6EDDF; --bg2: #E8D6BC; --wood: #B07C4F; --wood-d: #8A5C36; --wood-l: #CFA275;
    --accent: #A5643A; --text: #3E2B1B; --sub: #8A7460; --card: #FFFAF2;
  }
  /* ---- 어두운 테마 (글씨·카드가 밝아진다) ---- */
  [data-theme="black"] {
    --bg: #1A1B21; --bg2: #101116; --wood: #3A3D47; --wood-d: #24262E; --wood-l: #4E525E;
    --accent: #F0B429; --text: #ECECF2; --sub: #9A9CA8; --card: #262832;
  }
  [data-theme="ocean"] {
    --bg: #16283C; --bg2: #0C1725; --wood: #2C4C6B; --wood-d: #1C3349; --wood-l: #3D6A93;
    --accent: #4FC3E8; --text: #E4F1FA; --sub: #8DA6BD; --card: #20374F;
  }
  [data-theme="grape"] {
    --bg: #2B2140; --bg2: #1B142A; --wood: #5B4380; --wood-d: #3E2D5B; --wood-l: #7A5CA8;
    --accent: #C08BF5; --text: #F0E9FA; --sub: #A395BD; --card: #382A52;
  }
  [data-theme="forest"] {
    --bg: #1A2E22; --bg2: #101F17; --wood: #2F5741; --wood-d: #1F3C2D; --wood-l: #427659;
    --accent: #6FD08C; --text: #E7F5EB; --sub: #93AE9E; --card: #234030;
  }
  /* 어두운 테마 공통 손질 (밝은 테마용 흰 그림자·연한 그림이 안 보이므로) */
  .dark .item { border-color: #ffffff1a; box-shadow: 0 2px 6px rgba(0,0,0,.45); }
  .dark .item .frame, .dark .detail-photo, .dark .face.front .fp {
    background: #ffffff12;
    color: var(--wood-l);
  }
  .dark .shelf-note { color: var(--wood-l); text-shadow: none; }
  .dark .r-sym, .dark .photo-pick .cam, .dark h2 .has-sym .sym { color: var(--wood-l); }
  .dark .logo { color: var(--text); }
  .dark .theme-card.on { border-color: var(--accent); }

  body {
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: var(--bg2);
    color: var(--text);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---- 직접 그린 아이콘 (이모지 대신 SVG) ---- */
  .ico { display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
  .ico svg { display: block; }
  .sym { display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
  button, input, select, textarea { font-family: inherit; color: inherit; }

  /* 폰 화면처럼 가운데 세로로 길게 */
  .app {
    max-width: 440px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    background:
      linear-gradient(180deg, var(--bg) 0%, var(--bg) 55%, var(--bg2) 100%);
  }

  /* ---------------- 헤더 ---------------- */
  header {
    padding: 16px 18px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  header h1 {
    font-size: calc(18px * var(--fs));
    flex: 1;
    letter-spacing: -0.5px;
  }
  .logo {
    width: 32px; height: 32px;
    border-radius: 9px;
    background: linear-gradient(160deg, var(--wood-l), var(--wood-d));
    display: flex; align-items: center; justify-content: center;
    color: var(--card);
    box-shadow: 0 2px 5px rgba(0,0,0,.16);
    flex-shrink: 0;
  }
  .s-ico { color: var(--sub); display: flex; }
  .icon-btn {
    background: var(--card);
    border: 1.5px solid var(--wood-l);
    border-radius: 12px;
    width: 36px; height: 36px;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .icon-btn:active { transform: scale(.93); }

  .search-bar {
    margin: 0 18px 6px;
    display: flex; gap: 6px; align-items: center;
    background: var(--card);
    border: 1.5px solid var(--wood-l);
    border-radius: 12px;
    padding: 6px 10px;
  }
  .search-bar input {
    flex: 1; border: 0; outline: none; background: transparent;
    font-size: calc(15px * var(--fs));
  }
  .hidden { display: none !important; }

  /* ---------------- 진열장 고르는 칩 ---------------- */
  .col-chips {
    display: flex; gap: 6px;
    overflow-x: auto;
    padding: 4px 18px 10px;
    scrollbar-width: none;
  }
  .col-chips::-webkit-scrollbar { display: none; }
  .chip {
    background: var(--card);
    border: 1.5px solid var(--wood-l);
    border-radius: 20px;
    padding: 6px 13px;
    font-size: calc(13px * var(--fs));
    font-weight: bold;
    white-space: nowrap;
    cursor: pointer;
    color: var(--sub);
  }
  .chip.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .chip.add { color: var(--accent); }
  .chip.has-sym { display: inline-flex; align-items: center; gap: 5px; padding-left: 10px; }
  .r-sym { display: flex; align-items: center; color: var(--wood-d); }
  h2 .has-sym { display: inline-flex; align-items: center; gap: 6px; color: var(--sub); font-size: calc(14px * var(--fs)); }
  h2 .has-sym .sym { color: var(--wood-d); }

  main { flex: 1; padding: 0 18px 110px; }
  .tab-page { display: none; }
  .tab-page.active { display: block; }

  .bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .bar .count { font-size: calc(12px * var(--fs)); color: var(--sub); }
  .mini-btn {
    background: transparent; border: 0; cursor: pointer;
    font-size: calc(12px * var(--fs)); color: var(--accent); font-weight: bold;
    padding: 4px 6px;
  }

  /* ---------------- 나무 진열장 ---------------- */
  .cabinet {
    border: 9px solid var(--wood-d);
    border-radius: 16px 16px 10px 10px;
    padding: 12px 10px 8px;
    position: relative;
    background:
      repeating-linear-gradient(90deg,
        rgba(255,255,255,.16) 0px, rgba(255,255,255,.16) 3px,
        rgba(0,0,0,.04) 3px, rgba(0,0,0,.04) 5px,
        transparent 5px, transparent 24px),
      linear-gradient(180deg, var(--wood) 0%, var(--wood-l) 30%, var(--wood) 100%);
    box-shadow: inset 0 6px 18px rgba(0,0,0,.18), 0 5px 14px rgba(0,0,0,.13);
  }
  /* 진열장 다리 */
  .cab-legs { display: flex; justify-content: space-between; padding: 0 16px; }
  .cab-legs span {
    width: 26px; height: 12px;
    background: var(--wood-d);
    border-radius: 0 0 6px 6px;
    box-shadow: 0 3px 5px rgba(0,0,0,.18);
  }
  .shelf { margin-bottom: 15px; }
  .shelf:last-child { margin-bottom: 2px; }
  .shelf-items {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    align-items: end;
    min-height: 96px;
  }
  /* 선반 널빤지 — 위판(밝음) + 앞면 두께(어두움) */
  .plank {
    height: 13px;
    margin-top: 2px;
    border-radius: 2px 2px 4px 4px;
    background: linear-gradient(180deg,
      var(--wood-l) 0px, var(--wood-l) 4px,
      var(--wood-d) 4px, var(--wood-d) 100%);
    box-shadow: 0 5px 9px rgba(0,0,0,.22);
  }
  /* 빈 진열장 안내 (선반 위에 겹쳐서) */
  .shelf-note {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--wood-d);
    font-size: calc(13px * var(--fs));
    line-height: 1.7;
    font-weight: bold;
    padding: 12px 6px;
    text-shadow: 0 1px 0 rgba(255,255,255,.5);
  }
  .shelf-note .big { display: flex; justify-content: center; margin-bottom: 6px; }

  /* 진열된 보물 하나 */
  .item {
    background: var(--card);
    border-radius: 11px;
    padding: 5px 4px 6px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,.13);
    border: 1px solid #0000000d;
  }
  .item:active { transform: translateY(1px) scale(.98); }
  .item .frame {
    color: var(--wood-d);
    aspect-ratio: 1;
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg2);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
  }
  .item .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .item .nm {
    font-size: calc(11px * var(--fs));
    margin-top: 4px;
    line-height: 1.25;
    max-height: 2.5em;
    overflow: hidden;
    word-break: break-all;
  }
  .item .stars { font-size: calc(9px * var(--fs)); color: var(--accent); letter-spacing: -1px; }

  /* 새로 진열된 보물이 통통 튀며 등장 */
  @keyframes pop {
    0% { transform: scale(.3) translateY(-30px); opacity: 0; }
    60% { transform: scale(1.08) translateY(0); opacity: 1; }
    100% { transform: scale(1); }
  }
  .item.new { animation: pop .55s cubic-bezier(.2,1.4,.5,1); }
  @keyframes glowRing {
    0%, 100% { box-shadow: 0 2px 5px rgba(0,0,0,.13); }
    50% { box-shadow: 0 0 0 3px var(--accent), 0 2px 10px rgba(0,0,0,.2); }
  }
  .item.spot { animation: glowRing 1.1s ease 2; }

  /* ---------------- 책꽂이 (책처럼 꽂기) ---------------- */
  .books-row {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    min-height: 136px;
    padding: 0 6px;
  }
  .book {
    width: var(--bw);
    height: var(--bh);
    flex-shrink: 0;
    position: relative;
    cursor: pointer;
    border-radius: 3px 3px 1px 1px;
    background:
      linear-gradient(90deg,
        rgba(255,255,255,.28) 0px, rgba(255,255,255,.28) 2px,
        transparent 2px, transparent 5px,
        rgba(0,0,0,.10) 60%, rgba(0,0,0,.30) 100%),
      var(--bc);
    box-shadow: 2px 3px 6px rgba(0,0,0,.28);
    transform-origin: bottom center;
    transition: transform .18s;
    overflow: hidden;
  }
  /* 책등 위아래 금박 띠 */
  .book::before, .book::after {
    content: '';
    position: absolute; left: 3px; right: 3px;
    height: 2px;
    background: rgba(255,255,255,.42);
  }
  .book::before { top: 9px; }
  .book::after { bottom: 26px; }
  .book:hover { transform: translateY(-7px); }
  .book:active { transform: translateY(-3px) scale(.99); }
  .book.lean { transform: rotate(6deg) translateY(2px); }
  .book.lean:hover { transform: rotate(6deg) translateY(-5px); }

  .b-title {
    position: absolute;
    top: 16px; left: 0; right: 0; bottom: 30px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    text-align: start;
    font-size: calc(10.5px * var(--fs));
    font-weight: bold;
    line-height: 1.05;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.45);
    overflow: hidden;
    display: flex; justify-content: center;
    letter-spacing: 0.5px;
  }
  .b-star { position: absolute; top: 2px; left: 0; right: 0; display: flex; justify-content: center; color: #FFD75E; }
  .b-count {
    position: absolute; bottom: 3px; left: 0; right: 0;
    text-align: center;
    font-size: 9px; font-weight: bold;
    color: rgba(255,255,255,.85);
  }
  .b-photo {
    position: absolute; bottom: 8px; left: 4px; right: 4px;
    height: 15px;
    border-radius: 2px;
    background-size: cover;
    background-position: center;
    background-color: rgba(255,255,255,.25);
    box-shadow: 0 1px 2px rgba(0,0,0,.35);
  }

  /* 새 책이 위에서 스윽 내려와 꽂히는 연출 */
  @keyframes slotIn {
    0%   { transform: translateY(-90px) rotate(-16deg); opacity: 0; }
    45%  { transform: translateY(0) rotate(-9deg); opacity: 1; }
    68%  { transform: rotate(5deg); }
    84%  { transform: rotate(-2deg); }
    100% { transform: rotate(0); }
  }
  .book.new { animation: slotIn .8s cubic-bezier(.25,.9,.35,1); }
  @keyframes bookGlow {
    0%, 100% { box-shadow: 2px 3px 6px rgba(0,0,0,.28); }
    50% { box-shadow: 0 0 0 3px var(--accent), 2px 3px 10px rgba(0,0,0,.35); }
  }
  .book.spot { animation: slotIn .8s cubic-bezier(.25,.9,.35,1), bookGlow 1.1s ease .8s 2; }

  .empty {
    text-align: center;
    padding: 34px 16px;
    color: var(--sub);
    font-size: calc(14px * var(--fs));
    line-height: 1.7;
  }
  .empty .big { display: flex; justify-content: center; margin-bottom: 10px; color: var(--wood-d); }

  /* ---------------- 갖고 싶은 것 ---------------- */
  .wish {
    background: var(--card);
    border: 1.5px dashed var(--wood-d);
    border-radius: 13px;
    padding: 11px 13px;
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 10px;
  }
  .wish .w-emoji { color: var(--wood-d); display: flex; }
  .wish .w-body { flex: 1; min-width: 0; }
  .wish .w-name { font-size: calc(15px * var(--fs)); font-weight: bold; }
  .wish .w-sub { font-size: calc(11px * var(--fs)); color: var(--sub); margin-top: 2px; }
  .btn-got {
    background: var(--accent); color: #fff; border: 0;
    border-radius: 10px; padding: 8px 11px;
    font-size: calc(12px * var(--fs)); font-weight: bold; cursor: pointer;
    white-space: nowrap;
  }
  .btn-x {
    background: transparent; border: 0; color: var(--sub);
    font-size: 16px; cursor: pointer; padding: 4px;
  }

  /* ---------------- 내 기록 ---------------- */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .stat {
    background: var(--card); border-radius: 13px; padding: 12px;
    border: 1.5px solid var(--wood-l);
  }
  .stat .n { font-size: calc(24px * var(--fs)); font-weight: bold; color: var(--accent); }
  .stat .l { font-size: calc(11px * var(--fs)); color: var(--sub); margin-top: 2px; }
  .row-stat {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border-radius: 11px; padding: 9px 12px; margin-bottom: 6px;
    font-size: calc(13px * var(--fs));
  }
  .row-stat .grow { flex: 1; }
  .row-stat b { color: var(--accent); }

  /* ---------------- 떠 있는 등록 버튼 ---------------- */
  .fab {
    position: fixed;
    bottom: calc(76px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(calc(220px - 100% - 18px));
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 0;
    background: var(--accent);
    color: #fff;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 5px 16px rgba(0,0,0,.25);
    z-index: 20;
  }
  .fab:active { transform: translateX(calc(220px - 100% - 18px)) scale(.92); }

  /* ---------------- 하단 탭바 ---------------- */
  .tabbar {
    position: fixed;
    bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 440px;
    display: flex;
    background: var(--card);
    border-top: 1.5px solid var(--wood-l);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    z-index: 15;
  }
  .tabbar button {
    flex: 1; background: transparent; border: 0; cursor: pointer;
    padding: 9px 0 11px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: calc(10px * var(--fs));
    color: var(--sub);
  }
  .tabbar button .ic { font-size: 19px; }
  .tabbar button.active { color: var(--accent); font-weight: bold; }

  /* ---------------- 오버레이 공통 ---------------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(40,25,15,.45);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
    backdrop-filter: blur(2px);
  }
  .overlay.on { display: flex; }
  .sheet {
    background: var(--bg);
    width: 100%; max-width: 440px;
    max-height: 92vh;
    overflow-y: auto;
    border-radius: 22px 22px 0 0;
    padding: 16px 18px calc(24px + env(safe-area-inset-bottom, 0px));
    animation: slideUp .25s ease;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }
  .sheet h2 {
    font-size: calc(17px * var(--fs));
    margin-bottom: 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .field { margin-bottom: 13px; }
  .field label {
    display: block;
    font-size: calc(12px * var(--fs));
    color: var(--sub);
    margin-bottom: 5px;
    font-weight: bold;
  }
  .field input[type=text], .field input[type=date], .field textarea, .field select {
    width: 100%;
    background: var(--card);
    border: 1.5px solid var(--wood-l);
    border-radius: 11px;
    padding: 10px 12px;
    font-size: calc(15px * var(--fs));
    outline: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 56px; }
  .pick { display: flex; flex-wrap: wrap; gap: 6px; }
  .pick button {
    background: var(--card);
    border: 1.5px solid var(--wood-l);
    border-radius: 18px;
    padding: 7px 12px;
    font-size: calc(13px * var(--fs));
    cursor: pointer;
    color: var(--sub);
  }
  .pick button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: bold; }
  .pick.with-ico button { display: inline-flex; align-items: center; gap: 5px; padding: 7px 13px 7px 9px; }
  .pick.sym-pick button { padding: 7px 9px; }

  .btn-ico { display: flex; align-items: center; justify-content: center; gap: 7px; }
  .btn-ghost {
    background: var(--card) !important;
    color: var(--accent) !important;
    border: 1.5px solid var(--accent) !important;
  }
  .btn-warn {
    background: var(--card) !important;
    color: #cf5350 !important;
    border: 1.5px solid #cf535066 !important;
  }
  .note {
    font-size: calc(11px * var(--fs));
    color: var(--sub);
    margin-top: 7px;
    line-height: 1.6;
  }

  .btn-main {
    width: 100%;
    background: var(--accent);
    color: #fff; border: 0;
    border-radius: 14px;
    padding: 15px;
    font-size: calc(16px * var(--fs));
    font-weight: bold;
    cursor: pointer;
    margin-top: 4px;
  }
  .btn-main:active { transform: scale(.985); }
  .btn-sub {
    width: 100%; background: transparent; border: 0;
    color: var(--sub); font-size: calc(13px * var(--fs));
    padding: 12px; cursor: pointer; margin-top: 2px;
  }
  .btn-danger { color: #d0524f; }

  /* ---- 사진 여러 장 고르기 ---- */
  .lab-sub { font-weight: normal; opacity: .75; }
  .photo-list {
    display: flex; gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .photo-list::-webkit-scrollbar { display: none; }
  .ph-item, .ph-add {
    position: relative;
    width: 104px; height: 104px;
    flex-shrink: 0;
    border-radius: 13px;
    overflow: hidden;
    background: var(--card);
  }
  .ph-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph-main {
    position: absolute; left: 5px; bottom: 5px;
    background: rgba(0,0,0,.6); color: #fff;
    font-size: 10px; padding: 2px 6px; border-radius: 8px;
  }
  .ph-add {
    border: 2px dashed var(--wood-d);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
    color: var(--sub);
    font-size: calc(11px * var(--fs));
    cursor: pointer;
    padding: 6px;
    text-align: center;
  }
  .ph-add .cam { color: var(--wood-d); }

  /* ---- 개수 ---- */
  .count-row { display: flex; align-items: center; gap: 7px; }
  .cnt-btn {
    width: 38px; height: 38px;
    border-radius: 11px;
    border: 1.5px solid var(--wood-l);
    background: var(--card);
    font-size: 19px; cursor: pointer;
    flex-shrink: 0;
  }
  .count-row input {
    width: 64px; text-align: center;
    background: var(--card);
    border: 1.5px solid var(--wood-l);
    border-radius: 11px;
    padding: 9px 4px;
    font-size: calc(15px * var(--fs));
    outline: none;
  }
  .cnt-hint { font-size: calc(12px * var(--fs)); color: var(--sub); }

  /* ---- 태그 ---- */
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .tag-row:empty { display: none; }
  .tag {
    background: var(--wood-l);
    color: var(--text);
    border: 0;
    border-radius: 16px;
    padding: 5px 11px;
    font-size: calc(12px * var(--fs));
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .tag .tx { opacity: .55; font-weight: bold; }

  /* ---- 사진 크게 보기 ---- */
  .viewer {
    position: fixed; inset: 0;
    background: rgba(8,6,4,.94);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
  }
  .viewer.on { display: flex; }
  .v-bar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 10px;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
    color: #fff;
    background: linear-gradient(180deg, rgba(0,0,0,.55), transparent);
  }
  .v-name { flex: 1; font-size: calc(15px * var(--fs)); font-weight: bold; }
  .v-btn {
    background: rgba(255,255,255,.16); color: #fff;
    border: 0; border-radius: 50%;
    width: 34px; height: 34px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .v-img { max-width: 100%; max-height: 100%; padding: 60px 12px; }
  .v-img img {
    max-width: 100%;
    max-height: calc(100vh - 130px);
    border-radius: 10px;
    display: block;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  .v-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,.14); color: #fff;
    border: 0; border-radius: 50%;
    width: 42px; height: 42px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .v-nav.left { left: 10px; }
  .v-nav.right { right: 10px; }

  /* 상세 사진 넘기기 */
  .detail-photo { position: relative; }
  .detail-photo.has-photo { cursor: zoom-in; }
  .p-dots {
    position: absolute; bottom: 9px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 5px;
  }
  .p-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,.55);
    box-shadow: 0 0 3px rgba(0,0,0,.5);
  }
  .p-dots span.on { background: #fff; width: 16px; border-radius: 3px; }
  .p-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 34px; height: 34px; border-radius: 50%;
    border: 0; background: rgba(0,0,0,.35); color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .p-nav.left { left: 8px; }
  .p-nav.right { right: 8px; }

  /* 타일 배지 (사진 장수 · 개수) */
  .item .frame { position: relative; }
  .badge {
    position: absolute; top: 4px; right: 4px;
    background: rgba(0,0,0,.6); color: #fff;
    font-size: 9.5px; font-weight: bold;
    padding: 2px 5px; border-radius: 7px;
    display: flex; align-items: center; gap: 2px;
  }
  .badge.count { right: auto; left: 4px; background: var(--accent); }

  /* 사진 고르기 칸 (예전 한 장짜리 — 남겨둠) */
  .photo-pick {
    width: 100%;
    aspect-ratio: 4/3;
    border: 2px dashed var(--wood-d);
    border-radius: 14px;
    background: var(--card);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6px;
    cursor: pointer;
    color: var(--sub);
    font-size: calc(13px * var(--fs));
    overflow: hidden;
    position: relative;
  }
  .photo-pick img { width: 100%; height: 100%; object-fit: cover; }
  .photo-pick .cam { color: var(--wood-d); }
  .photo-clear {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,.55); color: #fff; border: 0;
    border-radius: 50%; width: 28px; height: 28px; cursor: pointer;
    font-size: 14px;
  }

  /* 별 등급 고르기 — 별 왼쪽 절반을 누르면 반 개 */
  .stars-pick {
    display: inline-flex;
    color: var(--accent);
    cursor: pointer;
    padding: 4px 2px;
    user-select: none;
    -webkit-user-select: none;
  }
  .rank-word { font-size: calc(12px * var(--fs)); color: var(--sub); margin-top: 4px; }
  .stars-svg { color: var(--accent); }
  .item .stars { color: var(--accent); margin-top: 1px; display: flex; justify-content: center; }

  /* ---------------- 상세 보기 ---------------- */
  .detail-photo {
    color: var(--wood-d);
    width: 100%;
    aspect-ratio: 1;
    border-radius: 16px;
    overflow: hidden;
    background: var(--bg2);
    display: flex; align-items: center; justify-content: center;
    font-size: 76px;
    margin-bottom: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.12);
  }
  .detail-photo img { width: 100%; height: 100%; object-fit: cover; }
  .detail-name { font-size: calc(21px * var(--fs)); font-weight: bold; }
  .detail-stars {
    color: var(--accent);
    font-size: calc(14px * var(--fs));
    margin: 5px 0 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .detail-stars .rw { color: var(--sub); }
  .detail-line {
    display: flex; gap: 8px;
    font-size: calc(14px * var(--fs));
    padding: 9px 0;
    border-top: 1px solid var(--wood-l);
  }
  .detail-line .k { color: var(--sub); width: 84px; flex-shrink: 0; }

  /* ---------------- 등록 연출 (카드 뒤집기) ---------------- */
  .reveal {
    position: fixed; inset: 0;
    background: rgba(35,22,14,.72);
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column;
    z-index: 90;
  }
  .reveal.on { display: flex; }
  .reveal-stage { perspective: 900px; }
  .reveal-card {
    width: 210px; height: 272px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform .75s cubic-bezier(.4,.1,.3,1);
  }
  .reveal-card.flip { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    overflow: hidden;
  }
  .face.back {
    color: #ffffffdd;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.13) 0 8px, transparent 8px 16px),
      linear-gradient(150deg, var(--wood-l), var(--wood-d));
    display: flex; align-items: center; justify-content: center;
    font-size: 62px;
    border: 5px solid var(--wood-d);
  }
  .face.front {
    transform: rotateY(180deg);
    background: var(--card);
    border: 5px solid var(--accent);
    display: flex; flex-direction: column;
  }
  .face.front .fp {
    color: var(--wood-d);
    flex: 1; background: var(--bg2);
    display: flex; align-items: center; justify-content: center;
    font-size: 60px; overflow: hidden;
  }
  .face.front .fp img { width: 100%; height: 100%; object-fit: cover; }
  .face.front .fn {
    padding: 8px 8px 9px; text-align: center;
    font-size: calc(15px * var(--fs)); font-weight: bold;
    line-height: 1.2;
  }
  .face.front .fs { color: var(--accent); font-size: 12px; }

  @keyframes shineSweep {
    0% { transform: translateX(-120%) rotate(18deg); }
    100% { transform: translateX(220%) rotate(18deg); }
  }
  .face.front .shine {
    position: absolute; top: -30%; left: 0;
    width: 45%; height: 160%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent);
    animation: shineSweep 1.1s ease .8s;
  }
  .reveal-msg {
    color: #fff;
    margin-top: 20px;
    font-size: calc(16px * var(--fs));
    font-weight: bold;
    text-shadow: 0 2px 8px rgba(0,0,0,.5);
    min-height: 22px;
  }
  .reveal button {
    margin-top: 14px;
    background: #fff;
    border: 0; border-radius: 14px;
    padding: 12px 26px;
    font-size: calc(15px * var(--fs)); font-weight: bold;
    color: var(--accent);
    cursor: pointer;
  }
  .sparkles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  @keyframes flyOut {
    0% { transform: translate(0,0) scale(.2); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.15); opacity: 0; }
  }
  .sp {
    position: absolute; top: 50%; left: 50%;
    font-size: 20px;
    animation: flyOut .95s ease-out forwards;
  }

  /* ---------------- 테마 고르기 ---------------- */
  .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .theme-card {
    border: 2.5px solid transparent;
    border-radius: 13px;
    padding: 8px 6px;
    cursor: pointer;
    text-align: center;
    font-size: calc(11px * var(--fs));
    font-weight: bold;
  }
  .theme-card.on { border-color: var(--text); }
  .theme-swatch {
    height: 30px; border-radius: 8px; margin-bottom: 5px;
    border: 3px solid;
  }

  /* ---------------- 토스트 ---------------- */
  .toast {
    position: fixed;
    bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    left: 50%; transform: translateX(-50%);
    background: var(--text); color: #fff;
    padding: 11px 18px; border-radius: 22px;
    font-size: calc(14px * var(--fs));
    z-index: 120;
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    max-width: 90%;
    text-align: center;
  }
  .toast.on { opacity: .95; }
</style>
</head>
<body>

<div class="app">
  <header>
    <span class="logo" id="logoBox"></span>
    <h1>내 보물창고</h1>
    <button class="icon-btn" id="searchBtn" title="찾기"></button>
    <button class="icon-btn" id="gearBtn" title="설정"></button>
  </header>

  <div class="search-bar hidden" id="searchBar">
    <span class="s-ico" id="searchIco"></span>
    <input type="text" id="searchInput" placeholder="보물 이름으로 찾기" />
    <button class="btn-x" id="searchClose"></button>
  </div>

  <main>
    <!-- ========== 진열장 ========== -->
    <section class="tab-page active" id="page-shelf">
      <div class="col-chips" id="colChips"></div>
      <div class="bar">
        <span class="count" id="shelfCount"></span>
        <button class="mini-btn" id="sortBtn">최신순 ▾</button>
      </div>
      <div id="cabinetWrap"></div>
    </section>

    <!-- ========== 갖고 싶은 것 ========== -->
    <section class="tab-page" id="page-wish">
      <div class="bar">
        <span class="count" id="wishCount"></span>
        <button class="mini-btn" id="wishAddBtn">＋ 갖고 싶은 것 추가</button>
      </div>
      <div id="wishList"></div>
    </section>

    <!-- ========== 내 기록 ========== -->
    <section class="tab-page" id="page-stats">
      <div id="statsBody"></div>
    </section>
  </main>

  <button class="fab" id="addBtn" title="보물 등록"></button>

  <nav class="tabbar">
    <button data-tab="shelf" class="active"><span class="ic"></span>진열장</button>
    <button data-tab="wish"><span class="ic"></span>갖고 싶은 것</button>
    <button data-tab="stats"><span class="ic"></span>내 기록</button>
  </nav>
</div>

<!-- ========== 보물 등록/수정 ========== -->
<div class="overlay" id="addOverlay">
  <div class="sheet">
    <h2><span id="addTitle">보물 등록</span> <button class="btn-x" data-close="addOverlay"></button></h2>

    <div class="field">
      <label>사진 <span class="lab-sub">(최대 5장 · 첫 장이 대표 사진)</span></label>
      <div class="photo-list" id="photoList"></div>
      <input type="file" id="photoInput" accept="image/*" multiple class="hidden" />
    </div>

    <div class="field">
      <label>이름 *</label>
      <input type="text" id="fName" placeholder="예: 리자몽 EX 카드" maxlength="40" />
    </div>

    <div class="field">
      <label>어느 진열장에?</label>
      <div class="pick" id="fCol"></div>
    </div>

    <div class="field">
      <label>내가 매기는 등급</label>
      <div class="stars-pick" id="fRank" title="별을 눌러 정해요 (반 개도 됩니다)"></div>
      <div class="rank-word" id="rankWord">별을 눌러 정해요</div>
    </div>

    <div class="field">
      <label>언제 생겼나요?</label>
      <input type="date" id="fDate" />
    </div>

    <div class="field">
      <label>어떻게 생겼나요?</label>
      <div class="pick with-ico" id="fHow"></div>
    </div>

    <div class="field">
      <label>누구한테서 / 어디서? (선택)</label>
      <input type="text" id="fFrom" placeholder="예: 할머니가, 문구점에서" maxlength="30" />
    </div>

    <div class="field">
      <label>같은 것 개수</label>
      <div class="count-row">
        <button class="cnt-btn" id="cntMinus">−</button>
        <input type="number" id="fCount" value="1" min="1" max="999" />
        <button class="cnt-btn" id="cntPlus">＋</button>
        <span class="cnt-hint" id="cntHint">한 개만 있어요</span>
      </div>
    </div>

    <div class="field">
      <label>태그 <span class="lab-sub">(시리즈·묶음. 엔터로 추가)</span></label>
      <div class="tag-row" id="fTags"></div>
      <input type="text" id="fTagInput" placeholder="예: 1탄시리즈, 생일선물" maxlength="14" />
    </div>

    <div class="field">
      <label>메모 (선택)</label>
      <textarea id="fMemo" placeholder="이 보물의 이야기를 적어두면 나중에 재밌어요" maxlength="200"></textarea>
    </div>

    <button class="btn-main" id="saveItemBtn">진열장에 놓기</button>
    <button class="btn-sub btn-danger hidden" id="deleteItemBtn">이 보물 지우기</button>
  </div>
</div>

<!-- ========== 보물 상세 ========== -->
<div class="overlay" id="detailOverlay">
  <div class="sheet" id="detailSheet"></div>
</div>

<!-- ========== 갖고 싶은 것 추가 ========== -->
<div class="overlay" id="wishOverlay">
  <div class="sheet">
    <h2>갖고 싶은 것 <button class="btn-x" data-close="wishOverlay"></button></h2>
    <div class="field">
      <label>무엇이 갖고 싶나요? *</label>
      <input type="text" id="wName" placeholder="예: 레고 우주정거장" maxlength="40" />
    </div>
    <div class="field">
      <label>어느 진열장에 놓을 건가요?</label>
      <div class="pick" id="wCol"></div>
    </div>
    <div class="field">
      <label>메모 (선택)</label>
      <input type="text" id="wMemo" placeholder="예: 생일에 사달라고 하기" maxlength="60" />
    </div>
    <button class="btn-main" id="saveWishBtn">목록에 넣기</button>
  </div>
</div>

<!-- ========== 진열장 만들기 ========== -->
<div class="overlay" id="colOverlay">
  <div class="sheet">
    <h2><span id="colTitle">진열장 만들기</span> <button class="btn-x" data-close="colOverlay"></button></h2>
    <div class="field">
      <label>진열장 이름 *</label>
      <input type="text" id="cName" placeholder="예: 야구카드" maxlength="14" />
    </div>
    <div class="field">
      <label>표지 그림</label>
      <div class="pick sym-pick" id="cEmoji"></div>
    </div>
    <div class="field">
      <label>진열 방식</label>
      <div class="pick" id="cStyle">
        <button data-style="shelf">선반에 세우기</button>
        <button data-style="books">책처럼 꽂기</button>
      </div>
      <p class="note" id="styleNote"></p>
    </div>
    <button class="btn-main" id="saveColBtn">만들기</button>
    <button class="btn-sub btn-danger hidden" id="deleteColBtn">이 진열장 지우기</button>
  </div>
</div>

<!-- ========== 설정 ========== -->
<div class="overlay" id="setOverlay">
  <div class="sheet">
    <h2>설정 <button class="btn-x" data-close="setOverlay"></button></h2>

    <div class="field">
      <label>진열장 색깔</label>
      <div class="theme-grid" id="themeGrid"></div>
    </div>

    <div class="field">
      <label>글씨 크기</label>
      <div class="pick" id="fsPick">
        <button data-fs="1">보통</button>
        <button data-fs="1.15">크게</button>
        <button data-fs="1.3">아주 크게</button>
      </div>
    </div>

    <div class="field">
      <label>진열장 관리</label>
      <div id="colManage"></div>
    </div>

    <div class="field">
      <label>내 보물 지키기</label>
      <button class="btn-main btn-ico" id="backupBtn" style="margin-bottom:6px"><span class="bi"></span>백업 파일 내보내기</button>
      <button class="btn-main btn-ico btn-ghost" id="restoreBtn"><span class="bi"></span>백업 파일 불러오기</button>
      <input type="file" id="restoreInput" accept="application/json,.json" class="hidden" />
      <p class="note">
        사진까지 전부 한 파일로 저장돼요. 폰을 바꾸거나 실수로 지웠을 때 이 파일로 되살릴 수 있어요.
        보물 사진은 이 기기 안에만 있고 인터넷에 올라가지 않아요.
      </p>
    </div>

    <div class="field">
      <label>처음부터 다시 시작</label>
      <button class="btn-main btn-ico btn-warn" id="resetBtn"><span class="bi"></span>전부 지우고 초기화</button>
      <p class="note">

function icon(name, size, extra) {
  const s = size || 22;
  return '<span class="ico ' + (extra || '') + '"><svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" '
    + 'stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'
    + (ICONS[name] || '') + '</svg></span>';
}
function symbol(name, size) {
  const s = size || 26;
  return '<span class="sym"><svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" '
    + 'stroke-linecap="round" stroke-linejoin="round">' + (SYMBOLS[name] || SYMBOLS.box) + '</svg></span>';
}

// 별점 그림 — 0.5개 단위로 채워진다 (예: 3.5 → 세 개 반)
let starClipSeq = 0;
function starsSVG(value, size, gap) {
  const s = size || 15, g = (gap === undefined ? 2 : gap);
  const total = s * 5 + g * 4;
  const id = 'sc' + (starClipSeq++);
  const path = 'M12 3l2.8 5.9 6.4.9-4.6 4.5 1.1 6.4-5.7-3-5.7 3 1.1-6.4L2.8 9.8l6.4-.9z';
  let back = '', front = '';
  for (let i = 0; i < 5; i++) {
    const x = i * (s + g);
    back += '<g transform="translate(' + x + ',0) scale(' + (s / 24) + ')"><path d="' + path + '" fill="currentColor" opacity=".22"/></g>';
    front += '<g transform="translate(' + x + ',0) scale(' + (s / 24) + ')"><path d="' + path + '" fill="currentColor"/></g>';
  }
  const w = Math.max(0, Math.min(5, value)) / 5 * total;
  return '<span class="sym stars-svg"><svg width="' + total + '" height="' + s + '" viewBox="0 0 ' + total + ' ' + s + '">'
    + '<defs><clipPath id="' + id + '"><rect x="0" y="0" width="' + w + '" height="' + s + '"/></clipPath></defs>'
    + back + '<g clip-path="url(#' + id + ')">' + front + '</g></svg></span>';
}

}

  items: [],         // { id, col, name, rank, date, how, from, memo, photo, created }
  wishes: [],        // { id, col, name, memo, created }

  seq: 1,            // id 만들 때 쓰는 번호 (Date.now()만 쓰면 같은 밀리초에 겹칠 수 있음)
}, loadState() || {});
if (!state.settings) state.settings = { theme: 'peach', fontScale: 1, sort: 'new' };
if (!state.settings.sort) state.settings.sort = 'new';
if (!state.seq) state.seq = 1;

// 처음 켰을 때 기본 진열장 4개
if (state.collections.length === 0) {
  state.collections = [
    { id: 'c-card',  name: '카드',        sym: 'card'   },
    { id: 'c-lego',  name: '레고·피규어', sym: 'block'  },
    { id: 'c-small', name: '잡화',        sym: 'ribbon' },
    { id: 'c-book',  name: '책·만화책',   sym: 'book'   },

}
// 예전 버전(이모지로 표지를 쓰던 때) 데이터를 그림 이름으로 바꿔줌
const EMOJI_TO_SYM = {
  '🃏': 'card', '🧱': 'block', '🎀': 'ribbon', '📚': 'book', '⚽': 'ball', '🎮': 'gamepad',
  '🪀': 'ball', '🧸': 'bear', '🎨': 'palette', '🔖': 'book', '💎': 'gem', '🚗': 'car',
  '🦖': 'dino', '🎵': 'music', '🏅': 'medal', '🪙': 'medal', '📦': 'box', '🌟': 'star',
};
state.collections.forEach(function (c) {
  if (!c.sym) { c.sym = EMOJI_TO_SYM[c.emoji] || 'box'; delete c.emoji; }
  // 진열 방식: 'shelf'(선반에 세우기) / 'books'(책처럼 꽂기).
  // 책 진열장은 처음부터 책꽂이 모습으로.

});
// 사진이 한 장뿐이던 시절 데이터 → 장수(photoN)로 바꿔줌
state.items.forEach(function (i) {
  if (i.photoN === undefined) i.photoN = i.photo ? 1 : 0;
  delete i.photo;
  if (i.count === undefined) i.count = 1;
  if (!i.tags) i.tags = [];
});

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function newId(prefix) { return prefix + '-' + Date.now().toString(36) + '-' + (state.seq++); }

function dateStr(d) {
  return d.getFullYear() + '-'
    + String(d.getMonth() + 1).padStart(2, '0') + '-'
    + String(d.getDate()).padStart(2, '0');
}
function todayStr() { return dateStr(new Date()); }
function prettyDate(s) {
  if (!s) return '';
  const p = s.split('-');
  return p[0] + '년 ' + Number(p[1]) + '월 ' + Number(p[2]) + '일';
}

// ================== 사진 창고 (IndexedDB) ==================
// 사진은 이 브라우저 안에만 저장되고 인터넷에 올라가지 않아요.
// localStorage는 5MB 한계라 사진처럼 큰 건 IndexedDB에 따로 보관합니다.
let db = null;
function openDB() {
  return new Promise(function (resolve, reject) {
    const req = indexedDB.open('treasure-photos', 1);
    req.onupgradeneeded = function () { req.result.createObjectStore('photos'); };
    req.onsuccess = function () { db = req.result; resolve(); };
    req.onerror = function () { reject(req.error); };
  });
}
function idb(mode, fn) {
  return new Promise(function (resolve, reject) {
    if (!db) { reject(new Error('no db')); return; }
    const tx = db.transaction('photos', mode);
    const r = fn(tx.objectStore('photos'));
    tx.oncomplete = function () { resolve(r.result); };
    tx.onerror = function () { reject(tx.error); };
  });
}
// 보물 하나에 사진이 여러 장. 첫 장은 보물 id 그대로, 둘째부터 id__1, id__2 …
// (첫 장을 id 그대로 두면 사진 한 장이던 시절 데이터를 그대로 읽을 수 있다)
const MAX_PHOTOS = 5;
function photoKey(itemId, i) { return i === 0 ? itemId : itemId + '__' + i; }
function photoCount(it) { return it.photoN || (it.photo ? 1 : 0); }
function allPhotoKeys(it) {
  const keys = [];
  for (let i = 0; i < photoCount(it); i++) keys.push(photoKey(it.id, i));
  return keys;
}

function putPhoto(key, blob) { return idb('readwrite', function (s) { return s.put(blob, key); }); }
function getPhoto(key) { return idb('readonly', function (s) { return s.get(key); }); }
function delPhoto(key) { return idb('readwrite', function (s) { return s.delete(key); }); }

// 한 번 만든 사진 주소는 캐시해서 다시 쓰기 (매번 만들면 메모리가 샘)
const urlCache = {};
function photoURL(id) {
  if (urlCache[id]) return Promise.resolve(urlCache[id]);
  return getPhoto(id).then(function (blob) {
    if (!blob) return null;
    const u = URL.createObjectURL(blob);
    urlCache[id] = u;
    return u;
  }).catch(function () { return null; });
}
function forgetPhotoURL(id) {
  if (urlCache[id]) { URL.revokeObjectURL(urlCache[id]); delete urlCache[id]; }
}

// 사진 압축: 큰 사진을 640px 이하 JPEG로 줄여서 저장 (용량 절약)
function compressImage(file) {
  return createImageBitmap(file).then(function (bmp) {
    const max = 640;
    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(bmp.width * scale));
    canvas.height = Math.max(1, Math.round(bmp.height * scale));
    canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
    return new Promise(function (resolve) { canvas.toBlob(resolve, 'image/jpeg', 0.82); });
  });
}

// ================== 자잘한 도구 ==================
function $(id) { return document.getElementById(id); }
function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}
// 그림(SVG)이 들어가는 요소를 만들 때
function elh(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
// 오버레이(아래에서 올라오는 창) 열고 닫기.
// 설정 위에 진열장 창이 겹쳐 열릴 수 있어서, 나중에 연 것이 항상 위로 오게 z를 계산한다.
function openOv(id) {
  const ov = $(id);
  const open = document.querySelectorAll('.overlay.on').length;
  ov.style.zIndex = 50 + open * 2;
  ov.classList.add('on');
}
function closeOv(id) { $(id).classList.remove('on'); }

let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2000);
}

function visibleItems() {
  let list = state.items.slice();
  if (searchWord) {
    const w = searchWord.toLowerCase();
    list = list.filter(function (i) {
      return (i.name || '').toLowerCase().indexOf(w) >= 0
          || (i.memo || '').toLowerCase().indexOf(w) >= 0
          || (i.from || '').toLowerCase().indexOf(w) >= 0
          || (i.tags || []).some(function (t) { return t.toLowerCase().indexOf(w) >= 0; });
    });
  } else if (curCol !== 'all') {
    list = list.filter(function (i) { return i.col === curCol; });
  }
  const sort = state.settings.sort;
  list.sort(function (a, b) {
    if (sort === 'rank') return (b.rank - a.rank) || (b.created - a.created);
    if (sort === 'name') return (a.name || '').localeCompare(b.name || '', 'ko');
    return b.created - a.created; // 최신순
  });
  return list;
}

const SORT_NAME = { new: '최신순', rank: '등급순', name: '이름순' };

function renderShelf() {
  renderChips();
  const list = visibleItems();
  $('sortBtn').textContent = SORT_NAME[state.settings.sort] + ' ▾';
  $('shelfCount').textContent = searchWord
    ? '"' + searchWord + '" 찾은 결과 ' + list.length + '개'
    : (curCol === 'all' ? '보물 ' + list.length + '개' : colOf(curCol).name + ' ' + list.length + '개');

  const wrap = $('cabinetWrap');
  wrap.innerHTML = '';

  // 검색 결과가 없을 때만 진열장을 안 그린다 (비어 있어도 진열장은 보여야 진열장답다)
  if (list.length === 0 && searchWord) {
    const e = el('div', 'empty');
    e.innerHTML = '<span class="big">' + icon('search', 42) + '</span>그런 이름의 보물은 아직 없어요.';
    wrap.appendChild(e);
    return;
  }

  // 책 진열장(진열 방식 '책처럼 꽂기')을 골랐으면 책꽂이 모습으로 그린다.
  // 검색 중에는 여러 진열장이 섞이므로 늘 타일로 본다.
  const bookMode = !searchWord && curCol !== 'all' && colOf(curCol).style === 'books';

  const cab = el('div', 'cabinet' + (bookMode ? ' books' : ''));
  const per = bookMode ? BOOKS_PER_ROW : 3;
  const minRows = bookMode ? 2 : 3;
  const rows = Math.max(minRows, Math.ceil(list.length / per)); // 빈 선반도 보이게
  for (let r = 0; r < rows; r++) {
    const shelf = el('div', 'shelf');
    const row = el('div', bookMode ? 'books-row' : 'shelf-items');

        ? '<span class="big">' + symbol('book', 42) + '</span>책꽂이가 비어 있어요.<br>오른쪽 아래 ＋ 를 눌러<br>첫 책을 꽂아보세요!'
        : '<span class="big">' + symbol('box', 42) + '</span>진열장이 비어 있어요.<br>오른쪽 아래 ＋ 를 눌러<br>첫 보물을 올려보세요!';
      row.appendChild(note);
    } else {
      list.slice(r * per, r * per + per).forEach(function (it) {
        row.appendChild(bookMode ? bookSpine(it) : itemTile(it));
      });
      // 책이 몇 권 없으면 옆으로 기대어 세워둔 느낌을 준다
      if (bookMode && row.children.length > 0 && row.children.length < 3) {

  wrap.appendChild(legs);
}

// ================== 책꽂이 (책등에 제목이 세로로 적힌다) ==================
const BOOKS_PER_ROW = 6;

// 같은 이름은 늘 같은 책 모양이 되도록, 이름에서 숫자를 뽑아 쓴다
function hashOf(s) {
  let h = 0;
  for (let i = 0; i < (s || '').length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function bookSpine(it) {
  const h = hashOf(it.id + it.name);
  const w = 27 + (h % 5) * 4;              // 27~43px — 얇은 책, 두꺼운 책
  const ht = 104 + (Math.floor(h / 7) % 5) * 7;  // 104~132px — 키 큰 책, 작은 책
  const hue = h % 360;
  const light = 42 + (Math.floor(h / 11) % 3) * 5;

  const b = el('div', 'book');
  b.dataset.id = it.id;
  b.style.setProperty('--bw', w + 'px');
  b.style.setProperty('--bh', ht + 'px');
  b.style.setProperty('--bc', 'hsl(' + hue + ' 42% ' + light + '%)');
  b.style.setProperty('--bc2', 'hsl(' + hue + ' 42% ' + (light - 12) + '%)');

  // 책등에 세로로 쓰는 제목 — 책 키에 맞춰 잘라 넣는다
  const room = Math.floor((ht - 30) / 12);
  let title = it.name || '';
  if (title.length > room) title = title.slice(0, Math.max(1, room - 1)) + '…';
  b.appendChild(el('span', 'b-title', title));

  if (it.rank >= 4.5) b.appendChild(elh('span', 'b-star', symbol('star', 9)));
  if (it.count > 1) b.appendChild(el('span', 'b-count', '×' + it.count));

  // 사진이 있으면 책등 아래쪽에 작게 붙인다 (표지 조각처럼)
  if (photoCount(it) > 0) {
    const chip = el('span', 'b-photo');
    b.appendChild(chip);
    photoURL(photoKey(it.id, 0)).then(function (u) {
      if (!u) { chip.remove(); return; }
      chip.style.backgroundImage = 'url("' + u + '")';
    });
  }

  b.title = it.name;
  b.onclick = function () { openDetail(it.id); };
  return b;
}

function itemTile(it) {
  const d = el('div', 'item');
  d.dataset.id = it.id;
  const frame = elh('div', 'frame', symbol(colOf(it.col).sym, 34));
  if (photoCount(it) > 0) {
    photoURL(photoKey(it.id, 0)).then(function (u) {
      if (!u) return;
      // 자리표시 그림만 걷어내고 사진을 맨 앞에 넣는다 (배지는 그대로 둬야 함)
      const sym = frame.querySelector('.sym');
      if (sym) sym.remove();
      const img = document.createElement('img');
      img.src = u;
      img.alt = it.name;
      frame.insertBefore(img, frame.firstChild);
    });
  }
  if (photoCount(it) > 1) frame.appendChild(elh('span', 'badge', icon('camera', 9) + photoCount(it)));
  if (it.count > 1) frame.appendChild(el('span', 'badge count', '×' + it.count));
  d.appendChild(frame);
  d.appendChild(el('div', 'nm', it.name));
  d.appendChild(elh('div', 'stars', starsSVG(it.rank || 0, 9, 1)));
  d.onclick = function () { openDetail(it.id); };
  return d;
}

function renderStats() {
  const box = $('statsBody');
  box.innerHTML = '';
  const items = state.items;

  if (items.length === 0) {
    const e = el('div', 'empty');
    e.innerHTML = '<span class="big">' + icon('chart', 42) + '</span>보물을 등록하면<br>여기에 기록이 쌓여요.';
    box.appendChild(e);
    return;
  }

  const now = new Date();
  const thisMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  const monthN = items.filter(function (i) { return (i.date || '').indexOf(thisMonth) === 0; }).length;
  const best = items.filter(function (i) { return i.rank === 5; }).length;

  const grid = el('div', 'stat-grid');
  function stat(n, l) {
    const s = el('div', 'stat');
    s.appendChild(el('div', 'n', String(n)));
    s.appendChild(el('div', 'l', l));
    return s;
  }
  grid.appendChild(stat(items.length, '모은 보물'));
  grid.appendChild(stat(state.collections.length, '진열장'));
  grid.appendChild(stat(monthN, '이번 달에 생긴 것'));
  grid.appendChild(stat(best, '별 다섯 인생템'));
  box.appendChild(grid);

  box.appendChild(el('div', 'l', ''));
  const h = el('div', 'bar');
  h.appendChild(el('span', 'count', '진열장별로 보기'));
  box.appendChild(h);

  state.collections.forEach(function (c) {
    const n = items.filter(function (i) { return i.col === c.id; }).length;
    const r = el('div', 'row-stat');
    r.appendChild(elh('span', 'r-sym', symbol(c.sym, 20)));
    r.appendChild(el('span', 'grow', c.name));
    const b = el('b', '', n + '개');
    r.appendChild(b);
    box.appendChild(r);
  });

  // 가장 오래된 보물 / 가장 최근 보물
  const dated = items.filter(function (i) { return i.date; }).sort(function (a, b) { return a.date.localeCompare(b.date); });
  if (dated.length > 0) {
    const h2 = el('div', 'bar');
    h2.appendChild(el('span', 'count', '기억할 만한 것'));
    box.appendChild(h2);

    const oldest = dated[0];
    const r1 = el('div', 'row-stat');
    r1.appendChild(elh('span', 'r-sym', icon('reset', 18)));
    r1.appendChild(el('span', 'grow', '가장 오래된 보물'));
    r1.appendChild(el('b', '', oldest.name));
    r1.onclick = function () { openDetail(oldest.id); };
    box.appendChild(r1);

    const newest = dated[dated.length - 1];
    const r2 = el('div', 'row-stat');
    r2.appendChild(elh('span', 'r-sym', icon('sparkle', 18)));
    r2.appendChild(el('span', 'grow', '가장 최근 보물'));
    r2.appendChild(el('b', '', newest.name));
    r2.onclick = function () { openDetail(newest.id); };
    box.appendChild(r2);
  }

  const howCount = {};
  items.forEach(function (i) { if (i.how) howCount[i.how] = (howCount[i.how] || 0) + 1; });
  const hows = Object.keys(howCount).sort(function (a, b) { return howCount[b] - howCount[a]; });
  if (hows.length > 0) {
    const h3 = el('div', 'bar');
    h3.appendChild(el('span', 'count', '어떻게 생겼나'));
    box.appendChild(h3);
    hows.forEach(function (k) {
      const r = el('div', 'row-stat');
      r.appendChild(el('span', 'grow', k));
      r.appendChild(el('b', '', howCount[k] + '개'));
      box.appendChild(r);
    });
  }
}

// ================== 보물 등록 / 수정 ==================
let editingId = null;     // 수정 중인 보물 id (없으면 새로 등록)
let formPhotos = [];      // 이번에 고른 사진들 [{blob, url}] — 최대 5장
let fromWishId = null;    // "생겼어요!"로 들어온 경우 원래 소원 id
let formCol = null, formRank = 3, formHow = '', formTags = [];

function openAdd(id, prefill) {
  editingId = id || null;
  formPhotos.forEach(function (p) { if (p.temp) URL.revokeObjectURL(p.url); });
  formPhotos = [];
  fromWishId = (prefill && prefill.fromWish) || null;

  const it = id ? state.items.find(function (i) { return i.id === id; }) : null;
  $('addTitle').textContent = it ? '보물 고치기' : '보물 등록';
  $('saveItemBtn').textContent = it ? '고친 내용 저장'
    : (colOf(formCol).style === 'books' ? '책꽂이에 꽂기' : '진열장에 놓기');
  $('deleteItemBtn').classList.toggle('hidden', !it);

  $('fName').value = it ? it.name : ((prefill && prefill.name) || '');
  $('fDate').value = it ? (it.date || todayStr()) : todayStr();
  $('fFrom').value = it ? (it.from || '') : '';
  $('fMemo').value = it ? (it.memo || '') : '';
  $('fCount').value = it ? (it.count || 1) : 1;
  formCol = it ? it.col : ((prefill && prefill.col) || (curCol !== 'all' ? curCol : state.collections[0].id));
  formRank = it ? (it.rank || 3) : 3;
  formHow = it ? (it.how || '') : '';
  formTags = it && it.tags ? it.tags.slice() : [];

  renderColPick();
  renderRank();
  renderHow();
  renderCount();
  renderTagField();
  renderPhotoList();

  // 이미 있던 사진들을 불러와 편집 목록에 담는다
  if (it) {
    allPhotoKeys(it).forEach(function (k, i) {
      getPhoto(k).then(function (blob) {
        if (!blob || editingId !== id) return;
        formPhotos[i] = { blob: blob, url: URL.createObjectURL(blob), temp: true };
        renderPhotoList();
      }).catch(function () {});
    });
  }
  $('photoInput').value = '';

  openOv('addOverlay');
}

function renderPhotoList() {
  const box = $('photoList');
  box.innerHTML = '';
  formPhotos.forEach(function (p, i) {
    if (!p) return;
    const d = el('div', 'ph-item');

// --- 별점: 별 왼쪽 절반을 누르면 반 개, 오른쪽 절반이면 한 개 ---
const STAR_SIZE = 30, STAR_GAP = 5;
function renderRank() {
  $('fRank').innerHTML = starsSVG(formRank, STAR_SIZE, STAR_GAP);
  $('rankWord').textContent = formRank > 0
    ? rankText(formRank) + ' — ' + rankWord(formRank)
    : '별을 눌러 정해요 (반 개도 돼요)';
}
function rankFromClick(e) {
  const box = $('fRank').querySelector('svg');
  if (!box) return formRank;
  const r = box.getBoundingClientRect();
  const x = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) / r.width * 5;
  let v = Math.ceil(x * 2) / 2;               // 0.5 단위로 올림
  return Math.max(0.5, Math.min(5, v));
}
$('fRank').onclick = function (e) {
  formRank = rankFromClick(e);
  renderRank();
};

}

  $('fCount').value = Math.max(1, (parseInt($('fCount').value, 10) || 1) - 1);
  renderCount();
};
$('cntPlus').onclick = function () {

$('fCount').oninput = renderCount;

// --- 태그 ---
function renderTagField() {
  const box = $('fTags');
  box.innerHTML = '';
  formTags.forEach(function (t, i) {
    const b = elh('button', 'tag', '#' + t + '<span class="tx">✕</span>');
    b.onclick = function () { formTags.splice(i, 1); renderTagField(); };
    box.appendChild(b);
  });
}
function addTag(raw) {
  const t = (raw || '').trim().replace(/^#/, '').replace(/\s+/g, '');
  if (!t) return;
  if (formTags.length >= 6) { toast('태그는 6개까지예요'); return; }

$('photoInput').onchange = function () {

  Promise.all(files.slice(0, room).map(function (f) {

    }).catch(function () { return null; });
  })).then(function (added) {

$('saveItemBtn').onclick = function () {
  const name = $('fName').value.trim();
  if (!name) { toast('이름을 적어주세요!'); $('fName').focus(); return; }

  let it;
  if (editingId) {
    it = state.items.find(function (i) { return i.id === editingId; });
  } else {
    it = { id: newId('t'), created: Date.now() };
    state.items.push(it);
  }
  it.name = name;
  it.col = formCol;
  it.rank = formRank;
  it.date = $('fDate').value || '';
  it.how = formHow;
  it.from = $('fFrom').value.trim();
  it.memo = $('fMemo').value.trim();
  it.count = Math.max(1, Math.min(999, parseInt($('fCount').value, 10) || 1));
  it.tags = formTags.slice();

  // 사진 저장: 0번부터 순서대로 다시 쓰고, 줄어든 만큼은 지운다
  const photos = formPhotos.filter(Boolean);
  const oldN = photoCount(it);
  const jobs = [];
  for (let i = 0; i < Math.max(oldN, photos.length); i++) {
    const key = photoKey(it.id, i);
    forgetPhotoURL(key);
    jobs.push(i < photos.length ? putPhoto(key, photos[i].blob) : delPhoto(key));
  }
  it.photoN = photos.length;

  const wasNew = !editingId;
  Promise.all(jobs).catch(function () { toast('사진 저장에 실패했어요'); }).then(function () {
    if (fromWishId) {
      state.wishes = state.wishes.filter(function (w) { return w.id !== fromWishId; });
      fromWishId = null;
    }
    save();
    $('addOverlay').classList.remove('on');
    renderShelf(); renderWish(); renderStats();
    if (wasNew) showReveal(it);
    else toast('고쳤어요');
  });
};

$('deleteItemBtn').onclick = function () {
  const it = state.items.find(function (i) { return i.id === editingId; });
  if (!it) return;
  if (!confirm('"' + it.name + '"을(를) 진열장에서 지울까요?\n되돌릴 수 없어요.')) return;
  const keys = allPhotoKeys(it);
  Promise.all(keys.map(function (k) { forgetPhotoURL(k); return delPhoto(k).catch(function () {}); }))
  .then(function () {
    state.items = state.items.filter(function (i) { return i.id !== it.id; });
    save();

    toast('지웠어요');

};

// ================== 자랑 카드 (그림 파일로 저장/공유) ==================
// 보물 하나를 카드 그림으로 그려서 친구에게 보낼 수 있게 만든다.
function themeColors() {
  const cs = getComputedStyle(document.documentElement);
  const get = function (n) { return cs.getPropertyValue(n).trim(); };
  return {
    bg: get('--bg'), bg2: get('--bg2'), card: get('--card'),
    wood: get('--wood'), woodD: get('--wood-d'), woodL: get('--wood-l'),
    accent: get('--accent'), text: get('--text'), sub: get('--sub'),
  };
}
function drawStar(ctx, cx, cy, r, fill) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 === 0 ? r : r * 0.46;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    ctx[i === 0 ? 'moveTo' : 'lineTo'](cx + rr * Math.cos(a), cy + rr * Math.sin(a));
  }
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function makeShareCard(it) {
  const C = themeColors();
  const W = 840, H = 1120;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');

  // 배경 + 나무 액자
  ctx.fillStyle = C.bg2; ctx.fillRect(0, 0, W, H);
  const pad = 34;
  ctx.fillStyle = C.woodD;
  roundRect(ctx, pad, pad, W - pad * 2, H - pad * 2, 34); ctx.fill();
  ctx.fillStyle = C.bg;
  roundRect(ctx, pad + 14, pad + 14, W - (pad + 14) * 2, H - (pad + 14) * 2, 24); ctx.fill();

  const boxX = pad + 46, boxW = W - (pad + 46) * 2, boxY = pad + 52, boxH = 620;

  const finish = function () {
    // 이름
    ctx.fillStyle = C.text;
    ctx.textAlign = 'center';
    ctx.font = 'bold 52px -apple-system, "Apple SD Gothic Neo", sans-serif';
    let nm = it.name;
    while (ctx.measureText(nm).width > boxW && nm.length > 4) nm = nm.slice(0, -1);
    if (nm !== it.name) nm += '…';
    ctx.fillText(nm, W / 2, boxY + boxH + 92);

    // 별점 (반 개까지 그림)
    const sc = 5, sr = 25, gap = 14, totalW = sc * sr * 2 + (sc - 1) * gap;
    let sx = W / 2 - totalW / 2 + sr;
    const sy = boxY + boxH + 152;
    for (let i = 0; i < sc; i++) {
      drawStar(ctx, sx, sy, sr, C.woodL);
      const fillPart = Math.max(0, Math.min(1, (it.rank || 0) - i));
      if (fillPart > 0) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(sx - sr, sy - sr, sr * 2 * fillPart, sr * 2);
        ctx.clip();
        drawStar(ctx, sx, sy, sr, C.accent);
        ctx.restore();
      }
      sx += sr * 2 + gap;
    }

    // 설명 줄
    ctx.font = '30px -apple-system, "Apple SD Gothic Neo", sans-serif';
    ctx.fillStyle = C.sub;
    const bits = [colOf(it.col).name];
    if (it.how) bits.push(it.how);
    if (it.date) bits.push(prettyDate(it.date));
    ctx.fillText(bits.join('  ·  '), W / 2, boxY + boxH + 222);
    if (it.count > 1) ctx.fillText('같은 것 ' + it.count + '개', W / 2, boxY + boxH + 266);

    // 아래 서명
    ctx.font = 'bold 26px -apple-system, sans-serif';
    ctx.fillStyle = C.woodD;
    ctx.fillText('내 보물창고', W / 2, H - pad - 46);

    cv.toBlob(function (blob) {
      if (!blob) { toast('카드를 만들지 못했어요'); return; }
      const fileName = (it.name || '보물') + '-자랑카드.png';
      const file = new File([blob], fileName, { type: 'image/png' });

      const download = function () {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
        toast('자랑 카드를 저장했어요');
      };

      // 폰·태블릿이면 공유 창(카톡 등)으로, 컴퓨터에서는 파일로 저장.
      // 컴퓨터 크롬은 "공유할 수 있다"고 해놓고 실제로는 아무 창도 안 뜨는 경우가 있어서
      // 손가락으로 쓰는 기기일 때만 공유를 쓴다. 그마저 실패하면 파일 저장으로 넘어간다.
      const isTouchDevice = navigator.maxTouchPoints > 0;
      if (isTouchDevice && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: it.name }).catch(function (err) {
          if (err && err.name === 'AbortError') return;  // 사용자가 스스로 닫은 것
          download();
        });
        return;
      }
      download();
    }, 'image/png');
  };

  // 사진 자리 (사진이 없으면 진열장 그림)
  ctx.fillStyle = C.card;
  roundRect(ctx, boxX, boxY, boxW, boxH, 22); ctx.fill();

  if (photoCount(it) > 0) {
    photoURL(photoKey(it.id, 0)).then(function (u) {
      if (!u) { finish(); return; }
      const img = new Image();
      img.onload = function () {
        ctx.save();
        roundRect(ctx, boxX, boxY, boxW, boxH, 22); ctx.clip();
        // 꽉 차게(잘라서) 그리기
        const s = Math.max(boxW / img.width, boxH / img.height);
        const dw = img.width * s, dh = img.height * s;
        ctx.drawImage(img, boxX + (boxW - dw) / 2, boxY + (boxH - dh) / 2, dw, dh);
        ctx.restore();
        finish();
      };
      img.onerror = finish;
      img.src = u;
    }).catch(finish);
  } else {
    ctx.fillStyle = C.woodL;
    ctx.font = 'bold 200px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('?', W / 2, boxY + boxH / 2 + 70);
    finish();
  }
}

// ================== 사진 크게 보기 ==================
let viewerItem = null, viewerIdx = 0;
function openViewer(it, start) {
  viewerItem = it;
  viewerIdx = start || 0;
  renderViewer();
  $('viewer').classList.add('on');
}
function renderViewer() {
  const it = viewerItem;
  if (!it) return;
  const n = photoCount(it);
  const box = $('vImg');
  box.innerHTML = '';
  photoURL(photoKey(it.id, viewerIdx)).then(function (u) {
    if (!u) return;
    const img = document.createElement('img');
    img.src = u;
    img.alt = it.name;
    box.innerHTML = '';
    box.appendChild(img);
  });
  $('vName').textContent = it.name + (n > 1 ? '  (' + (viewerIdx + 1) + '/' + n + ')' : '');
  $('vPrev').classList.toggle('hidden', n < 2);
  $('vNext').classList.toggle('hidden', n < 2);
}
function viewerMove(d) {
  const n = photoCount(viewerItem);
  if (n < 2) return;
  viewerIdx = (viewerIdx + d + n) % n;
  renderViewer();
}
$('vPrev').onclick = function (e) { e.stopPropagation(); viewerMove(-1); };
$('vNext').onclick = function (e) { e.stopPropagation(); viewerMove(1); };
$('vClose').onclick = function () { $('viewer').classList.remove('on'); };
$('viewer').onclick = function (e) { if (e.target === $('viewer') || e.target === $('vImg')) $('viewer').classList.remove('on'); };
document.addEventListener('keydown', function (e) {
  if (!$('viewer').classList.contains('on')) return;
  if (e.key === 'ArrowLeft') viewerMove(-1);
  if (e.key === 'ArrowRight') viewerMove(1);
  if (e.key === 'Escape') $('viewer').classList.remove('on');
});
// 손가락으로 옆으로 밀어 넘기기
let touchX = null;
$('viewer').addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; });
$('viewer').addEventListener('touchend', function (e) {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 45) viewerMove(dx < 0 ? 1 : -1);
  touchX = null;
});

const SYM_LIST = ['card','block','ribbon','book','ball','gamepad','bear','palette',
                  'gem','car','medal','box','star','music','rocket','flower','dino'];
let editingCol = null, colSym = SYM_LIST[0], colStyle = 'shelf';

function openCol(id) {

function renderStylePick() {
  $('cStyle').querySelectorAll('button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.style === colStyle);
  });
  $('styleNote').textContent = colStyle === 'books'
    ? '책등에 제목이 세로로 적힌 채 책꽂이에 꽂혀요. 만화책·책에 어울려요.'
    : '사진 카드가 선반 위에 놓여요. 카드·레고·잡화에 어울려요.';
}
$('cStyle').onclick = function (e) {
  const b = e.target.closest('button');
  if (!b) return;
  colStyle = b.dataset.style;
  renderStylePick();
};

function renderSymPick() {
  const box = $('cEmoji');
  box.innerHTML = '';
  SYM_LIST.forEach(function (s) {
    const b = elh('button', colSym === s ? 'on' : '', symbol(s, 24));
    b.dataset.sym = s;
    b.onclick = function () { colSym = s; renderSymPick(); };
    box.appendChild(b);
  });
}
$('saveColBtn').onclick = function () {
  const name = $('cName').value.trim();
  if (!name) { toast('진열장 이름을 적어주세요!'); return; }
  if (editingCol) {
    const c = colOf(editingCol);
    c.name = name; c.sym = colSym; c.style = colStyle;
  } else {
    const c = { id: newId('c'), name: name, sym: colSym, style: colStyle };
    state.collections.push(c);
    curCol = c.id;
  }
  save();
  $('colOverlay').classList.remove('on');
  renderShelf(); renderStats(); renderColManage();
  toast(editingCol ? '진열장을 고쳤어요' : '새 진열장이 생겼어요');
};
$('deleteColBtn').onclick = function () {
  if (!editingCol) return;
  const n = state.items.filter(function (i) { return i.col === editingCol; }).length;
  if (n > 0) { alert('이 진열장에 보물이 ' + n + '개 있어요.\n먼저 옮기거나 지워야 진열장을 없앨 수 있어요.'); return; }
  if (state.collections.length <= 1) { alert('진열장은 하나 이상 있어야 해요.'); return; }
  if (!confirm('"' + colOf(editingCol).name + '" 진열장을 없앨까요?')) return;
  state.wishes = state.wishes.filter(function (w) { return w.col !== editingCol; });
  state.collections = state.collections.filter(function (c) { return c.id !== editingCol; });
  if (curCol === editingCol) curCol = 'all';
  save();
  $('colOverlay').classList.remove('on');
  renderShelf(); renderWish(); renderStats(); renderColManage();
  toast('진열장을 없앴어요');
};

// ================== 설정 ==================
function renderThemeGrid() {
  const box = $('themeGrid');
  box.innerHTML = '';
  THEMES.forEach(function (t) {
    const c = el('div', 'theme-card' + (state.settings.theme === t.id ? ' on' : ''));
    const sw = el('div', 'theme-swatch');
    sw.style.background = t.bg;
    sw.style.borderColor = t.wood;
    c.appendChild(sw);
    c.appendChild(el('div', '', t.name));
    c.onclick = function () {
      state.settings.theme = t.id;
      save(); applyTheme(); renderThemeGrid();
    };
    box.appendChild(c);
  });
}
function renderFsPick() {
  $('fsPick').querySelectorAll('button').forEach(function (b) {
    b.classList.toggle('on', Number(b.dataset.fs) === state.settings.fontScale);
  });
}
$('fsPick').onclick = function (e) {
  const b = e.target.closest('button');
  if (!b) return;
  state.settings.fontScale = Number(b.dataset.fs);
  save(); applyTheme(); renderFsPick();
};
function renderColManage() {
  const box = $('colManage');
  box.innerHTML = '';
  state.collections.forEach(function (c) {
    const r = el('div', 'row-stat');
    r.style.cursor = 'pointer';
    r.appendChild(elh('span', 'r-sym', symbol(c.sym, 20)));
    r.appendChild(el('span', 'grow', c.name));
    r.appendChild(elh('span', 'r-sym', icon('edit', 16)));
    r.onclick = function () { openCol(c.id); };
    box.appendChild(r);
  });
  const add = elh('button', 'mini-btn btn-ico', icon('plus', 14) + '새 진열장 만들기');
  add.onclick = function () { openCol(null); };
  box.appendChild(add);
}

// ---- 백업 / 복원 ----
// 사진까지 한 파일에 담기 위해 사진을 글자(base64)로 바꿔서 넣습니다.
function blobToDataURL(blob) {
  return new Promise(function (resolve) {
    const r = new FileReader();
    r.onload = function () { resolve(r.result); };
    r.onerror = function () { resolve(null); };
    r.readAsDataURL(blob);
  });
}
function dataURLToBlob(url) {
  const parts = url.split(',');
  const mime = (parts[0].match(/:(.*?);/) || [])[1] || 'image/jpeg';
  const bin = atob(parts[1]);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

$('backupBtn').onclick = function () {
  toast('백업 파일을 만드는 중...');
  const keys = [];
  state.items.forEach(function (i) { allPhotoKeys(i).forEach(function (k) { keys.push(k); }); });
  Promise.all(keys.map(function (k) {
    return getPhoto(k).then(function (b) {
      return b ? blobToDataURL(b).then(function (u) { return [k, u]; }) : null;
    }).catch(function () { return null; });
  })).then(function (pairs) {
    const photos = {};
    pairs.forEach(function (p) { if (p && p[1]) photos[p[0]] = p[1]; });
    const data = { app: 'treasure-box', version: 1, savedAt: new Date().toISOString(), state: state, photos: photos };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '내보물창고-' + todayStr() + '.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    toast('백업 파일을 저장했어요');
  });
};

$('restoreBtn').onclick = function () { $('restoreInput').click(); };
$('restoreInput').onchange = function () {
  const f = this.files && this.files[0];
  this.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = function () {
    let data;
    try { data = JSON.parse(r.result); } catch (e) { alert('이 파일은 열 수 없어요. 백업 파일이 맞나요?'); return; }
    if (!data || data.app !== 'treasure-box' || !data.state || !Array.isArray(data.state.items)) {
      alert('내 보물창고 백업 파일이 아니에요.');
      return;
    }
    const n = data.state.items.length;
    if (!confirm('백업을 불러오면 지금 있는 보물이 모두 백업 내용으로 바뀝니다.\n\n백업에 든 보물: ' + n + '개\n계속할까요?')) return;

    // 지금 사진 전부 지우고 백업 사진으로 교체
    idb('readwrite', function (s) { return s.clear(); }).catch(function () {}).then(function () {
      Object.keys(urlCache).forEach(forgetPhotoURL);
      const photos = data.photos || {};
      return Promise.all(Object.keys(photos).map(function (id) {
        return putPhoto(id, dataURLToBlob(photos[id])).catch(function () {});
      }));
    }).then(function () {
      Object.keys(state).forEach(function (k) { delete state[k]; });
      Object.assign(state, data.state);
      if (!state.settings) state.settings = { theme: 'peach', fontScale: 1, sort: 'new' };
      (state.collections || []).forEach(function (c) {
        if (!c.sym) { c.sym = EMOJI_TO_SYM[c.emoji] || 'box'; delete c.emoji; }
      });
      save();
      applyTheme();
      curCol = 'all';
      renderAll();
      $('setOverlay').classList.remove('on');
      toast('보물창고를 되살렸어요!');
    });
  };
  r.readAsText(f);
};

// ---- 처음부터 다시 시작 (초기화) ----
// 실수로 누르면 큰일이라 두 번 물어본다.
$('resetBtn').onclick = function () {
  const n = state.items.length;
  const msg = n > 0
    ? '보물 ' + n + '개와 사진이 모두 지워지고 처음 상태로 돌아갑니다.\n정말 초기화할까요?'
    : '처음 상태로 되돌릴까요?';
  if (!confirm(msg)) return;
  if (n > 0 && !confirm('마지막 확인이에요!\n지운 보물은 되돌릴 수 없어요. 정말 지울까요?')) return;

  idb('readwrite', function (s) { return s.clear(); }).catch(function () {}).then(function () {
    Object.keys(urlCache).forEach(forgetPhotoURL);
    localStorage.removeItem(STORAGE_KEY);
    // 지금 화면의 데이터도 기본값으로 되돌림 (새로고침 없이 바로 반영)
    state.items = [];
    state.wishes = [];
    state.seq = 1;
    state.collections = [
      { id: 'c-card',  name: '카드',        sym: 'card'   },
      { id: 'c-lego',  name: '레고·피규어', sym: 'block'  },
      { id: 'c-small', name: '잡화',        sym: 'ribbon' },
      { id: 'c-book',  name: '책·만화책',   sym: 'book'   },
    ];
    state.settings = { theme: 'peach', fontScale: 1, sort: 'new' };
    save();
    applyTheme();
    curCol = 'all';
    searchWord = '';
    $('searchInput').value = '';
    $('searchBar').classList.add('hidden');
    renderAll();
    renderThemeGrid(); renderFsPick(); renderColManage();
    closeOv('setOverlay');
    showTab('shelf');
    toast('처음 상태로 되돌렸어요');
  });
};

// ================== 탭 / 검색 / 오버레이 ==================
function showTab(name) {
  document.querySelectorAll('.tab-page').forEach(function (p) {
    p.classList.toggle('active', p.id === 'page-' + name);
  });
  document.querySelectorAll('.tabbar button').forEach(function (b) {
    b.classList.toggle('active', b.dataset.tab === name);
  });
  $('addBtn').classList.toggle('hidden', name === 'stats');
  if (name === 'wish') renderWish();
  if (name === 'stats') renderStats();
}
document.querySelectorAll('.tabbar button').forEach(function (b) {
  b.onclick = function () { showTab(b.dataset.tab); };
});

$('addBtn').onclick = function () {
  if ($('page-wish').classList.contains('active')) openWish();
  else openAdd(null);
};
$('wishAddBtn').onclick = openWish;

$('searchBtn').onclick = function () {
  const bar = $('searchBar');
  bar.classList.toggle('hidden');
  if (!bar.classList.contains('hidden')) { $('searchInput').focus(); }
  else { searchWord = ''; $('searchInput').value = ''; renderShelf(); }
  showTab('shelf');
};
$('searchClose').onclick = function () {
  $('searchBar').classList.add('hidden');
  searchWord = ''; $('searchInput').value = '';
  renderShelf();
};
$('searchInput').oninput = function () {
  searchWord = this.value.trim();
  renderShelf();
};

$('sortBtn').onclick = function () {
  const order = ['new', 'rank', 'name'];
  const i = order.indexOf(state.settings.sort);
  state.settings.sort = order[(i + 1) % order.length];
  save();
  renderShelf();
  toast(SORT_NAME[state.settings.sort] + '으로 정렬했어요');
};

$('gearBtn').onclick = function () {
  renderThemeGrid(); renderFsPick(); renderColManage();
  openOv('setOverlay');
};

// 오버레이 바깥이나 ✕ 를 누르면 닫기
document.querySelectorAll('.overlay').forEach(function (ov) {
  ov.addEventListener('click', function (e) {
    if (e.target === ov) ov.classList.remove('on');
    const c = e.target.closest('[data-close]');
    if (c) $(c.dataset.close).classList.remove('on');
  });
});

// ================== 시작 ==================
// 화면에 고정으로 붙어 있는 그림들을 채운다 (HTML에는 빈 자리만 있음)

  $('logoBox').innerHTML = icon('shelf', 19);
  $('searchBtn').innerHTML = icon('search', 19);
  $('gearBtn').innerHTML = icon('gear', 19);
  $('searchIco').innerHTML = icon('search', 17);
  $('searchClose').innerHTML = icon('close', 16);
  $('addBtn').innerHTML = icon('plus', 28);
  $('revealBack').innerHTML = symbol('box', 96);
  const tabIcons = ['shelf', 'star', 'chart'];
  document.querySelectorAll('.tabbar button').forEach(function (b, i) {
    b.querySelector('.ic').innerHTML = i === 1 ? symbol('star', 20) : icon(tabIcons[i], 20);
  });
  document.querySelectorAll('.btn-x[data-close]').forEach(function (b) {
    b.innerHTML = icon('close', 18);
  });
  $('backupBtn').querySelector('.bi').innerHTML = icon('down', 18);
  $('restoreBtn').querySelector('.bi').innerHTML = icon('up', 18);
  $('resetBtn').querySelector('.bi').innerHTML = icon('reset', 18);
  $('vClose').innerHTML = icon('close', 17);
  $('vPrev').innerHTML = icon('left', 22);
  $('vNext').innerHTML = icon('right', 22);
}

function renderAll() {
  renderShelf();
  renderWish();
  renderStats();
}
fillStaticIcons();
renderHow();
applyTheme();
openDB().catch(function () {
  toast('사진 저장소를 열지 못했어요 (사진 없이 사용 가능)');
}).then(function () {
  renderAll();
});
</script>
